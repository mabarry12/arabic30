<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arabic 30">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="color-scheme" content="light dark">
<title>Arabic in 30 Days</title>
<style>
:root{
  --paper:#F6F8FB; --paper2:#E9EEF6; --ink:#14213D; --ink2:#4F5E78;
  --rule:#C6D3E5; --red:#C8372D; --teal:#1B7F6B; --star:#C98F0A;
  --ar:"Amiri","Noto Naskh Arabic","Scheherazade New","Geeza Pro","Traditional Arabic","Segoe UI",serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1626; --paper2:#18223A; --ink:#E8EDF7; --ink2:#9CAAC4;
    --rule:#2B3957; --red:#E8695F; --teal:#4CC2A8; --star:#F0C14B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));min-height:100vh}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700}
p{margin:0}

.top{padding:20px 20px 6px}
.top h1{font-size:30px;line-height:1.15}
.top .theme{color:var(--ink2);margin-top:2px}
.stats{display:flex;gap:22px;padding:10px 20px 14px}
.stat b{display:block;font-family:var(--serif);font-size:22px;line-height:1.1}
.stat span{font-size:13px;color:var(--ink2)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 14px;scrollbar-width:thin}
.chip{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--rule);border-radius:4px;font-family:var(--serif);font-weight:700;color:var(--ink2)}
.chip.done{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.chip.here{border:2px solid var(--ink);color:var(--ink)}
.chip.lock{border-style:dashed;opacity:.7}
.chip.sel{box-shadow:0 3px 0 var(--red)}

.list{position:relative;border-top:1px solid var(--rule)}
.list::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:2px;background:var(--red);opacity:.75}
.task{display:grid;grid-template-columns:52px 1fr;border-bottom:1px solid var(--rule)}
.chk{width:28px;height:28px;margin:16px auto 0;border:2px solid var(--ink2);border-radius:5px;background:var(--paper);font-weight:800;line-height:1;color:var(--paper);position:relative;z-index:1}
.task.on .chk{background:var(--teal);border-color:var(--teal)}
.tb{padding:14px 20px 18px 16px;min-width:0}
.tb h3{font-size:18px;margin-bottom:4px}
.task.on .tb h3{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1px}
.note{color:var(--ink2);font-size:15px;margin:4px 0 8px}
.tip{margin:0 20px 14px;padding:10px 14px;border-left:3px solid var(--red);background:var(--paper2);font-size:15px}

.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.wr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed var(--rule)}
.wr:first-of-type{border-top:0}
.wl{display:flex;flex-direction:column;min-width:0}
.wl .tr{font-weight:600}
.wl .en{color:var(--ink2);font-size:15px}
.wr .ar{font-size:28px;line-height:1.7;text-align:right}
.lt{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.lt .ar{width:56px;height:56px;border:1px solid var(--rule);border-radius:6px;font-size:34px;line-height:1.5;background:var(--paper2)}

.btn{display:inline-block;padding:13px 20px;border-radius:6px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:15px}
.btn.wide{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{padding:14px 20px}
.pad p+p{margin-top:10px}
.done-banner{margin:18px 20px;padding:16px;border:2px solid var(--teal);border-radius:6px}
.done-banner h2{font-size:20px;margin-bottom:6px}

.fc{margin:6px 20px 16px;border:1px solid var(--rule);border-radius:6px;background:
  repeating-linear-gradient(to bottom,transparent 0 39px,var(--rule) 39px 40px),var(--paper);position:relative;overflow:hidden}
.fc::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--red);opacity:.75}
.fc .tag{position:absolute;right:12px;top:8px;font-size:13px;color:var(--ink2);background:var(--paper);padding:0 6px}
.fc .face{min-height:200px;display:flex;align-items:center;justify-content:center;padding:32px 20px 12px 40px}
.xl{font-size:64px;line-height:1.7;text-align:center}
.ans{padding:12px 20px 18px 44px;background:var(--paper);border-top:1px solid var(--rule)}
.ans .tr2{font-size:22px;font-weight:700;font-family:var(--serif)}
.ans .en2{font-size:18px;color:var(--ink2);margin-bottom:8px}

.detail{margin:6px 20px 16px;padding:14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper2)}
.detail .big{font-size:84px;line-height:1.5;text-align:center;display:block}
.detail h2{font-size:22px;text-align:center}
.detail .snd{text-align:center;color:var(--ink2);margin:2px 0 10px}
.forms{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.forms div{text-align:center;min-width:64px}
.forms .ar{font-size:36px;line-height:1.5;display:block;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.forms small{font-size:12px;color:var(--ink2)}
.ex{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule)}
.ex .ar{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 20px 16px}
.lbtn{aspect-ratio:1;border:1px solid var(--rule);border-radius:6px;font-family:var(--ar);font-size:34px;background:var(--paper)}
.lbtn.sel{border:2px solid var(--ink);background:var(--paper2)}
.marks .wr .ar{font-size:30px}

.q{margin:6px 20px}
.qword{border:1px solid var(--rule);border-radius:6px;padding:12px;text-align:center;background:var(--paper2)}
.qword .ar{font-size:72px;line-height:1.6;display:block}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{padding:16px;border:2px solid var(--ink2);border-radius:8px;font-size:20px;font-weight:600;text-align:center;background:var(--paper)}
.opt.ok{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.opt.bad{border-color:var(--red);color:var(--red);text-decoration:line-through}
.score{font-family:var(--serif);font-size:56px;text-align:center;margin:10px 0}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{padding:16px 2px 14px;font-size:13px;font-weight:600;color:var(--ink2);border-top:3px solid transparent;margin-top:-1px}
nav button.on{color:var(--ink);border-top-color:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;max-width:88%;font-size:15px;opacity:0;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.reset{display:block;margin:22px auto 8px;color:var(--ink2);text-decoration:underline;font-size:14px}

.wr .ar{max-width:58%}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin:4px 20px 12px}
.seg button{padding:8px 18px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--paper)}
.glist{border-top:1px solid var(--rule)}
.gl{border-bottom:1px solid var(--rule)}
.grow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 20px;text-align:left;gap:12px}
.grow .t{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.3}
.grow .d{color:var(--ink2);font-size:14px;white-space:nowrap}
.grow[disabled]{opacity:.5;cursor:default}
.gbody{padding:0 20px 18px}
.gp{margin:8px 0}
.gh{font-size:17px;margin:16px 0 2px}
.mist{margin:16px 0 0;padding:10px 14px;border-left:3px solid var(--red);background:var(--paper2);font-size:15px}
.lnk{text-decoration:underline;font-weight:700}

.bar{display:flex;justify-content:flex-end;padding:10px 20px 0}
.who{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--paper2);font-weight:600}
.who .sw{color:var(--ink2);font-weight:500;font-size:13px}
.av{font-size:22px;line-height:1}
.pf{margin:0 20px 14px;padding:14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.pf.cur{border:2px solid var(--ink)}
.pfh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.pfh .av{font-size:36px}
.pfs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.pfs b{display:block;font-family:var(--serif);font-size:22px;line-height:1.1}
.pfs span{font-size:12px;color:var(--ink2)}
.dots{display:flex;gap:6px;margin:8px 0}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:12px;color:var(--ink2)}
.dot.on{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.avs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.avs button{width:46px;height:46px;border:1px solid var(--rule);border-radius:8px;font-size:24px;background:var(--paper)}
.avs button.on{border:2px solid var(--ink);background:var(--paper2)}
.fi{width:100%;padding:12px;border:1.5px solid var(--ink2);border-radius:6px;font:inherit;background:var(--paper);color:var(--ink)}
textarea.fi{min-height:130px;font-size:13px}
.sec{margin:20px 20px 0;padding-top:14px;border-top:1px solid var(--rule)}
.sec h2{font-size:20px;margin-bottom:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";

/* ---------- DATA ---------- */
// word = [arabic, transliteration, english]
const DAYS = [
{theme:"Greetings and your first letters",letters:["ا","ب","ت","ث"],
 words:[["مَرْحَبًا","marḥaban","hello"],["شُكْرًا","shukran","thank you"],["عَفْوًا","ʿafwan","you're welcome"],["نَعَمْ","naʿam","yes"],["لَا","lā","no"],["بَابٌ","bāb","door"]],
 quran:[["حَمْدٌ","ḥamd","praise"],["رَبٌّ","rabb","Lord"]],
 qf:"Al-Fatiha verses 1 to 2: listen three times, then recite them.",
 pat:[["مَرْحَبًا!","marḥaban!","Hello!"],["شُكْرًا، عَفْوًا","shukran, ʿafwan","Thank you, you're welcome"]],
 tip:"Arabic is written from right to left. Letters change shape depending on where they sit in a word.",
 kids:"Say the four letters together as a family. Find the letter ب in the word باب."},
{theme:"Asking how someone is",letters:["ج","ح","خ"],
 words:[["السَّلَامُ عَلَيْكُمْ","as-salāmu ʿalaykum","peace be upon you"],["كَيْفَ حَالُكَ؟","kayfa ḥāluka?","how are you? (to a man)"],["بِخَيْرٍ","bi-khayr","well, fine"],["صَبَاحٌ","ṣabāḥ","morning"],["مَسَاءٌ","masāʾ","evening"]],
 quran:[["عَالَمِينَ","ʿālamīn","worlds"]],
 qf:"Al-Fatiha verses 2 to 3: say what each verse means in your own words.",
 pat:[["السَّلَامُ عَلَيْكُمْ. كَيْفَ حَالُكَ؟","as-salāmu ʿalaykum. kayfa ḥāluka?","Peace be upon you. How are you?"],["بِخَيْرٍ، شُكْرًا","bi-khayr, shukran","Fine, thank you"],["صَبَاحُ الْخَيْرِ","ṣabāḥ al-khayr","Good morning"]],
 tip:"To a woman, say kayfa ḥāluki.",
 kids:"Before breakfast, greet every family member with a full greeting."},
{theme:"I, you, he, she",letters:["د","ذ","ر","ز"],
 words:[["أَنَا","anā","I"],["أَنْتَ","anta","you (to a man)"],["أَنْتِ","anti","you (to a woman)"],["هُوَ","huwa","he"],["هِيَ","hiya","she"]],
 quran:[["مَالِكٌ","mālik","owner, master"]],
 qf:"Al-Fatiha verses 3 to 4.",
 pat:[["أَنَا بِخَيْرٍ","anā bi-khayr","I am well"],["أَنْتَ بِخَيْرٍ","anta bi-khayr","You are well"],["هِيَ بِخَيْرٍ","hiya bi-khayr","She is well"]],
 tip:"Arabic has no word for am, is or are in the present. Anā bi-khayr literally means 'I well'.",
 kids:"Point at people and say anā, anta, anti, huwa, hiya as fast as you can."},
{theme:"This is...",letters:["س","ش","ص","ض"],
 words:[["نَحْنُ","naḥnu","we"],["هُمْ","hum","they"],["هَذَا","hādhā","this (masculine)"],["هَذِهِ","hādhihi","this (feminine)"],["كِتَابٌ","kitāb","book"]],
 quran:[["يَوْمٌ","yawm","day"],["دِينٌ","dīn","judgment, religion"]],
 qf:"Al-Fatiha verse 4: the Day of Judgment.",
 pat:[["هَذَا كِتَابٌ","hādhā kitāb","This is a book"],["هَذَا بَابٌ","hādhā bāb","This is a door"],["نَحْنُ بِخَيْرٍ","naḥnu bi-khayr","We are well"]],
 tip:"Use hādhā for masculine things and hādhihi for feminine ones.",
 kids:"Pick five things in the room. Say hādhā or hādhihi for each, and point."},
{theme:"Family",letters:["ط","ظ","ع","غ"],
 words:[["أَبٌ","ab","father"],["أُمٌّ","umm","mother"],["وَلَدٌ","walad","boy"],["بِنْتٌ","bint","girl"],["أَخٌ","akh","brother"],["أُخْتٌ","ukht","sister"]],
 quran:[["نَعْبُدُ","naʿbudu","we worship"],["نَسْتَعِينُ","nastaʿīnu","we ask for help"]],
 qf:"Al-Fatiha verse 5.",
 pat:[["هَذَا أَبِي","hādhā abī","This is my father"],["هَذِهِ أُمِّي","hādhihi ummī","This is my mother"],["هَذِهِ أُخْتِي","hādhihi ukhtī","This is my sister"]],
 tip:"Adding -ī to a noun means 'my': ab becomes abī.",
 kids:"Draw the family tree and label every person in Arabic."},
{theme:"Home and school",letters:["ف","ق","ك","ل"],
 words:[["بَيْتٌ","bayt","house"],["مَدْرَسَةٌ","madrasa","school"],["غُرْفَةٌ","ghurfa","room"],["طَاوِلَةٌ","ṭāwila","table"],["كُرْسِيٌّ","kursī","chair"],["نَافِذَةٌ","nāfidha","window"]],
 quran:[["اِهْدِنَا","ihdinā","guide us"],["صِرَاطٌ","ṣirāṭ","path"]],
 qf:"Al-Fatiha verses 6 to 7.",
 pat:[["هَذَا بَيْتِي","hādhā baytī","This is my house"],["هَذِهِ غُرْفَةٌ","hādhihi ghurfa","This is a room"],["هَذِهِ مَدْرَسَةٌ","hādhihi madrasa","This is a school"]],
 tip:"Many feminine words end in -a (ة): ghurfa, madrasa, ṭāwila, nāfidha.",
 kids:"Put sticky notes with the Arabic names on six things at home."},
{theme:"Food and drink",letters:["م","ن","ه","و","ي"],
 words:[["مَاءٌ","māʾ","water"],["خُبْزٌ","khubz","bread"],["حَلِيبٌ","ḥalīb","milk"],["تُفَّاحٌ","tuffāḥ","apple"],["أَرُزٌّ","aruzz","rice"],["سَمَكٌ","samak","fish"]],
 quran:[["مُسْتَقِيمٌ","mustaqīm","straight"]],
 qf:"Recite all of Al-Fatiha and say the meaning of every verse.",
 pat:[["هَذَا خُبْزٌ","hādhā khubz","This is bread"],["هَذَا حَلِيبٌ","hādhā ḥalīb","This is milk"],["أُرِيدُ مَاءً","urīdu māʾan","I want water"]],
 tip:"Learn urīdu māʾan as one chunk for now. On day 15 you will take it apart.",
 kids:"At snack time, everyone must ask in Arabic: urīdu māʾan."},
{theme:"Questions",study:"Review all 28 letters in the Letters tab. Then learn the three short vowels: fatḥa (a), ḍamma (u) and kasra (i). They are in the table at the bottom of that tab.",
 words:[["مَا","mā","what"],["مَنْ","man","who"],["أَيْنَ","ayna","where"],["كَيْفَ","kayfa","how"],["كَمْ","kam","how many"],["لِمَاذَا","li-mādhā","why"]],
 quran:[["قُلْ","qul","say"],["أَحَدٌ","aḥad","one"]],
 qf:"Al-Ikhlas verses 1 to 2: listen three times, then recite.",
 pat:[["مَا هَذَا؟","mā hādhā?","What is this?"],["مَنْ هَذَا؟","man hādhā?","Who is this?"],["أَيْنَ الْبَابُ؟","ayna l-bāb?","Where is the door?"]],
 tip:"Question words go at the start of the sentence.",
 kids:"Hide an object in a bag. Ask mā hādhā? until someone guesses."},
{theme:"My name and my things",study:"Learn sukūn (no vowel), shadda (a doubled letter) and tanwīn (the endings -an, -un, -in). They are in the table at the bottom of the Letters tab.",
 words:[["اِسْمٌ","ism","name"],["عِنْدِي","ʿindī","I have"],["عِنْدَكَ","ʿindaka","you have (to a man)"],["كِتَابِي","kitābī","my book"],["بَيْتُهُ","baytuhu","his house"]],
 quran:[["كُفُوًا","kufuwan","equal"]],
 qf:"Al-Ikhlas verses 3 to 4. Recite the whole surah.",
 pat:[["مَا اسْمُكَ؟","mā ismuka?","What is your name?"],["اِسْمِي ...","ismī ...","My name is ..."],["عِنْدِي كِتَابٌ","ʿindī kitāb","I have a book"]],
 tip:"Endings: -ī is my, -ka is your (to a man), -hu is his. Arabic says 'I have' as 'at me': ʿindī.",
 kids:"Each child introduces themselves and shows one thing: ismī ..., ʿindī ..."},
{theme:"Numbers 1 to 5",study:"Learn the long vowels ā, ī, ū (written with ا ي و). Then read ten words from your flashcards using only the Arabic.",
 words:[["وَاحِدٌ","wāḥid","one"],["اثْنَانِ","ithnān","two"],["ثَلَاثَةٌ","thalātha","three"],["أَرْبَعَةٌ","arbaʿa","four"],["خَمْسَةٌ","khamsa","five"]],
 quran:[["أَعُوذُ","aʿūdhu","I seek refuge"]],
 qf:"An-Nas verse 1: listen three times, then recite.",
 pat:[["وَاحِدٌ، اثْنَانِ، ثَلَاثَةٌ","wāḥid, ithnān, thalātha","One, two, three"],["أَرْبَعَةٌ، خَمْسَةٌ","arbaʿa, khamsa","Four, five"],["عِنْدِي أَخٌ وَاحِدٌ","ʿindī akh wāḥid","I have one brother"]],
 tip:"",
 kids:"Count steps, stairs and toys from 1 to 5 out loud."},
{theme:"Numbers 6 to 10",
 words:[["سِتَّةٌ","sitta","six"],["سَبْعَةٌ","sabʿa","seven"],["ثَمَانِيَةٌ","thamāniya","eight"],["تِسْعَةٌ","tisʿa","nine"],["عَشَرَةٌ","ʿashara","ten"]],
 quran:[["نَاسٌ","nās","people"]],
 qf:"An-Nas verses 1 to 2.",
 pat:[["سِتَّةٌ، سَبْعَةٌ، ثَمَانِيَةٌ","sitta, sabʿa, thamāniya","Six, seven, eight"],["تِسْعَةٌ، عَشَرَةٌ","tisʿa, ʿashara","Nine, ten"],["عِنْدِي أُخْتٌ وَاحِدَةٌ","ʿindī ukht wāḥida","I have one sister"]],
 tip:"Number words change with gender and with the thing counted. For now, learn them as plain counting.",

       fr:["Au présent, l'arabe <b>n'emploie pas</b> « suis, es, est, sommes, sont ». On place simplement les deux parties côte à côte : <i>moi</i> + <i>bien</i>, <i>ceci</i> + <i>un livre</i>.","C'est ce qu'on appelle une <b>phrase nominale</b> (une phrase sans verbe). C'est le type de phrase le plus courant au début, et tu en connais déjà plusieurs."]},
 ex:[["أَنَا بِخَيْرٍ","anā bi-khayr","I am well","Je vais bien"],["أَنْتَ بِخَيْرٍ","anta bi-khayr","You are well","Tu vas bien"],["نَحْنُ بِخَيْرٍ","naḥnu bi-khayr","We are well","Nous allons bien"],["هَذَا كِتَابٌ","hādhā kitāb","This is a book","Ceci est un livre"]],
 mistake:{en:"Do not add a word for 'is'. Just say the two parts. (The past and the future do use a verb, kāna, 'was', which you will meet later.)",fr:"N'ajoute pas de mot pour « est ». Dis simplement les deux parties. (Le passé et le futur utilisent un verbe, kāna, « était », que tu verras plus tard.)"}},

{day:6,title:{en:"Masculine and feminine",fr:"Masculin et féminin"},
 rule:{en:["Every Arabic noun is masculine or feminine, including things: a door is masculine, a school is feminine.","Most feminine nouns end in <b>ـة</b> (pronounced <b>-a</b>): madrasa, ghurfa, ṭāwila, nāfidha. Words for females are feminine too: umm, bint, ukht.","The gender decides which word you use for <b>this</b> (hādhā for masculine, hādhihi for feminine) and, later, the ending of adjectives and verbs."],
       fr:["Tout nom arabe est masculin ou féminin, y compris les objets : une porte est masculine, une école est féminine.","La plupart des noms féminins se terminent par <b>ـة</b> (prononcé <b>-a</b>) : madrasa, ghurfa, ṭāwila, nāfidha. Les mots qui désignent des femmes sont aussi féminins : umm, bint, ukht.","Le genre détermine le mot pour « ceci » (hādhā au masculin, hādhihi au féminin) et, plus tard, la terminaison des adjectifs et des verbes."]},
 ex:[["هَذَا بَابٌ","hādhā bāb","This is a door (masculine)","Ceci est une porte (masculin)"],["هَذِهِ غُرْفَةٌ","hādhihi ghurfa","This is a room (feminine)","Ceci est une chambre (féminin)"],["هَذَا أَخٌ","hādhā akh","This is a brother","Voici un frère"],["هَذِهِ أُخْتٌ","hādhihi ukht","This is a sister","Voici une sœur"]],
 mistake:{en:"Do not guess the gender from the English word. Learn each noun with hādhā or hādhihi. A few feminine words do not end in -a (you will meet yad, ʿayn and shams later): learn them as exceptions.",fr:"Ne devine pas le genre d'après le mot français : bāb (porte) est masculin en arabe. Apprends chaque nom avec hādhā ou hādhihi. Quelques mots féminins ne se terminent pas par -a (tu rencontreras yad, ʿayn et shams plus tard) : apprends-les comme des exceptions."}},

{day:7,title:{en:"'The' and 'a': al- and tanwīn",fr:"« Le » et « un » : al- et tanwīn"},
 rule:{en:["Arabic has no word for <b>a</b>. Instead, an indefinite noun ends with a double vowel mark called <b>tanwīn</b>: -un, -an or -in. So kitābun means 'a book'.","To say <b>the</b>, put <b>al-</b> in front and drop the tanwīn: al-kitābu = the book.","Before 14 'sun letters' (t, th, d, dh, r, z, s, sh, ṣ, ḍ, ṭ, ẓ, l, n) the <b>l</b> of al- is not pronounced and the next letter is doubled: at-tuffāḥu, not al-tuffāḥu. Before the other letters (moon letters) you say the l."],
       fr:["L'arabe n'a pas de mot pour <b>un/une</b>. Un nom indéfini se termine par une double voyelle appelée <b>tanwīn</b> : -un, -an ou -in. Ainsi kitābun signifie « un livre ».","Pour dire <b>le/la</b>, on place <b>al-</b> devant et on supprime le tanwīn : al-kitābu = le livre.","Devant 14 « lettres solaires » (t, th, d, dh, r, z, s, sh, ṣ, ḍ, ṭ, ẓ, l, n), le <b>l</b> de al- ne se prononce pas et la lettre suivante est doublée : at-tuffāḥu, et non al-tuffāḥu. Devant les autres lettres (lettres lunaires), on prononce le l."]},
 ex:[["الْكِتَابُ","al-kitābu","the book (a book: kitābun)","le livre (un livre : kitābun)"],["الْبَيْتُ","al-baytu","the house (a house: baytun)","la maison (une maison : baytun)"],["الْحَلِيبُ","al-ḥalību","the milk (moon letter: the l is heard)","le lait (lettre lunaire : on entend le l)"],["التُّفَّاحُ","at-tuffāḥu","the apple (sun letter t)","la pomme (lettre solaire t)"],["السَّمَكُ","as-samaku","the fish (sun letter s)","le poisson (lettre solaire s)"]],
 mistake:{en:"Do not use al- and tanwīn together. 'The book' is al-kitābu, never al-kitābun.",fr:"N'utilise pas al- et le tanwīn ensemble. « Le livre » se dit al-kitābu, jamais al-kitābun."}},

{day:9,title:{en:"My, your, his: attached endings",fr:"Mon, ton, son : les terminaisons collées"},
 rule:{en:["Instead of separate words for my, your and his, Arabic <b>glues a short ending</b> onto the noun: bayt (house) + ī = baytī (my house). You already use this in abī, ummī, ukhtī and kitābī.","The noun then counts as 'the', so it takes no al- and no tanwīn."],
       fr:["Au lieu de mots séparés pour mon, ton et son, l'arabe <b>colle une courte terminaison</b> au nom : bayt (maison) + ī = baytī (ma maison). Tu l'utilises déjà dans abī, ummī, ukhtī et kitābī.","Le nom devient alors défini (« le »), donc il ne prend ni al- ni tanwīn."]},
 ex:[["بَيْتِي","baytī","my house (-ī)","ma maison (-ī)"],["بَيْتُكَ","baytuka","your house, to a man (-ka)","ta maison, à un homme (-ka)"],["بَيْتُكِ","baytuki","your house, to a woman (-ki)","ta maison, à une femme (-ki)"],["بَيْتُهُ","baytuhu","his house (-hu)","sa maison, à lui (-hu)"],["بَيْتُهَا","baytuhā","her house (-hā)","sa maison, à elle (-hā)"],["بَيْتُنَا","baytunā","our house (-nā)","notre maison (-nā)"],["بَيْتُهُمْ","baytuhum","their house (-hum)","leur maison (-hum)"]],
 mistake:{en:"Say baytī, never 'al-baytī'. And -hu or -hā depends on the owner, not on the thing owned: 'his book' and 'his sister' both use -hu.",fr:"Dis baytī, jamais « al-baytī ». Et -hu ou -hā dépend du possesseur, pas de la chose possédée : « son livre » et « sa sœur » (à lui) prennent tous deux -hu. C'est différent du français."}},

{day:9,title:{en:"'Have': ʿinda",fr:"« Avoir » : ʿinda"},
 rule:{en:["Arabic has no everyday verb 'to have'. It says <b>'at me there is'</b> with the word <b>ʿinda</b> (at, by) plus an ending: ʿindī = I have.","ʿinda takes the same endings as above. The owner comes first and the thing owned comes after, without 'the'."],
       fr:["L'arabe n'a pas de verbe « avoir » courant. Il dit <b>« chez moi il y a »</b> avec le mot <b>ʿinda</b> (chez, auprès de) suivi d'une terminaison : ʿindī = j'ai.","ʿinda prend les mêmes terminaisons que ci-dessus. Le possesseur vient en premier, puis la chose possédée, sans « le »."]},
 ex:[["عِنْدِي كِتَابٌ","ʿindī kitāb","I have a book","J'ai un livre"],["عِنْدَكَ بَيْتٌ","ʿindaka bayt","You have a house (to a man)","Tu as une maison (à un homme)"],["عِنْدَهُ أَخٌ","ʿindahu akh","He has a brother","Il a un frère"],["عِنْدَهَا أُخْتٌ","ʿindahā ukht","She has a sister","Elle a une sœur"]],
 mistake:{en:"Do not look for a verb. Literally, ʿindahu akh is 'at him a brother'. (To say 'I do not have', you will use laysa on day 27.)",fr:"Ne cherche pas de verbe. Littéralement, ʿindahu akh = « chez lui un frère ». (Pour dire « je n'ai pas », tu utiliseras laysa au jour 27.)"}},

{day:11,title:{en:"'X of Y': the boy's house",fr:"« X de Y » : la maison du garçon"},
 rule:{en:["To say <b>X of Y</b>, put the two nouns next to each other: bayt al-walad = the house of the boy. This is called the <b>iḍāfa</b>.","The first noun loses al- and tanwīn. The second noun is definite and ends in <b>-i</b>: baytu l-waladi. A feminine -a becomes <b>-atu</b>: ghurfatu l-waladi.","A noun with an ending such as -ī counts as definite, so it can be the second noun: kitābu abī (my father's book)."],
       fr:["Pour dire <b>X de Y</b>, on place les deux noms l'un à côté de l'autre : bayt al-walad = la maison du garçon. C'est ce qu'on appelle l'<b>iḍāfa</b>.","Le premier nom perd al- et le tanwīn. Le second nom est défini et se termine par <b>-i</b> : baytu l-waladi. Un -a féminin devient <b>-atu</b> : ghurfatu l-waladi.","Un nom avec une terminaison comme -ī est défini, donc il peut être le second nom : kitābu abī (le livre de mon père)."]},
 ex:[["بَيْتُ الْوَلَدِ","baytu l-waladi","the boy's house","la maison du garçon"],["بَابُ الْبَيْتِ","bābu l-bayti","the door of the house","la porte de la maison"],["غُرْفَةُ الْوَلَدِ","ghurfatu l-waladi","the boy's room","la chambre du garçon"],["اِسْمُ الْبِنْتِ","ismu l-binti","the girl's name","le prénom de la fille"],["كِتَابُ أَبِي","kitābu abī","my father's book","le livre de mon père"]],
 mistake:{en:"Never put al- on the first noun: 'the door of the house' is bābu l-bayti, not 'al-bābu l-bayti'. There is no Arabic word for 'of' or ''s': the word order does the job.",fr:"Ne mets jamais al- sur le premier nom : « la porte de la maison » se dit bābu l-bayti, et non « al-bābu l-bayti ». Il n'y a pas de mot pour « de » : c'est l'ordre des mots qui fait le travail."}},

{day:13,title:{en:"Adjectives copy the noun",fr:"L'adjectif copie le nom"},
 rule:{en:["An adjective <b>comes after</b> the noun and <b>copies</b> it: same gender, and the same 'the' or 'a'.","To make an adjective feminine, add <b>-a</b>: kabīr (m) becomes kabīra (f). A few colours change shape: abyaḍ (white, m) becomes bayḍāʾ (f).","<b>Phrase or sentence?</b> If both words have al-, it is a phrase: al-bābu l-jadīd = the new door. If only the noun has al-, it is a sentence: al-bābu jadīd = the door is new."],
       fr:["L'adjectif <b>se place après</b> le nom et le <b>copie</b> : même genre, et même « le » ou « un ».","Pour mettre un adjectif au féminin, on ajoute <b>-a</b> : kabīr (m) devient kabīra (f). Quelques couleurs changent de forme : abyaḍ (blanc, m) devient bayḍāʾ (f).","<b>Groupe ou phrase ?</b> Si les deux mots ont al-, c'est un groupe : al-bābu l-jadīd = la nouvelle porte. Si seul le nom a al-, c'est une phrase : al-bābu jadīd = la porte est neuve."]},
 ex:[["بَيْتٌ كَبِيرٌ","bayt kabīr","a big house","une grande maison"],["مَدْرَسَةٌ كَبِيرَةٌ","madrasa kabīra","a big school","une grande école"],["مَدْرَسَةٌ بَيْضَاءُ","madrasa bayḍāʾ","a white school (feminine colour)","une école blanche (couleur au féminin)"],["الْبَابُ الْجَدِيدُ","al-bābu l-jadīd","the new door (phrase)","la nouvelle porte (groupe)"],["الْبَابُ جَدِيدٌ","al-bābu jadīd","the door is new (sentence)","la porte est neuve (phrase)"],["الْمَدْرَسَةُ جَدِيدَةٌ","al-madrasatu jadīda","the school is new","l'école est neuve"]],
 mistake:{en:"Do not put the adjective first ('kabīr bayt' is wrong). For 'the big house' both words need al-: al-baytu l-kabīr.",fr:"Ne place pas l'adjectif avant le nom (« kabīr bayt » est faux). Pour « la grande maison », les deux mots prennent al- : al-baytu l-kabīr."}},

{day:16,title:{en:"Endings: -u, -a, -i",fr:"Les terminaisons : -u, -a, -i"},
 rule:{en:["Arabic nouns change their <b>last vowel</b> to show their job in the sentence. You have already seen all three.","<b>-u</b> marks the subject, the one who is or does: al-waladu. <b>-a</b> marks the object, the thing the verb acts on: al-khubza. <b>-i</b> marks a noun after a preposition, or the second noun in 'X of Y': fī l-bayti.","With 'a' (indefinite) the endings are -un, -an, -in. In everyday speech people often drop them. In the Quran and in formal reading they are pronounced."],
       fr:["Les noms arabes changent leur <b>dernière voyelle</b> pour montrer leur rôle dans la phrase. Tu as déjà vu les trois.","<b>-u</b> marque le sujet, celui qui est ou qui fait : al-waladu. <b>-a</b> marque le complément d'objet, ce sur quoi porte le verbe : al-khubza. <b>-i</b> marque un nom après une préposition, ou le second nom dans « X de Y » : fī l-bayti.","Avec « un » (indéfini), les terminaisons sont -un, -an, -in. Dans la conversation, on les supprime souvent. Dans le Coran et en lecture formelle, elles sont prononcées."]},
 ex:[["الْوَلَدُ كَبِيرٌ","al-waladu kabīr","The boy is big (subject, -u)","Le garçon est grand (sujet, -u)"],["أُحِبُّ الْخُبْزَ","uḥibbu l-khubza","I like bread (object, -a)","J'aime le pain (objet, -a)"],["أَقْرَأُ كِتَابًا","aqraʾu kitāban","I read a book (object, -an)","Je lis un livre (objet, -an)"],["أَنَا فِي الْبَيْتِ","anā fī l-bayti","I am in the house (after fī, -i)","Je suis dans la maison (après fī, -i)"]],
 mistake:{en:"Do not let endings block you. Your meaning is almost always clear without them. Get the word order and agreement right first, then add endings as polish. For reading the Quran, they matter more.",fr:"Ne laisse pas les terminaisons te bloquer. Ton sens est presque toujours clair sans elles. Maîtrise d'abord l'ordre des mots et l'accord, puis ajoute les terminaisons pour peaufiner. Pour lire le Coran, elles comptent davantage."}},

{day:17,title:{en:"Prepositions, and a link to a greeting",fr:"Les prépositions, et un lien avec une salutation"},
 rule:{en:["Prepositions are small words: fī (in), min (from), ilā (to), ʿalā (on), maʿa (with). The noun after them ends in <b>-i</b>. Min + al- is pronounced <b>mina l-</b>.","With a pronoun, the preposition takes an ending: fīhi (in it), minhu (from him), maʿahu (with him). Two of them change shape: ilā becomes <b>ilay-</b> and ʿalā becomes <b>ʿalay-</b>.","Now you can decode as-salāmu <b>ʿalay-kum</b>: 'peace (be) on you'."],
       fr:["Les prépositions sont de petits mots : fī (dans), min (de, depuis), ilā (vers, à), ʿalā (sur), maʿa (avec). Le nom qui suit se termine par <b>-i</b>. Min + al- se prononce <b>mina l-</b>.","Avec un pronom, la préposition prend une terminaison : fīhi (dedans), minhu (de lui), maʿahu (avec lui). Deux d'entre elles changent de forme : ilā devient <b>ilay-</b> et ʿalā devient <b>ʿalay-</b>.","Tu peux maintenant décoder as-salāmu <b>ʿalay-kum</b> : « que la paix soit sur vous »."]},
 ex:[["فِي الْبَيْتِ","fī l-bayti","in the house","dans la maison"],["مِنَ الْمَدْرَسَةِ","mina l-madrasati","from the school","de l'école"],["عَلَى الطَّاوِلَةِ","ʿalā ṭ-ṭāwilati","on the table","sur la table"],["مَعَ أَبِي","maʿa abī","with my father","avec mon père"],["فِيهِ","fīhi","in it","dedans"],["عَلَيْكُمْ","ʿalaykum","on you (plural)","sur vous"]],
 mistake:{en:"Do not say 'ʿalā-kum'. Before an ending, ʿalā and ilā switch to ʿalay- and ilay-.",fr:"Ne dis pas « ʿalā-kum ». Devant une terminaison, ʿalā et ilā deviennent ʿalay- et ilay-."}},

{day:18,title:{en:"Present tense: who is doing it",fr:"Le présent : qui fait l'action"},
 rule:{en:["A present verb has a <b>prefix</b> (a short start) that shows who is doing it, plus an ending. Here is the root dh-h-b (go):","The same pattern works for most verbs: aktubu, taktubu, yaktubu, naktubu (write). Learn the prefixes <b>a- ta- ya- na-</b> and you can use any new verb straight away."],
       fr:["Un verbe au présent a un <b>préfixe</b> (un court début) qui indique qui fait l'action, plus une terminaison. Voici la racine dh-h-b (aller) :","Le même schéma fonctionne pour la plupart des verbes : aktubu, taktubu, yaktubu, naktubu (écrire). Apprends les préfixes <b>a- ta- ya- na-</b> et tu peux employer n'importe quel nouveau verbe tout de suite."]},
 table:[["أَذْهَبُ","adhhabu","I go","je vais"],["تَذْهَبُ","tadhhabu","you (to a man) go, or she goes","tu vas (à un homme), ou elle va"],["تَذْهَبِينَ","tadhhabīna","you (to a woman) go","tu vas (à une femme)"],["يَذْهَبُ","yadhhabu","he goes","il va"],["نَذْهَبُ","nadhhabu","we go","nous allons"],["يَذْهَبُونَ","yadhhabūna","they (men) go","ils vont"]],
 ex:[["هُوَ يَذْهَبُ إِلَى الْمَدْرَسَةِ","huwa yadhhabu ilā l-madrasa","He goes to school","Il va à l'école"],["هِيَ تَكْتُبُ","hiya taktubu","She writes","Elle écrit"],["نَحْنُ نَشْرَبُ الْمَاءَ","naḥnu nashrabu l-māʾa","We drink the water","Nous buvons l'eau"]],
 mistake:{en:"ta- means both 'you (to a man)' and 'she'. The pronoun (anta or hiya) or the context tells you which.",fr:"ta- signifie à la fois « tu (à un homme) » et « elle ». Le pronom (anta ou hiya) ou le contexte te dit lequel."}},

{day:20,title:{en:"Plurals, and 'two'",fr:"Les pluriels, et « deux »"},
 rule:{en:["Most Arabic plurals are <b>broken plurals</b>: the inside of the word changes, so you must learn each plural with its word. Some words, especially feminine ones, have a regular plural in <b>-āt</b>: ṣāliḥa becomes ṣāliḥāt (you know it from Al-ʿAsr).","The plural of <b>things</b> acts like one feminine singular word: al-kutubu jadīda = the books are new (literally 'the books, she is new').","<b>Two</b> of something has its own ending, the <b>dual</b>: -āni. Kitābāni = two books. You do not need to add the word ithnān."],
       fr:["La plupart des pluriels arabes sont des <b>pluriels brisés</b> : l'intérieur du mot change, donc il faut apprendre chaque pluriel avec son mot. Certains mots, surtout féminins, ont un pluriel régulier en <b>-āt</b> : ṣāliḥa devient ṣāliḥāt (tu le connais dans Al-ʿAsr).","Le pluriel des <b>choses</b> se comporte comme un seul mot féminin singulier : al-kutubu jadīda = les livres sont neufs (littéralement « les livres, elle est neuve »).","<b>Deux</b> choses ont leur propre terminaison, le <b>duel</b> : -āni. Kitābāni = deux livres. Il n'est pas nécessaire d'ajouter le mot ithnān."]},
 ex:[["كُتُبٌ","kutub","books (plural of kitāb)","des livres (pluriel de kitāb)"],["أَوْلَادٌ","awlād","boys, children (plural of walad)","des garçons, des enfants (pluriel de walad)"],["بُيُوتٌ","buyūt","houses (plural of bayt)","des maisons (pluriel de bayt)"],["أَبْوَابٌ","abwāb","doors (plural of bāb)","des portes (pluriel de bāb)"],["بَنَاتٌ","banāt","girls (plural of bint)","des filles (pluriel de bint)"],["الْكُتُبُ جَدِيدَةٌ","al-kutubu jadīda","The books are new","Les livres sont neufs"],["كِتَابَانِ","kitābāni","two books","deux livres"],["بَيْتَانِ","baytāni","two houses","deux maisons"]],
 mistake:{en:"Do not invent plurals by adding -s. When you learn a new noun, learn its plural too and write it in your notebook. (The flashcards show the singular only.)",fr:"N'invente pas de pluriels en ajoutant -s. Quand tu apprends un nouveau nom, apprends aussi son pluriel et note-le dans ton cahier. (Les cartes montrent seulement le singulier.)"}},

{day:22,title:{en:"Past tense: endings, not prefixes",fr:"Le passé : des terminaisons, pas des préfixes"},
 rule:{en:["The simplest past verb is the 'he' form: kataba = he wrote. For other people you <b>add an ending</b> instead of a prefix. Here is dhahaba (went):","Present uses prefixes (aktubu), past uses endings (katabtu). That is the biggest difference between them. Al-ʿAsr has two examples: āmanū and ʿamilū are 'they' past verbs (ending -ū)."],
       fr:["Le verbe au passé le plus simple est la forme « il » : kataba = il a écrit. Pour les autres personnes, on <b>ajoute une terminaison</b> au lieu d'un préfixe. Voici dhahaba (est allé) :","Le présent utilise des préfixes (aktubu), le passé des terminaisons (katabtu). C'est la plus grande différence entre les deux. Al-ʿAsr en contient deux exemples : āmanū et ʿamilū sont des verbes au passé à la forme « ils » (terminaison -ū)."]},
 table:[["ذَهَبَ","dhahaba","he went","il est allé"],["ذَهَبَتْ","dhahabat","she went","elle est allée"],["ذَهَبْتُ","dhahabtu","I went","je suis allé(e)"],["ذَهَبْتَ","dhahabta","you (to a man) went","tu es allé (à un homme)"],["ذَهَبْنَا","dhahabnā","we went","nous sommes allés"],["ذَهَبُوا","dhahabū","they (men) went","ils sont allés"]],
 ex:[["أَكَلْتُ الْخُبْزَ","akaltu l-khubza","I ate the bread","J'ai mangé le pain"],["ذَهَبَتْ إِلَى الْمَدْرَسَةِ","dhahabat ilā l-madrasa","She went to school","Elle est allée à l'école"],["شَرِبْنَا الْمَاءَ","sharibnā l-māʾa","We drank the water","Nous avons bu l'eau"]],
 mistake:{en:"Do not mix them up: ya- at the start means 'he' in the present (yaktubu), and -at at the end means 'she' in the past (katabat).",fr:"Ne les confonds pas : ya- au début signifie « il » au présent (yaktubu), et -at à la fin signifie « elle » au passé (katabat)."}},

{day:22,title:{en:"Roots: how Arabic words are built",fr:"Les racines : comment les mots arabes sont construits"},
 rule:{en:["Most Arabic words are built from a <b>root</b> of three consonants that carries a core meaning. The root k-t-b is about writing. The vowels and extra letters around it make the exact word.","From k-t-b: kitāb (book), kataba (he wrote), aktubu (I write), yaktubu (he writes). From q-r-ʾ (reading): aqraʾu, qaraʾa, and the word Qurʾān itself, 'the reading'.","Spotting a root helps you guess new words and find them in a dictionary."],
       fr:["La plupart des mots arabes sont construits à partir d'une <b>racine</b> de trois consonnes qui porte un sens de base. La racine k-t-b concerne l'écriture. Les voyelles et les lettres ajoutées autour forment le mot exact.","À partir de k-t-b : kitāb (livre), kataba (il a écrit), aktubu (j'écris), yaktubu (il écrit). À partir de q-r-ʾ (lire) : aqraʾu, qaraʾa, et le mot Qurʾān lui-même, « la lecture ».","Repérer une racine t'aide à deviner de nouveaux mots et à les chercher dans un dictionnaire."]},
 ex:[["كِتَابٌ","kitāb","book (k-t-b)","livre (k-t-b)"],["كَتَبَ","kataba","he wrote (k-t-b)","il a écrit (k-t-b)"],["أَكْتُبُ","aktubu","I write (k-t-b)","j'écris (k-t-b)"],["قَرَأَ","qaraʾa","he read (q-r-ʾ)","il a lu (q-r-ʾ)"],["أَقْرَأُ","aqraʾu","I read (q-r-ʾ)","je lis (q-r-ʾ)"],["السَّلَامُ","as-salām","peace (s-l-m), from your first greeting","la paix (s-l-m), de ta première salutation"],["إِسْلَامٌ","islām","Islam, same root s-l-m (bonus word)","l'islam, même racine s-l-m (mot bonus)"],["مُسْلِمٌ","muslim","Muslim, same root s-l-m (bonus word)","musulman, même racine s-l-m (mot bonus)"]],
 mistake:{en:"A root helps you guess, but it does not guarantee the meaning. Always check a new word in a dictionary.",fr:"Une racine aide à deviner, mais ne garantit pas le sens. Vérifie toujours un nouveau mot dans un dictionnaire."}},

{day:27,title:{en:"Saying 'not', and yes or no questions",fr:"Dire « ne pas », et les questions par oui ou non"},
 rule:{en:["Arabic has four main ways to say <b>not</b>, depending on what you are negating:","<b>hal</b> at the start turns any statement into a yes-or-no question: hal anta bi-khayr? = Are you well?"],
       fr:["L'arabe a quatre façons principales de dire <b>ne pas</b>, selon ce que l'on nie :","<b>hal</b> au début transforme n'importe quelle phrase en question par oui ou non : hal anta bi-khayr ? = Vas-tu bien ?"]},
 table:[["لَا أَذْهَبُ","lā adhhabu","I do not go (lā + present)","Je ne vais pas (lā + présent)"],["لَمْ أَذْهَبْ","lam adhhab","I did not go (lam + a 'cut short' present)","Je ne suis pas allé (lam + présent « raccourci »)"],["لَنْ أَذْهَبَ","lan adhhaba","I will not go (lan + present ending in -a)","Je n'irai pas (lan + présent en -a)"],["لَيْسَ الْبَيْتُ كَبِيرًا","laysa l-baytu kabīran","The house is not big (laysa, with nouns)","La maison n'est pas grande (laysa, avec des noms)"]],
 ex:[["هَلْ أَنْتَ بِخَيْرٍ؟","hal anta bi-khayr?","Are you well?","Vas-tu bien ?"],["لَيْسَ عِنْدِي كِتَابٌ","laysa ʿindī kitāb","I do not have a book","Je n'ai pas de livre"]],
 mistake:{en:"Do not use lā for the past: say lam adhhab, not 'lā dhahabtu'. After lam, the verb loses its final -u (it looks 'cut short').",fr:"N'utilise pas lā pour le passé : dis lam adhhab, et non « lā dhahabtu ». Après lam, le verbe perd son -u final (il paraît « raccourci »)."}},

{day:29,title:{en:"Build any sentence: a checklist",fr:"Construire n'importe quelle phrase : une liste de contrôle"},
 rule:{en:["Two sentence types cover most of what you will say. <b>Nominal</b> (no verb): al-baytu kabīr, anā bi-khayr. <b>Verbal</b>: verb, then who, then what: dhahaba l-waladu ilā l-madrasa.","When the verb comes <b>first</b>, standard Arabic keeps it singular even if the doers are plural (it still matches gender): dhahaba l-awlādu. When the doers come first, the verb agrees: al-awlādu dhahabū.","<b>Checklist.</b> 1) Is each noun masculine or feminine? 2) Do I need al- ('the') or tanwīn ('a')? 3) Does the adjective copy the noun? 4) Do I need an attached ending or 'X of Y'? 5) Present prefix or past ending? 6) Endings -u, -a, -i for polish."],
       fr:["Deux types de phrases couvrent l'essentiel de ce que tu diras. <b>Nominale</b> (sans verbe) : al-baytu kabīr, anā bi-khayr. <b>Verbale</b> : le verbe, puis qui, puis quoi : dhahaba l-waladu ilā l-madrasa.","Quand le verbe vient <b>en premier</b>, l'arabe standard le laisse au singulier même si les sujets sont pluriels (il s'accorde quand même en genre) : dhahaba l-awlādu. Quand les sujets viennent en premier, le verbe s'accorde : al-awlādu dhahabū.","<b>Liste de contrôle.</b> 1) Chaque nom est-il masculin ou féminin ? 2) Faut-il al- (« le ») ou le tanwīn (« un ») ? 3) L'adjectif copie-t-il le nom ? 4) Faut-il une terminaison collée ou « X de Y » ? 5) Préfixe du présent ou terminaison du passé ? 6) Terminaisons -u, -a, -i pour peaufiner."]},
 ex:[["ذَهَبَ الْأَوْلَادُ إِلَى الْمَدْرَسَةِ","dhahaba l-awlādu ilā l-madrasa","The boys went to school (verb first, singular)","Les garçons sont allés à l'école (verbe d'abord, singulier)"],["الْأَوْلَادُ ذَهَبُوا إِلَى الْمَدْرَسَةِ","al-awlādu dhahabū ilā l-madrasa","The boys went to school (doers first, verb agrees)","Les garçons sont allés à l'école (sujets d'abord, le verbe s'accorde)"],["ذَهَبَتِ الْبِنْتُ إِلَى الْمَدْرَسَةِ","dhahabati l-bintu ilā l-madrasa","The girl went to school (verb matches gender)","La fille est allée à l'école (le verbe s'accorde en genre)"]],
 mistake:{en:"Do not wait for perfect grammar before you speak. A sentence with the right words in a simple order is understood. Fix one rule at a time.",fr:"N'attends pas d'avoir une grammaire parfaite pour parler. Une phrase avec les bons mots dans un ordre simple est comprise. Corrige une règle à la fois."}}
];

{title:{en:"The five pillars of Islam",fr:"Les cinq piliers de l'islam"},
 text:{en:["Islam is built on five pillars, like a house on five strong columns.","<b>1. Shahada</b>: saying, and believing, that there is no god but Allah and that Muhammad ﷺ is His messenger. <b>2. Salah</b>: praying five times a day. <b>3. Zakat</b>: giving a share of your wealth to people in need. <b>4. Sawm</b>: fasting in the month of Ramadan. <b>5. Hajj</b>: the pilgrimage to Makkah, once in a lifetime for those who are able."],
       fr:["L'islam repose sur cinq piliers, comme une maison sur cinq solides colonnes.","<b>1. La shahada</b> : dire, et croire, qu'il n'y a de dieu qu'Allah et que Muhammad ﷺ est Son messager. <b>2. La salat</b> : prier cinq fois par jour. <b>3. La zakat</b> : donner une part de sa richesse aux personnes dans le besoin. <b>4. Le sawm</b> : jeûner pendant le mois de Ramadan. <b>5. Le hajj</b> : le pèlerinage à La Mecque, une fois dans la vie pour ceux qui en sont capables."]},

{title:{en:"The six articles of faith",fr:"Les six articles de foi"},
 text:{en:["Faith (<b>īmān</b>) has six parts. A Muslim believes in: 1) Allah, 2) His angels, 3) His books, 4) His messengers, 5) the Last Day, 6) the divine decree (<b>qadar</b>), both the easy and the hard.","The five pillars and the six articles of faith appear together in the famous hadith of Jibrīl (Sahih Muslim). The pillars are what we do. Īmān is what we believe in our hearts."],
       fr:["La foi (<b>īmān</b>) comporte six éléments. Un musulman croit : 1) en Allah, 2) à Ses anges, 3) à Ses livres, 4) à Ses messagers, 5) au Jour dernier, 6) au décret divin (<b>qadar</b>), le facile comme le difficile.","Les cinq piliers et les six articles de foi apparaissent ensemble dans le célèbre hadith de Jibrīl (Sahih Muslim). Les piliers, c'est ce que nous faisons. L'īmān, c'est ce que nous croyons dans nos cœurs."]},
 rows:[["الْإِيمَانُ","al-īmān","faith","la foi"],["اللَّهُ","Allāh","Allah, God","Allah, Dieu"],["الْمَلَائِكَةُ","al-malāʾika","the angels","les anges"],["الْكُتُبُ","al-kutub","the books","les livres"],["الرُّسُلُ","ar-rusul","the messengers","les messagers"],["الْيَوْمُ الْآخِرُ","al-yawmu l-ākhir","the Last Day","le Jour dernier"],["الْقَدَرُ","al-qadar","the divine decree","le décret divin"]],

{title:{en:"Allah and His beautiful names",fr:"Allah et Ses beaux noms"},
 text:{en:["Allah is One. He has no partner, no child and no equal. You are learning this in Surat al-Ikhlāṣ.","He has beautiful names, and traditionally 99 are taught. Each one tells us something about Him: His mercy, His knowledge, His power. We use them when we make du'a, and we try to show good qualities such as mercy and honesty in our own lives."],
       fr:["Allah est Unique. Il n'a pas d'associé, pas d'enfant et pas d'égal. Tu l'apprends dans la sourate Al-Ikhlāṣ.","Il a de beaux noms, et on en enseigne traditionnellement 99. Chacun nous dit quelque chose sur Lui : Sa miséricorde, Sa science, Sa puissance. Nous les employons quand nous faisons des invocations (du'a), et nous essayons de montrer de bonnes qualités comme la miséricorde et l'honnêteté dans notre propre vie."]},
 rows:[["الرَّحْمَنُ","ar-Raḥmān","the Most Merciful","le Tout Miséricordieux"],["الرَّحِيمُ","ar-Raḥīm","the Especially Merciful","le Très Miséricordieux"],["الْمَلِكُ","al-Malik","the King","le Roi"],["الْخَالِقُ","al-Khāliq","the Creator","le Créateur"],["الرَّزَّاقُ","ar-Razzāq","the Provider","le Pourvoyeur"],["الْعَلِيمُ","al-ʿAlīm","the All-Knowing","l'Omniscient"],["السَّمِيعُ","as-Samīʿ","the All-Hearing","celui qui entend tout"],["الْبَصِيرُ","al-Baṣīr","the All-Seeing","celui qui voit tout"],["الْغَفُورُ","al-Ghafūr","the Forgiving","le Pardonneur"]],
 link:{en:"Ar-Raḥmān and ar-Raḥīm are in bismillāh and in Al-Fatiha. Al-Malik is the same word as malik in An-Nas.",fr:"Ar-Raḥmān et ar-Raḥīm sont dans la basmala et dans Al-Fatiha. Al-Malik est le même mot que malik dans An-Nas."},
 talk:{en:"Pick one name a day and ask: where did we see this quality today? (For example, ar-Razzāq when we eat.)",fr:"Choisis un nom par jour et demande : où avons-nous vu cette qualité aujourd'hui ? (Par exemple, ar-Razzāq quand nous mangeons.)"},

{title:{en:"Wudu: getting ready to pray",fr:"Le wudu : se préparer à prier"},
 text:{en:["Wudu (ablution) is the washing we do before we pray. Many scholars also ask for it before touching the Quran.","The usual order: 1) Intend in your heart and say bismillāh. 2) Wash both hands. 3) Rinse the mouth, then sniff water into the nose and blow it out. 4) Wash the face. 5) Wash the right arm, then the left, up to the elbows. 6) Wipe the head with wet hands, including the ears. 7) Wash the right foot, then the left, up to the ankles. Each washing is usually done three times.","Wudu breaks after using the toilet, passing wind, deep sleep and similar things. The schools of thought differ on some details (such as which steps are required and which are recommended), so learn the exact practice from your imam or teacher."],
       fr:["Le wudu (ablutions) est le lavage que nous faisons avant de prier. Beaucoup de savants le demandent aussi avant de toucher le Coran.","L'ordre habituel : 1) Avoir l'intention dans le cœur et dire bismillāh. 2) Se laver les deux mains. 3) Se rincer la bouche, puis aspirer de l'eau par le nez et la rejeter. 4) Se laver le visage. 5) Se laver le bras droit, puis le gauche, jusqu'aux coudes. 6) Passer les mains mouillées sur la tête, y compris les oreilles. 7) Se laver le pied droit, puis le gauche, jusqu'aux chevilles. Chaque lavage se fait généralement trois fois.","Le wudu s'annule après être allé aux toilettes, après avoir lâché un vent, après un sommeil profond et des choses semblables. Les écoles juridiques diffèrent sur certains détails (par exemple, quelles étapes sont obligatoires et lesquelles sont recommandées) : apprends donc la pratique exacte auprès de ton imam ou de ton enseignant."]},
 rows:[["بِسْمِ اللَّهِ","bismi llāh","In the name of Allah (say it at the start)","Au nom d'Allah (à dire au début)"],["الْوُضُوءُ","al-wuḍūʾ","ablution","les ablutions"],["الْوَجْهُ","al-wajh","the face","le visage"],["الْيَدَانِ","al-yadāni","the two hands","les deux mains"],["الرَّأْسُ","ar-raʾs","the head","la tête"],["الرِّجْلَانِ","ar-rijlāni","the two feet","les deux pieds"],["أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ","ashhadu an lā ilāha illā llāhu waḥdahu lā sharīka lah, wa ashhadu anna muḥammadan ʿabduhu wa-rasūluh","The words said after wudu: I bear witness that there is no god but Allah alone, with no partner, and that Muhammad is His servant and messenger","Les paroles dites après le wudu : j'atteste qu'il n'y a de dieu qu'Allah seul, sans associé, et que Muhammad est Son serviteur et Son messager"]],
 link:{en:"Al-yadāni and ar-rijlāni end in -āni: that is the 'two' ending from the plurals lesson.",fr:"Al-yadāni et ar-rijlāni se terminent par -āni : c'est la terminaison du « deux » de la leçon sur les pluriels."},
 talk:{en:"Do wudu together once, slowly. Say each step out loud.",fr:"Faites le wudu ensemble une fois, lentement. Dites chaque étape à voix haute."},
 qs:[{q:"What do we say at the start of wudu?",o:["Bismillāh","Allāhu akbar","Subḥāna llāh","Jazāka llāhu khayran"],a:0},{q:"After the face and arms, what do we wipe?",o:["The feet","The head","The knees","The back"],a:1},{q:"How many times do we usually wash each part?",o:["Once","Two","Three","Ten"],a:2}]},

{title:{en:"The five daily prayers",fr:"Les cinq prières quotidiennes"},
 text:{en:["Muslims pray five times a day: <b>Fajr</b> (dawn), <b>Dhuhr</b> (midday), <b>ʿAsr</b> (afternoon), <b>Maghrib</b> (just after sunset) and <b>ʿIshāʾ</b> (night). They have 2, 4, 4, 3 and 4 required rakʿahs (units of prayer).","In one rakʿah: stand and say Allāhu akbar, recite Al-Fatiha and another passage, bow (rukūʿ), stand up, then prostrate (sujūd), sit, and prostrate again. At the end of the prayer we sit and finish with the salām, to the right and to the left.","We pray facing the Kaaba in Makkah (the qibla). Small details, such as where to place the hands, differ between schools: copy your imam or teacher."],
       fr:["Les musulmans prient cinq fois par jour : <b>Fajr</b> (l'aube), <b>Dhuhr</b> (midi), <b>ʿAsr</b> (l'après-midi), <b>Maghrib</b> (juste après le coucher du soleil) et <b>ʿIshāʾ</b> (la nuit). Elles comptent respectivement 2, 4, 4, 3 et 4 rakʿas obligatoires (unités de prière).","Dans une rakʿa : on se tient debout et on dit Allāhu akbar, on récite Al-Fatiha et un autre passage, on s'incline (rukūʿ), on se redresse, puis on se prosterne (sujūd), on s'assoit, et on se prosterne de nouveau. À la fin de la prière, on s'assoit et on termine par le salām, vers la droite puis vers la gauche.","On prie face à la Kaaba, à La Mecque (la qibla). Les petits détails, comme la position des mains, diffèrent selon les écoles : imite ton imam ou ton enseignant."]},
 rows:[["الْفَجْرُ","al-fajr","Fajr, the dawn prayer (2)","Fajr, la prière de l'aube (2)"],["الظُّهْرُ","aẓ-ẓuhr","Dhuhr, the midday prayer (4)","Dhuhr, la prière de midi (4)"],["الْعَصْرُ","al-ʿaṣr","ʿAsr, the afternoon prayer (4)","ʿAsr, la prière de l'après-midi (4)"],["الْمَغْرِبُ","al-maghrib","Maghrib, the sunset prayer (3)","Maghrib, la prière du coucher du soleil (3)"],["الْعِشَاءُ","al-ʿishāʾ","ʿIshāʾ, the night prayer (4)","ʿIshāʾ, la prière de la nuit (4)"],["اللَّهُ أَكْبَرُ","Allāhu akbar","Allah is the Greatest (starting the prayer, moving between positions)","Allah est le Plus Grand (pour commencer la prière et passer d'une position à l'autre)"],["سُبْحَانَ رَبِّيَ الْعَظِيمِ","subḥāna rabbiya l-ʿaẓīm","Glory to my Lord, the Magnificent (in rukūʿ)","Gloire à mon Seigneur, l'Immense (dans le rukūʿ)"],["سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ","samiʿa llāhu liman ḥamidah","Allah hears whoever praises Him (rising from rukūʿ)","Allah entend celui qui Le loue (en se redressant du rukūʿ)"],["رَبَّنَا وَلَكَ الْحَمْدُ","rabbanā wa-laka l-ḥamd","Our Lord, to You is all praise","Notre Seigneur, à Toi la louange"],["سُبْحَانَ رَبِّيَ الْأَعْلَى","subḥāna rabbiya l-aʿlā","Glory to my Lord, the Most High (in sujūd)","Gloire à mon Seigneur, le Très-Haut (dans le sujūd)"],["السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ","as-salāmu ʿalaykum wa-raḥmatu llāh","Peace and Allah's mercy be on you (ending the prayer)","Que la paix et la miséricorde d'Allah soient sur vous (pour terminer la prière)"]],
 link:{en:"ʿAṣr is also the name of a surah you know. In prayer you say rabb (Lord) and ḥamd (praise), two words from Al-Fatiha.",fr:"ʿAṣr est aussi le nom d'une sourate que tu connais. Dans la prière, tu dis rabb (Seigneur) et ḥamd (louange), deux mots de Al-Fatiha."},
 talk:{en:"Say the five prayer names in order. Ask: which one is shortest? Which one has the most rakʿahs?",fr:"Dites les noms des cinq prières dans l'ordre. Demande : laquelle est la plus courte ? Laquelle compte le plus de rakʿas ?"},
 qs:[{q:"How many daily prayers are there?",o:["Three","Four","Five","Seven"],a:2},{q:"Which prayer has three rakʿahs?",o:["Fajr","Maghrib","Dhuhr","ʿAsr"],a:1},{q:"What do we say when we bow (rukūʿ)?",o:["Subḥāna rabbiya l-ʿaẓīm","Bismi llāh","Al-ḥamdu lillāh","Astaghfiru llāh"],a:0}]},

{title:{en:"The call to prayer (adhan)",fr:"L'appel à la prière (adhan)"},
 text:{en:["The adhan is the call to prayer, announced before each of the five prayers. The <b>iqāma</b> is a second, shorter call said just before the prayer begins.","The adhan says: Allah is the Greatest; I bear witness that there is no god but Allah and that Muhammad ﷺ is His messenger; come to prayer; come to success. At Fajr, one more line is added: prayer is better than sleep."],
       fr:["L'adhan est l'appel à la prière, lancé avant chacune des cinq prières. L'<b>iqāma</b> est un second appel, plus court, prononcé juste avant le début de la prière.","L'adhan dit : Allah est le Plus Grand ; j'atteste qu'il n'y a de dieu qu'Allah et que Muhammad ﷺ est Son messager ; venez à la prière ; venez à la réussite. À Fajr, une ligne est ajoutée : la prière est meilleure que le sommeil."]},
 rows:[["اللَّهُ أَكْبَرُ","Allāhu akbar","Allah is the Greatest","Allah est le Plus Grand"],["أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ","ashhadu an lā ilāha illā llāh","I bear witness that there is no god but Allah","J'atteste qu'il n'y a de dieu qu'Allah"],["أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","ashhadu anna muḥammadan rasūlu llāh","I bear witness that Muhammad is the messenger of Allah","J'atteste que Muhammad est le messager d'Allah"],["حَيَّ عَلَى الصَّلَاةِ","ḥayya ʿalā ṣ-ṣalāh","Come to prayer","Venez à la prière"],["حَيَّ عَلَى الْفَلَاحِ","ḥayya ʿalā l-falāḥ","Come to success","Venez à la réussite"],["الصَّلَاةُ خَيْرٌ مِنَ النَّوْمِ","aṣ-ṣalātu khayrun mina n-nawm","Prayer is better than sleep (Fajr only)","La prière est meilleure que le sommeil (à Fajr seulement)"],["لَا إِلَهَ إِلَّا اللَّهُ","lā ilāha illā llāh","There is no god but Allah (the last line)","Il n'y a de dieu qu'Allah (dernière ligne)"]],
 link:{en:"Khayr (good) is the word you know from bi-khayr. Ḥayya ʿalā uses ʿalā, from the prepositions lesson.",fr:"Khayr (bien) est le mot que tu connais dans bi-khayr. Ḥayya ʿalā emploie ʿalā, de la leçon sur les prépositions."},
 talk:{en:"When you hear an adhan, pause and repeat its words quietly. Ask the kids which words they recognise.",fr:"Quand vous entendez un adhan, faites une pause et répétez ses paroles doucement. Demande aux enfants quels mots ils reconnaissent."},
 qs:[{q:"What does 'Allāhu akbar' mean?",o:["Allah is One","Allah is the Greatest","Allah is Merciful","Praise be to Allah"],a:1},{q:"What does 'ḥayya ʿalā ṣ-ṣalāh' mean?",o:["Come to prayer","Come to success","Prayer is better than sleep","Peace be on you"],a:0},{q:"Which prayer's adhan adds 'prayer is better than sleep'?",o:["Dhuhr","Maghrib","ʿIshāʾ","Fajr"],a:3}]},

{title:{en:"Everyday words and duas",fr:"Mots et invocations du quotidien"},
 text:{en:["Muslims mention Allah throughout the day with short phrases. They are easy to learn, and children usually pick them up fast. Add one new phrase each week."],
       fr:["Les musulmans mentionnent Allah tout au long de la journée avec de courtes expressions. Elles sont faciles à apprendre, et les enfants les retiennent généralement vite. Ajoutez une nouvelle expression par semaine."]},
 rows:[["بِسْمِ اللَّهِ","bismi llāh","In the name of Allah (before eating or starting anything)","Au nom d'Allah (avant de manger ou de commencer quoi que ce soit)"],["الْحَمْدُ لِلَّهِ","al-ḥamdu lillāh","Praise be to Allah (after eating, after a sneeze, in any good moment)","Louange à Allah (après avoir mangé, après un éternuement, à chaque bon moment)"],["سُبْحَانَ اللَّهِ","subḥāna llāh","Glory be to Allah (when amazed)","Gloire à Allah (devant une merveille)"],["مَا شَاءَ اللَّهُ","mā shāʾa llāh","What Allah has willed (to admire something)","Ce qu'Allah a voulu (pour admirer quelque chose)"],["إِنْ شَاءَ اللَّهُ","in shāʾa llāh","If Allah wills (about the future)","Si Allah le veut (à propos de l'avenir)"],["أَسْتَغْفِرُ اللَّهَ","astaghfiru llāh","I ask Allah for forgiveness","Je demande pardon à Allah"],["جَزَاكَ اللَّهُ خَيْرًا","jazāka llāhu khayran","May Allah reward you with good (thank you, to a man)","Qu'Allah te récompense par le bien (merci, à un homme)"],["يَرْحَمُكَ اللَّهُ","yarḥamuka llāh","May Allah have mercy on you (to someone who sneezes and says al-ḥamdu lillāh)","Qu'Allah te fasse miséricorde (à quelqu'un qui éternue et dit al-ḥamdu lillāh)"],["السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ","as-salāmu ʿalaykum wa-raḥmatu llāhi wa-barakātuh","Peace be on you, and Allah's mercy and blessings (the full greeting)","Que la paix, la miséricorde et les bénédictions d'Allah soient sur vous (la salutation complète)"],["وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ","wa-ʿalaykumu s-salāmu wa-raḥmatu llāhi wa-barakātuh","And on you be peace, and Allah's mercy and blessings (the reply)","Et sur vous la paix, la miséricorde et les bénédictions d'Allah (la réponse)"],["بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","bismika llāhumma amūtu wa-aḥyā","In Your name, O Allah, I die and I live (before sleep)","En Ton nom, ô Allah, je meurs et je vis (avant de dormir)"],["الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ","al-ḥamdu lillāhi lladhī aḥyānā baʿda mā amātanā wa-ilayhi n-nushūr","Praise be to Allah who gave us life after He caused us to die, and to Him is the return (on waking)","Louange à Allah qui nous a rendu la vie après nous avoir fait mourir, et c'est vers Lui la résurrection (au réveil)"]],
 link:{en:"Ḥamd from Al-Fatiha is inside al-ḥamdu lillāh. Alladhī (who) from your Quran words is in the waking dua.",fr:"Ḥamd de Al-Fatiha est dans al-ḥamdu lillāh. Alladhī (qui), de tes mots du Coran, est dans l'invocation du réveil."},
 talk:{en:"Choose one phrase for this week. Everyone who remembers to say it gets a star on the family chart.",fr:"Choisissez une expression pour cette semaine. Chaque personne qui pense à la dire reçoit une étoile sur le tableau de la famille."},
 qs:[{q:"What do we say before eating?",o:["Bismi llāh","Subḥāna llāh","Astaghfiru llāh","Mā shāʾa llāh"],a:0},{q:"What is the reply to 'as-salāmu ʿalaykum'?",o:["Jazāka llāhu khayran","Wa-ʿalaykumu s-salām","In shāʾa llāh","Allāhu akbar"],a:1},{q:"What does 'in shāʾa llāh' mean?",o:["Thank you","I am sorry","If Allah wills","Welcome"],a:2}]},

{title:{en:"Ramadan and the two Eids",fr:"Le Ramadan et les deux Aïds"},
 text:{en:["Ramadan is the ninth month of the Islamic (Hijri) calendar. Muslims who are able fast every day from dawn (Fajr) until sunset (Maghrib): no food and no drink. It is also a month of Quran, extra prayers and charity. The Quran began to be revealed in Ramadan, and Laylat al-Qadr, the Night of Power, is in the last ten nights.","Fasting is required of adults. Children can practise gently, for example by fasting for part of a day. People who are ill or travelling, and some others, may delay their fast and make it up later (ask your imam).","There are two Eids. <b>Eid al-Fitr</b> celebrates the end of Ramadan, and zakat al-fiṭr is given before its prayer. <b>Eid al-Adha</b> falls in the days of Hajj."],
       fr:["Le Ramadan est le neuvième mois du calendrier islamique (hégirien). Les musulmans qui en sont capables jeûnent chaque jour de l'aube (Fajr) jusqu'au coucher du soleil (Maghrib) : ni nourriture ni boisson. C'est aussi un mois de Coran, de prières supplémentaires et de charité. Le Coran a commencé à être révélé pendant le Ramadan, et Laylat al-Qadr, la Nuit du Destin, se trouve dans les dix dernières nuits.","Le jeûne est obligatoire pour les adultes. Les enfants peuvent s'y exercer doucement, par exemple en jeûnant une partie de la journée. Les malades, les voyageurs et quelques autres peuvent reporter leur jeûne et le rattraper plus tard (demande à ton imam).","Il y a deux Aïds. <b>L'Aïd al-Fitr</b> célèbre la fin du Ramadan, et la zakat al-fiṭr est donnée avant sa prière. <b>L'Aïd al-Adha</b> tombe pendant les jours du Hajj."]},
 rows:[["رَمَضَانُ","ramaḍān","Ramadan, the ninth month","le Ramadan, le neuvième mois"],["الصِّيَامُ","aṣ-ṣiyām","fasting","le jeûne"],["السُّحُورُ","as-suḥūr","the meal before dawn","le repas avant l'aube"],["الْإِفْطَارُ","al-iftār","breaking the fast at sunset","la rupture du jeûne au coucher du soleil"],["ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ","dhahaba ẓ-ẓamaʾu wa-btallati l-ʿurūqu wa-thabata l-ajru in shāʾa llāh","The thirst has gone, the veins are moist, and the reward is confirmed, if Allah wills (said when breaking the fast, narrated by Abu Dawud)","La soif est partie, les veines sont humides et la récompense est confirmée, si Allah le veut (dit à la rupture du jeûne, rapporté par Abu Dawud)"],["عِيدُ الْفِطْرِ","ʿīdu l-fiṭr","Eid al-Fitr, the festival of breaking the fast","l'Aïd al-Fitr, la fête de la rupture du jeûne"],["عِيدُ الْأَضْحَى","ʿīdu l-aḍḥā","Eid al-Adha, the festival of sacrifice","l'Aïd al-Adha, la fête du sacrifice"],["لَيْلَةُ الْقَدْرِ","laylatu l-qadr","the Night of Power","la Nuit du Destin"]],
 link:{en:"ʿĪdu l-fiṭr and laylatu l-qadr are 'X of Y' phrases (the iḍāfa lesson). In the iftar dua, dhahaba is the past verb 'he went' from day 22: here it means 'has gone'.",fr:"ʿĪdu l-fiṭr et laylatu l-qadr sont des groupes « X de Y » (leçon sur l'iḍāfa). Dans l'invocation de l'iftar, dhahaba est le verbe passé « il est allé » du jour 22 : ici il signifie « est parti »."},
 talk:{en:"Ask: what would you share with someone who is hungry? Plan one act of giving this week.",fr:"Demande : que partagerais-tu avec quelqu'un qui a faim ? Planifiez un geste de partage cette semaine."},
 qs:[{q:"Ramadan is which month of the Islamic calendar?",o:["The first","The ninth","The tenth","The twelfth"],a:1},{q:"When does the fast begin each day?",o:["At midday","At sunset","At dawn (Fajr)","At midnight"],a:2},{q:"Which Eid comes at the end of Ramadan?",o:["Eid al-Adha","Eid al-Fitr","Eid al-Qadr","Eid al-Hajj"],a:1}]},

{title:{en:"Giving and pilgrimage: zakat and Hajj",fr:"Donner et pèleriner : la zakat et le hajj"},
 text:{en:["<b>Zakat</b> is a yearly obligation for Muslims whose savings are above a minimum level (the nisab). On savings it is usually 2.5%. It goes to people in need and to the other groups named in the Quran. Rules differ by type of wealth, so ask a scholar. <b>Ṣadaqa</b> is any extra giving, and the Prophet ﷺ taught that kindness, even a smile, counts as charity.","<b>Hajj</b> is the pilgrimage to Makkah in the month of Dhul-Hijjah. It is required once in a lifetime for those who are physically and financially able. Pilgrims walk around the Kaaba (ṭawāf), stand at ʿArafa, and the pilgrimage ends with Eid al-Adha. <b>ʿUmra</b> is a shorter visit that can be done at any time of year."],
       fr:["La <b>zakat</b> est une obligation annuelle pour les musulmans dont l'épargne dépasse un seuil minimal (le nisab). Sur l'épargne, elle est généralement de 2,5 %. Elle va aux personnes dans le besoin et aux autres catégories citées dans le Coran. Les règles varient selon le type de richesse : demande à un savant. La <b>ṣadaqa</b> est tout don supplémentaire, et le Prophète ﷺ a enseigné que la bonté, même un sourire, compte comme une aumône.","Le <b>hajj</b> est le pèlerinage à La Mecque, au mois de Dhul-Hijja. Il est obligatoire une fois dans la vie pour ceux qui en sont physiquement et financièrement capables. Les pèlerins tournent autour de la Kaaba (ṭawāf), se tiennent à ʿArafa, et le pèlerinage se termine avec l'Aïd al-Adha. La <b>ʿumra</b> est une visite plus courte qui peut se faire à n'importe quelle période de l'année."]},
 rows:[["الزَّكَاةُ","az-zakāh","zakat, the yearly obligatory charity","la zakat, l'aumône annuelle obligatoire"],["الصَّدَقَةُ","aṣ-ṣadaqa","voluntary charity","l'aumône volontaire"],["الْحَجُّ","al-ḥajj","the pilgrimage","le pèlerinage"],["الْعُمْرَةُ","al-ʿumra","the lesser pilgrimage","le petit pèlerinage"],["الْكَعْبَةُ","al-kaʿba","the Kaaba","la Kaaba"],["مَكَّةُ","makka","Makkah","La Mecque"],["الْمَدِينَةُ","al-madīna","Madinah, 'the city'","Médine, « la ville »"],["لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ","labbayka llāhumma labbayk, labbayka lā sharīka laka labbayk, inna l-ḥamda wa-n-niʿmata laka wa-l-mulk, lā sharīka lak","Here I am, O Allah, here I am. Here I am, You have no partner, here I am. All praise, grace and sovereignty belong to You. You have no partner. (The pilgrims' call)","Me voici, ô Allah, me voici. Me voici, Tu n'as pas d'associé, me voici. À Toi la louange, la grâce et la royauté. Tu n'as pas d'associé. (L'appel des pèlerins)"]],
 link:{en:"Al-madīna is the same word as madīna (city) from day 20. In the talbiya, inna (indeed) and lā (no) are words you know.",fr:"Al-madīna est le même mot que madīna (ville) du jour 20. Dans la talbiya, inna (certes) et lā (non) sont des mots que tu connais."},
 talk:{en:"Ask: what is something you can give this week? (Time, a toy, help, a kind word.)",fr:"Demande : que peux-tu donner cette semaine ? (Du temps, un jouet, de l'aide, une bonne parole.)"},
 qs:[{q:"How much is zakat on savings, usually?",o:["1%","2.5%","10%","50%"],a:1},{q:"Where do Muslims go for Hajj?",o:["Madinah","Jerusalem","Makkah","Cairo"],a:2},{q:"What is the cube-shaped house of Allah in Makkah called?",o:["The Kaaba","The Minbar","The Mihrab","The Masjid"],a:0}]},

{title:{en:"The prophets",fr:"Les prophètes"},
 text:{en:["Allah sent prophets and messengers to guide people. All of them called people to worship Allah alone. The Quran names 25 of them. We love and respect them all, and after the name of a prophet we say 'peace be upon him'.","Muhammad ﷺ is the last prophet and the Quran is the last revelation."],
       fr:["Allah a envoyé des prophètes et des messagers pour guider les gens. Tous ont appelé à adorer Allah seul. Le Coran en nomme 25. Nous les aimons et les respectons tous, et après le nom d'un prophète nous disons « que la paix soit sur lui ».","Muhammad ﷺ est le dernier prophète et le Coran est la dernière révélation."]},
 rows:[["آدَمُ","Ādam","the first human and first prophet","le premier être humain et premier prophète"],["نُوحٌ","Nūḥ","Noah, who built the ark","Noé, qui a construit l'arche"],["إِبْرَاهِيمُ","Ibrāhīm","Abraham, who built the Kaaba with his son Ismāʿīl","Abraham, qui a bâti la Kaaba avec son fils Ismāʿīl"],["مُوسَى","Mūsā","Moses, given the Tawrāh","Moïse, à qui fut donnée la Tawrāh"],["دَاوُدُ","Dāwūd","David, given the Zabūr","David, à qui fut donné le Zabūr"],["عِيسَى","ʿĪsā","Jesus, born to Maryam, given the Injīl","Jésus, né de Maryam, à qui fut donné l'Injīl"],["مُحَمَّدٌ","Muḥammad","the last prophet, who received the Quran","le dernier prophète, qui a reçu le Coran"],["عَلَيْهِ السَّلَامُ","ʿalayhi s-salām","peace be upon him (after a prophet's name)","que la paix soit sur lui (après le nom d'un prophète)"],["صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","ṣallā llāhu ʿalayhi wa-sallam","may Allah's peace and blessings be upon him (after Muhammad's name)","qu'Allah répande sur lui Sa paix et Ses bénédictions (après le nom de Muhammad)"]],
 link:{en:"ʿAlayhi is ʿalā plus -hi: the same 'ʿalay- + ending' you met in the prepositions lesson, as in ʿalaykum.",fr:"ʿAlayhi est ʿalā plus -hi : le même « ʿalay- + terminaison » de la leçon sur les prépositions, comme dans ʿalaykum."},
 talk:{en:"Pick one prophet. Tell his story in three sentences, and let the children add one more.",fr:"Choisis un prophète. Raconte son histoire en trois phrases, et laisse les enfants en ajouter une."},
 qs:[{q:"Who built the Kaaba with his son Ismāʿīl?",o:["Nūḥ","Ibrāhīm","Mūsā","Ādam"],a:1},{q:"Which prophet built the ark?",o:["Nūḥ","ʿĪsā","Dāwūd","Muḥammad"],a:0},{q:"Who is the last prophet?",o:["Mūsā","ʿĪsā","Ibrāhīm","Muḥammad ﷺ"],a:3}]},

{title:{en:"The life of the Prophet Muhammad ﷺ",fr:"La vie du Prophète Muhammad ﷺ"},
