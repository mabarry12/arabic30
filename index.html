  {q:'How do you say “The library is next to the garden”?',a:'المكتبة بجانب الحديقة',w:['المكتبة تحت الحديقة','المكتبة من الحديقة'],ar:1,why:'بجانب = next to.'},
  {q:'How do you say “The hospital is far from the house”?',a:'المستشفى بعيد عن البيت',w:['المستشفى بعيد من البيت','المستشفى بعيدة عن البيت'],ar:1,why:'“Far” takes عن, and المستشفى is masculine.'},
  {q:'How do you say “half past three”?',a:'الساعة الثالثة والنصف',w:['الساعة الثالثة والربع','الساعة الرابعة والنصف'],ar:1,why:'الثالثة = three, والنصف = and a half.'},
  {q:'How do you say “My head hurts”?',a:'عندي ألم في رأسي',w:['عندي ألم في رأسها','ليس عندي ألم في رأسي'],ar:1,why:'ـي means “my”.'},
  {q:'Which phrase means “Excuse me”?',a:'لو سمحت',w:['مبروك','لا بأس'],ar:1,why:'لو سمحت gets someone’s attention politely.'},
  {q:'How do you say “he does not read”?',a:'هو لا يقرأ',w:['هي لا تقرأ','هو لم يقرأ'],ar:1,why:'لا + a present verb. هي لا تقرأ is “she”, and هو لم يقرأ is “did not”.'},
  {q:'How do you say “The school is not far”?',a:'المدرسة ليست بعيدة',w:['المدرسة ليس بعيدة','المدرسة لا بعيدة'],ar:1,why:'المدرسة is feminine, so ليست.'},
  {q:'How do you say “I will not go tomorrow”?',a:'لن أذهب غداً',w:['لم أذهب غداً','لا أذهب أمس'],ar:1,why:'لن = will not.'},
  {q:'How do you say “When I read, I drink tea”?',a:'عندما أقرأ أشرب الشاي',w:['لأنني أقرأ أشرب الشاي','لكن أقرأ أشرب الشاي'],ar:1,why:'عندما = when.'}
 ]},
 dialogue:{scene:'You are Layla at the station at nine o’clock in the morning, going to the university. Yesterday you did not go to the university. After class you will go to the library. The library is on the right, next to the garden.',lines:[
  TT('صباح الخير يا ليلى! كيف حالك؟','SabaaHu l-khayr yaa layla! kayfa Haaluki?','Good morning, Layla! How are you?'),
  YY('بخير، الحمد لله','bi-khayr, l-Hamdu lillaah','Fine, thank God.',['بخير، إن شاء الله','bi-khayr, in shaa’a llaah','Fine, God willing.'],['بخير، مبروك','bi-khayr, mabruuk','Fine, congratulations.']),
  TT('كم الساعة الآن؟','kam as-saa‘a al-aan?','What time is it now?'),
  YY('الساعة التاسعة','as-saa‘a t-taasi‘a','It is nine o’clock.',['الساعة التاسعة والنصف','as-saa‘a t-taasi‘a wa n-niSf','It is half past nine.'],['الساعة الثانية','as-saa‘a th-thaaniya','It is two o’clock.']),
  TT('أين تذهبين اليوم؟','ayna tadhhabiina al-yawm?','Where are you going today?'),
  YY('أذهب إلى الجامعة','adhhab ilaa l-jaami‘a','I go to the university.',['ذهبت إلى الجامعة','dhahabtu ilaa l-jaami‘a','I went to the university.'],['يذهب إلى الجامعة','yadhhab ilaa l-jaami‘a','He goes to the university.']),
  TT('وهل ذهبتِ إلى الجامعة أمس؟','wa hal dhahabti ilaa l-jaami‘a ams?','And did you go to the university yesterday?'),
  YY('لا، لم أذهب أمس','laa, lam adhhab ams','No, I did not go yesterday.',['لا، لن أذهب أمس','laa, lan adhhab ams','No, I will not go yesterday.'],['لا، لا أذهب أمس','laa, laa adhhab ams','No, I do not go yesterday.']),
  TT('وماذا تفعلين بعد الصف؟','wa maadhaa taf‘aliina ba‘da S-Saff?','And what do you do after class?'),
  YY('سأذهب إلى المكتبة','sa’adhhab ilaa l-maktaba','I will go to the library.',['ذهبت إلى المكتبة','dhahabtu ilaa l-maktaba','I went to the library.'],['لا أذهب إلى المكتبة','laa adhhab ilaa l-maktaba','I do not go to the library.']),
  TT('وأين المكتبة؟','wa ayna l-maktaba?','And where is the library?'),
  YY('المكتبة على اليمين، بجانب الحديقة','al-maktaba ‘alaa l-yamiin, bi-jaanib al-Hadiiqa','The library is on the right, next to the garden.',['المكتبة على اليسار، بجانب الحديقة','al-maktaba ‘alaa l-yasaar, bi-jaanib al-Hadiiqa','The library is on the left, next to the garden.'],['المكتبة تحت الحديقة','al-maktaba taHta l-Hadiiqa','The library is under the garden.']),
  TT('شكراً جزيلاً يا ليلى','shukran jaziilan yaa layla','Thank you very much, Layla.'),
  YY('عفواً، مع السلامة','‘afwan, ma‘a s-salaama','You’re welcome, goodbye.',['لو سمحت، مع السلامة','law samaHt, ma‘a s-salaama','Excuse me, goodbye.'],['مبروك، مع السلامة','mabruuk, ma‘a s-salaama','Congratulations, goodbye.'])
 ]},
 dialogue2:{scene:'You are Layla, talking with Muna in the evening. This morning you went to the university with Karim at nine, and you read and wrote in class. Karim is not tired. After class you drank coffee at the café, then you bought bread at the market. The weather today is warm. You are at home now because you are tired, and you have pain in your back. Tomorrow you will not go to the university, but on Friday you will go, God willing.',lines:[
  TT('السلام عليكم يا ليلى. كيف حالك اليوم؟','as-salaamu ‘alaykum yaa layla. kayfa Haaluki al-yawm?','Peace be upon you, Layla. How are you today?'),
  YY('وعليكم السلام يا منى. بخير، الحمد لله','wa ‘alaykumu s-salaam yaa munaa. bi-khayr, l-Hamdu lillaah','And upon you peace, Muna. Fine, thank God.',['مع السلامة يا منى','ma‘a s-salaama yaa munaa','Goodbye, Muna.'],['بخير، مبروك','bi-khayr, mabruuk','Fine, congratulations.']),
  TT('ماذا فعلتِ هذا الصباح؟','maadhaa fa‘alti haadhaa S-SabaaH?','What did you do this morning?'),
  YY('ذهبت إلى الجامعة مع كريم','dhahabtu ilaa l-jaami‘a ma‘a kariim','I went to the university with Karim.',['أذهب إلى الجامعة مع كريم','adhhab ilaa l-jaami‘a ma‘a kariim','I go to the university with Karim.'],['ذهبت إلى السوق مع كريم','dhahabtu ilaa s-suuq ma‘a kariim','I went to the market with Karim.']),
  TT('في أي ساعة؟','fii ayyi saa‘a?','At what time?'),
  YY('في الساعة التاسعة','fii s-saa‘a t-taasi‘a','At nine o’clock.',['في الساعة الخامسة','fii s-saa‘a l-khaamisa','At five o’clock.'],['في الساعة التاسعة والنصف','fii s-saa‘a t-taasi‘a wa n-niSf','At half past nine.']),
  TT('وماذا فعلتِ في الصف؟','wa maadhaa fa‘alti fii S-Saff?','And what did you do in class?'),
  YY('قرأت وكتبت','qara’tu wa katabtu','I read and wrote.',['أقرأ وأكتب','aqra’ wa aktub','I read and write.'],['قرأ وكتب','qara’a wa kataba','He read and wrote.']),
  TT('هل كريم متعب؟','hal kariim mut‘ab?','Is Karim tired?'),
  YY('لا، كريم ليس متعباً','laa, kariim laysa mut‘aban','No, Karim is not tired.',['لا، كريم ليست متعبة','laa, kariim laysat mut‘iba','No, Karim (she) is not tired.'],['لا، كريم لا متعب','laa, kariim laa mut‘ab','No, Karim (wrong form) tired.']),
  TT('وماذا فعلتِ بعد الصف؟','wa maadhaa fa‘alti ba‘da S-Saff?','And what did you do after class?'),
  YY('شربت القهوة في المقهى ثم اشتريت الخبز من السوق','sharibtu l-qahwa fii l-maqhaa thumma ishtaraytu l-khubz mina s-suuq','I drank coffee at the café, then I bought bread at the market.',['اشتريت الخبز من السوق ثم شربت القهوة في المقهى','ishtaraytu l-khubz mina s-suuq thumma sharibtu l-qahwa fii l-maqhaa','I bought bread at the market, then I drank coffee at the café.'],['أشرب القهوة في المقهى ثم أشتري الخبز من السوق','ashrab al-qahwa fii l-maqhaa thumma ashtarii l-khubz mina s-suuq','I drink coffee at the café, then I buy bread at the market.']),
  TT('هل الجو دافئ اليوم؟','hal al-jaww daafi’ al-yawm?','Is the weather warm today?'),
  YY('نعم، الجو دافئ، ما شاء الله','na‘am, al-jaww daafi’, maa shaa’a llaah','Yes, the weather is warm, Masha’Allah.',['نعم، الجو بارد، ما شاء الله','na‘am, al-jaww baarid, maa shaa’a llaah','Yes, the weather is cold, Masha’Allah.'],['نعم، الجو دافئة، ما شاء الله','na‘am, al-jaww daafi’a, maa shaa’a llaah','Yes, the weather is warm (feminine ending), Masha’Allah.']),
  TT('وأنتِ الآن في البيت؟','wa anti al-aan fii l-bayt?','And you are at home now?'),
  YY('نعم، أنا في البيت لأنني متعبة','na‘am, anaa fii l-bayt li-’annanii mut‘iba','Yes, I am at home because I am tired.',['نعم، أنا في البيت لكن متعبة','na‘am, anaa fii l-bayt laakin mut‘iba','Yes, I am at home but tired.'],['نعم، أنا في البيت لأنه متعبة','na‘am, anaa fii l-bayt li-’annahu mut‘iba','Yes, I am at home because he is tired.']),
  TT('وهل عندك ألم؟','wa hal ‘indaki alam?','And do you have any pain?'),
  YY('نعم، عندي ألم في ظهري','na‘am, ‘indii alam fii Dhahrii','Yes, I have pain in my back.',['نعم، عندي ألم في ظهره','na‘am, ‘indii alam fii Dhahrihi','Yes, I have pain in his back.'],['لا، ليس عندي ألم','laa, laysa ‘indii alam','No, I do not have any pain.']),
  TT('هل تذهبين إلى الجامعة غداً؟','hal tadhhabiina ilaa l-jaami‘a ghadan?','Do you go to the university tomorrow?'),
  YY('لا، لن أذهب غداً','laa, lan adhhab ghadan','No, I will not go tomorrow.',['لا، لم أذهب غداً','laa, lam adhhab ghadan','No, I did not go tomorrow.'],['لا، ليس أذهب غداً','laa, laysa adhhab ghadan','No, (wrong form) I go tomorrow.']),
  TT('ويوم الجمعة؟','wa yawm al-jumu‘a?','And on Friday?'),
  YY('سأذهب إن شاء الله','sa’adhhab in shaa’a llaah','I will go, God willing.',['سأذهب ما شاء الله','sa’adhhab maa shaa’a llaah','I will go, Masha’Allah.'],['ذهبت إن شاء الله','dhahabtu in shaa’a llaah','I went, God willing.']),
  TT('شكراً يا ليلى. في أمان الله','shukran yaa layla. fii amaani llaah','Thank you, Layla. Goodbye.'),
  YY('مع السلامة يا منى','ma‘a s-salaama yaa munaa','Goodbye, Muna.',['صباح الخير يا منى','SabaaHu l-khayr yaa munaa','Good morning, Muna.'],['مرحباً يا منى','marHaban yaa munaa','Hello, Muna.'])
 ]},

/* ===================== LESSONS MODULE ===================== */
const PASS=70, ZWJ='\u200D';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const take=(a,n)=>shuffle(a).slice(0,n);
const clean=w=>w.replace(/[.،؟?!,]/g,'');
const SEC_NAME={vocab:'Vocabulary',grammar:'Grammar',conv:'Conversation',read:'Reading'};
const STEPS=['vocab','grammar','conv','read'];
const DAY_LESSONS={1:[1,2],2:[2],3:[3],4:[1],5:[5],6:[6],7:[7],8:[6],9:[3,5],10:[4],11:[4],12:[7],13:[7],14:[8],15:[9],16:[9],17:[11],18:[9],19:[11],20:[12],21:[13],24:[14],25:[15],22:[10],23:[10],26:[16],27:[17],28:[8,18],29:[18],30:[18]};

function ui(){
  if(!UI.les)UI.les={l:null,sec:null,tab:'study',quiz:null,ty:null,rp:null,cd:{pos:0,flip:false,order:null},pref:{en:true,tr:true,rden:false,rdtr:false},sel:null,long:false};
  if(!S.lessons||!S.lessons.done)S.lessons={done:{},best:{}};if(!Array.isArray(S.kids))S.kids=[];if(!S.who)S.who='me';if(!S.bundles||typeof S.bundles!=='object')S.bundles={};if(!S.log||typeof S.log!=='object'||Array.isArray(S.log))S.log={};
}
const isDone=(id,k)=>!!LD().done[id+':'+k];
const best=id=>LD().best[id]||0;
function lpct(L){let n=STEPS.filter(k=>isDone(L.id,k)).length;if(best(L.id)>=PASS)n++;return Math.round(n/5*100);}

const DLG=(L,long)=>long&&L.dialogue2?L.dialogue2:L.dialogue;
const RDG=(L,long)=>long&&L.reading2?L.reading2:L.reading;
/* glossary for tap-a-word, plus distractor pool */
const GLOSS={};
LESSONS.forEach(L=>{if(L.kind!=='letters')L.vocab.forEach(v=>{if(v.ar.indexOf(' ')<0)GLOSS[v.ar.replace(/[،؟]/g,'')]=[v.tr,v.en];});});
Object.assign(GLOSS,GLOSS_EXTRA);
const ALLV=[].concat.apply([],LESSONS.filter(L=>L.kind!=='letters').map(L=>L.vocab));

/* ---------- question builders ---------- */
function distract(pool,it,key,n){
  let d=take(pool.filter(x=>x[key]!==it[key]),n);
  if(d.length<n)d=d.concat(take(ALLV.filter(x=>x[key]!==it[key]&&!d.some(y=>y[key]===x[key])),n-d.length));
  return d;
}
function vocabQs(L,kind,n,sec){
  const pool=L.vocab,items=take(pool,Math.min(n,pool.length));
  return items.map(it=>{
    let q;
    if(L.kind==='letters'){
      if(kind==='letter')q={p:`<div class="ls-en"><b>${esc(it.tr)}</b></div><div class="ls-q">Which letter is this?</div>`,o:[it.ar].concat(distract(pool,it,'ar',3).map(x=>x.ar)),a:it.ar,ar:1,why:it.tr+' is '+it.ar+'.'};
      else if(kind==='sound')q={p:`<div class="ls-en">${esc(it.en)}</div><div class="ls-q">Which letter makes this sound?</div>`,o:[it.ar].concat(distract(pool,it,'ar',3).map(x=>x.ar)),a:it.ar,ar:1,why:it.ar+' is '+it.tr+'.'};
      else q={p:`<div class="ls-big ar" lang="ar">${esc(it.ar)}</div><div class="ls-q">What is this letter called?</div>`,o:[it.tr].concat(distract(pool,it,'tr',3).map(x=>x.tr)),a:it.tr,why:'This letter is '+it.tr+' ('+it.en+').'};
    } else if(kind==='e2a'){
      q={p:`<div class="ls-en">${esc(it.en)}</div><div class="ls-q">How do you say it in Arabic?</div>`,o:[it.ar].concat(distract(pool,it,'ar',3).map(x=>x.ar)),a:it.ar,ar:1,why:it.ar+' ('+it.tr+')',sp:it.ar};
    } else if(kind==='hear'){
      q={p:`<div class="ls-q">Listen, then choose the meaning.</div>`,o:[it.en].concat(distract(pool,it,'en',3).map(x=>x.en)),a:it.en,why:it.ar+' ('+it.tr+') = '+it.en,sp:it.ar,auto:1};
    } else {
      q={p:`<div class="ls-word ar" lang="ar">${esc(it.ar)}</div><div class="ls-q">What does it mean?</div>`,o:[it.en].concat(distract(pool,it,'en',3).map(x=>x.en)),a:it.en,why:it.ar+' ('+it.tr+') = '+it.en,sp:it.ar};
    }
    q.sec=sec||'vocab';return q;
  });
}
function grammarQs(L,n,sec){
  const g=L.grammar.drill.map(d=>({p:`<div class="ls-en" style="font-size:20px">${esc(d.q)}</div>`,o:[d.a].concat(d.w),a:d.a,ar:!!d.ar,why:d.why,sec:sec||'grammar'}));
  if(L.grammar.shapes){
    take(LETTERS,3).forEach(l=>{
      const pos=l[3]?['ini','med','fin'][Math.floor(Math.random()*3)]:'fin';
      const names={ini:'at the start',med:'in the middle',fin:'at the end'};
      g.push({p:`<div class="ls-big ar" lang="ar">${esc(formOf(l[0],pos))}</div><div class="ls-q">Which letter is this, shown ${names[pos]} of a word?</div>`,
        o:[l[1]].concat(take(LETTERS.filter(x=>x[0]!==l[0]),3).map(x=>x[1])),a:l[1],why:'This is '+l[1]+' ('+l[0]+').',sec:sec||'grammar'});
    });
  }
  return n?take(g,n):shuffle(g);
}
function readQs(L,sec,R){R=R||L.reading;return R.q.map(q=>({p:`<div class="ls-en" style="font-size:20px">${esc(q[0])}</div>`,o:[q[1]].concat(q[2]),a:q[1],ar:!!q[3],why:'',sec:sec||'read'}));}
function clozeQs(L,sec,R){
  R=R||L.reading;
  const keys=Object.keys(GLOSS).filter(k=>k.length>=3);
  return R.s.map(s=>{
    const toks=s[0].split(' ');
    const cand=toks.map((t,i)=>({i,w:clean(t)})).filter(x=>GLOSS[x.w]&&x.w.length>=3);
    if(!cand.length)return null;
    const p=cand[Math.floor(Math.random()*cand.length)];
    const sentence=toks.map((t,i)=>i===p.i?'<span class="ls-blank">&nbsp;</span>'+(/[.،؟?!]$/.test(t)?esc(t.slice(-1)):''):esc(t)).join(' ');
    return {p:`<div class="ls-word ar" lang="ar" style="font-size:34px">${sentence}</div><div class="ls-q">${esc(s[2])}</div><div class="ls-q">Choose the missing word.</div>`,
      o:[p.w].concat(take(keys.filter(k=>k!==p.w),3)),a:p.w,ar:1,why:p.w+' = '+GLOSS[p.w][1]+' ('+GLOSS[p.w][0]+')',sec:sec||'read'};
  }).filter(Boolean);
}
function convQs(L,n,sec,D){
  D=D||L.dialogue;
  const lines=D.lines,out=[];
  lines.forEach((l,i)=>{
    if(l.who==='you'&&i>0&&lines[i-1].who==='them'){
      const t=lines[i-1];
      out.push({p:`<div class="ls-q">${esc(D.scene)}</div><div class="ls-word ar" lang="ar">${esc(t.ar)}</div><div class="ls-en" style="font-size:16px">${esc(t.en)}</div><div class="ls-q">Choose the best reply.</div>`,
        o:[l.ar].concat(l.wrong.map(w=>w.ar)),a:l.ar,ar:1,why:l.en,sp:l.ar,sec:sec||'conv'});
    }
  });
  return n?take(out,n):out;
}

function row(k,title,sub,done,act,extra){

}

/* ---------- actions ---------- */
function startQuiz(L,k,kind){
  const U=UI.les;let qs;
  if(k==='vocab')qs=vocabQs(L,kind,10,'vocab');
  else if(k==='grammar')qs=grammarQs(L,null,'grammar');
  else if(k==='conv')qs=convQs(L,null,'conv',DLG(L,U.long));
  else if(k==='readq')qs=readQs(L,'read',RDG(L,U.long));
  else if(k==='cloze')qs=clozeQs(L,'read',RDG(L,U.long));
  else qs=shuffle([].concat(vocabQs(L,L.kind==='letters'?'name':'a2e',3,'vocab'),vocabQs(L,L.kind==='letters'?'letter':'e2a',3,'vocab'),grammarQs(L,5,'grammar'),convQs(L,3,'conv'),readQs(L,'read'),clozeQs(L,'read').slice(0,2)));
  U.quiz={k,kind,qs,long:!!U.long&&(k==='conv'||k==='readq'||k==='cloze'),i:0,score:0,picked:null,by:{},done:false,pct:0,opts:null};
  setOpts();
}
function setOpts(){const z=UI.les.quiz,q=z.qs[z.i];z.opts=shuffle(q.o);z.picked=null;if(q.auto&&q.sp)speak(q.sp);}
function finishQuiz(L){
  const z=UI.les.quiz;z.done=true;z.pct=Math.round(z.score/z.qs.length*100);
  const key={vocab:'vocab',grammar:'grammar',conv:'conv',readq:'read',cloze:'read'}[z.k];
  if(z.k==='eval'){LD().best[L.id]=Math.max(LD().best[L.id]||0,z.pct);logAdd({e:[[LESSONS.indexOf(L)+1,z.pct]],n:[LESSONS.indexOf(L)+1]});}
  else if(z.pct>=PASS&&key){LD().done[L.id+':'+key]=true;if(z.long){LD().done[L.id+(z.k==='conv'?':conv2':':read2')]=true;}}
  markActive();save();
}
function startTyping(L){
  let pool=L.vocab.filter(i=>normAr(i.ar).replace(/ /g,'').length<=9);if(pool.length<5)pool=L.vocab;
  UI.les.ty={qs:take(pool,Math.min(10,pool.length)),i:0,score:0,typed:'',checked:false,ok:false,hint:'',done:false,pct:0};
}
function act(a,el){
  ui();if(a!=='l_bkreplace')UI.bkArm=false;const U=UI.les,L=U.l===null?null:LESSONS[U.l],d=el.dataset;
  switch(a){
    case 'l_who':switchTo(d.id);U.l=null;U.sec=null;U.quiz=null;U.ty=null;U.rp=null;UI.famArm=null;window.scrollTo(0,0);break;
    case 'l_addkid':{const inp=document.getElementById('kidName');const nm=((inp&&inp.value)||'').trim();
      if(!nm){toast('Type a name first.');break;}
      if(nm.length>20){toast('Please use a shorter name.');break;}
      if(!Array.isArray(S.kids))S.kids=[];
      if(S.kids.length>=6){toast('You can add up to six children.');break;}
      S.kids.push({id:'k'+Date.now().toString(36)+Math.floor(Math.random()*1000),name:nm,lessons:{done:{},best:{}}});
      if(inp)inp.value='';toast(nm+' added');break;}
    case 'l_delkid':{if(UI.famArm!==d.id){UI.famArm=d.id;toast('Tap again to remove this profile and its progress.');break;}
      S.kids=(S.kids||[]).filter(k=>k.id!==d.id);if(S.bundles)delete S.bundles[d.id];
      if(S.who===d.id){S.who='me';settle();afterSwitch();}
      UI.famArm=null;break;}
    case 'l_bkscope':{const B=bk();B.scope=d.id;B.code='';B.msg='';break;}
    case 'l_bkmake':{const B=bk();if(B.scope!=='all'&&!people().some(p=>p.id===B.scope))B.scope='all';
      B.msg='Creating the code…';
      makeCode(B.scope).then(c=>{B.code=c;B.msg='Code created. Copy all of it and keep it somewhere safe.';render();}).catch(()=>{B.msg='Sorry, the code could not be created in this browser.';render();});break;}
    case 'l_bkcopy':{const B=bk(),box=document.getElementById('bkOut');
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(B.code).then(()=>toast('Code copied'),()=>{if(box&&box.select)box.select();toast('Select the code and copy it.');});}
      else{if(box&&box.select)box.select();toast('Select the code and copy it.');}
      break;}
    case 'l_bkmerge':case 'l_bkreplace':{const B=bk(),inp=document.getElementById('bkIn');const txt=inp?inp.value:(B.input||'');B.input=txt;
      if(a==='l_bkreplace'&&!UI.bkArm){UI.bkArm=true;B.msg='Tap “Replace everything” again to confirm. This overwrites all progress on this device.';break;}
      UI.bkArm=false;
      applyCode(txt,a==='l_bkreplace'?'replace':'merge').then(r=>{B.msg=r.msg;if(r.ok){B.input='';UI.les=null;save();}render();});break;}
    case 'l_famtoday':switchTo(d.id);UI.tab='today';window.scrollTo(0,0);break;
    case 'l_famcards':switchTo(d.id);UI.tab='cards';UI.q=null;window.scrollTo(0,0);break;
    case 'l_rep':UI.rep={id:d.id,off:0};window.scrollTo(0,0);break;
    case 'l_repmode':S.repMode=d.v==='rolling'?'rolling':'week';if(UI.rep)UI.rep.off=0;break;
    case 'l_repstart':S.weekStart=(+d.v===1||+d.v===6)?+d.v:0;if(UI.rep)UI.rep.off=0;break;
    case 'l_repid':if(UI.rep)UI.rep.id=d.id;break;
    case 'l_repoff':if(UI.rep)UI.rep.off=Math.max(0,Math.min(12,(UI.rep.off||0)+(+d.v)));break;
    case 'l_repclose':UI.rep=null;window.scrollTo(0,0);break;
    case 'l_print':if(typeof window.print==='function')window.print();else toast('Use your browser’s print option.');break;
    case 'l_famlearn':switchTo(d.id);UI.tab='lessons';UI.les=null;ui();window.scrollTo(0,0);break;
    case 'l_famlesson':switchTo(d.id);UI.tab='lessons';UI.les=null;ui();UI.les.l=+d.i;window.scrollTo(0,0);break;
    case 'l_open':U.l=+d.i;U.sec=null;U.long=false;U.tab='study';U.quiz=null;U.ty=null;U.rp=null;U.sel=null;window.scrollTo(0,0);break;
    case 'l_openday':UI.tab='lessons';UI.les=null;ui();UI.les.l=+d.i;window.scrollTo(0,0);break;
    case 'l_home':U.l=null;U.sec=null;window.scrollTo(0,0);break;
    case 'l_hub':U.sec=null;U.quiz=null;U.ty=null;U.rp=null;window.scrollTo(0,0);break;

    case 'l_tab':U.tab=d.t;U.cd={pos:0,flip:false,order:null};break;
    case 'l_cdflip':U.cd.flip=true;break;
    case 'l_cdnext':U.cd.pos=(U.cd.pos+1)%L.vocab.length;U.cd.flip=false;break;
    case 'l_cdprev':U.cd.pos=(U.cd.pos-1+L.vocab.length)%L.vocab.length;U.cd.flip=false;break;
    case 'l_pref':U.pref[d.p]=!U.pref[d.p];break;

    case 'l_qstart':startQuiz(L,d.k,d.kind);window.scrollTo(0,0);break;
    case 'l_qagain':{const z=U.quiz;U.long=z.long;startQuiz(L,z.k,z.kind);window.scrollTo(0,0);break;}
    case 'l_qexit':U.quiz=null;window.scrollTo(0,0);break;
    case 'l_qpick':{const z=U.quiz;if(z.picked!==null)break;z.picked=+d.i;const q=z.qs[z.i],ok=z.opts[z.picked]===q.a;
      if(ok)z.score++;const s=q.sec||'all';z.by[s]=z.by[s]||{r:0,t:0};z.by[s].t++;if(ok)z.by[s].r++;break;}
    case 'l_qnext':{const z=U.quiz;z.i++;if(z.i>=z.qs.length)finishQuiz(L);else setOpts();break;}
    case 'l_tystart':startTyping(L);window.scrollTo(0,0);break;
    case 'l_tyexit':U.ty=null;window.scrollTo(0,0);break;
    case 'l_key':{const t=U.ty;if(!t.checked){t.typed+=d.k;}break;}
    case 'l_sp':{const t=U.ty;if(!t.checked)t.typed+=' ';break;}
    case 'l_del':{const t=U.ty;if(!t.checked)t.typed=t.typed.slice(0,-1);break;}
    case 'l_hint':{const t=U.ty;t.hint=normAr(t.qs[t.i].ar)[0];break;}
    case 'l_chk':{const t=U.ty,q=t.qs[t.i];
      if(!t.checked){t.checked=true;t.ok=normAr(t.typed)===normAr(q.ar);if(t.ok)t.score++;}
      else{t.i++;t.typed='';t.checked=false;t.hint='';
        if(t.i>=t.qs.length){t.done=true;t.pct=Math.round(t.score/t.qs.length*100);if(t.pct>=PASS)LD().done[L.id+':vocab']=true;markActive();save();}}
      break;}
    case 'l_rpstart':U.rp={dlg:DLG(L,U.long),long:!!(U.long&&L.dialogue2),log:[],step:0,mistakes:0,opts:null,bad:[],msg:''};rpAdvance(L);window.scrollTo(0,0);break;

    case 'l_rppick':{const R=U.rp,o=R.opts[+d.i];

      else{R.mistakes++;R.bad.push(+d.i);R.msg='That means “'+o.en+'”, which does not fit here. Try again.';}
      break;}
  }
  save();
}

/* ---------- family: one lesson profile per person ---------- */
function who(){
  if(S.who&&S.who!=='me'){const k=(S.kids||[]).find(x=>x.id===S.who);if(k){if(!k.lessons||!k.lessons.done)k.lessons={done:{},best:{}};return {id:k.id,name:k.name,lessons:k.lessons};}}
  S.who='me';
  if(!S.lessons||!S.lessons.done)S.lessons={done:{},best:{}};
  return {id:'me',name:'Me',lessons:S.lessons};
}
function LD(){return who().lessons;}

/* ---------- per-person 30-day plan, flashcards, streak, stars and Islam progress ---------- */
const BKEYS=['day','tasks','cards','stars','active','islam','log'];
function freshBundle(){return {day:1,tasks:{},cards:{},stars:0,active:[],islam:{done:{},best:{}},log:{}};}
function normBundle(b){
  b=(b&&typeof b==='object')?b:{};const o=freshBundle();
  o.day=Math.max(1,Math.min(30,Math.round(Number(b.day)||1)));
  o.tasks=(b.tasks&&typeof b.tasks==='object'&&!Array.isArray(b.tasks))?b.tasks:{};
  o.cards=(b.cards&&typeof b.cards==='object'&&!Array.isArray(b.cards))?b.cards:{};
  o.stars=Math.max(0,Math.round(Number(b.stars)||0));
  o.active=Array.isArray(b.active)?b.active:[];
  o.log=(b.log&&typeof b.log==='object'&&!Array.isArray(b.log))?b.log:{};
  const il=(b.islam&&typeof b.islam==='object')?b.islam:{};
  o.islam={done:(il.done&&typeof il.done==='object')?il.done:{},best:(il.best&&typeof il.best==='object')?il.best:{}};
  return o;
}
function snapshot(){const b={};BKEYS.forEach(k=>{b[k]=S[k];});return b;}
function loadBundle(b){BKEYS.forEach(k=>{S[k]=b[k];});}
function flush(){if(!S.bundles||typeof S.bundles!=='object')S.bundles={};S.bundles[S.who||'me']=snapshot();}
function settle(){if(!S.bundles||typeof S.bundles!=='object')S.bundles={};loadBundle(normBundle(S.bundles[S.who||'me']));delete S.bundles[S.who||'me'];}
function afterSwitch(){UI.q=null;UI.quiz=null;UI.iq=null;UI.gopen=null;UI.iopen=null;UI.letter=null;UI.famArm=null;UI.view=Math.min(Math.max(S.day||1,1),30);}
function switchTo(id){
  who();
  if(id===S.who)return;
  if(id!=='me'&&!(S.kids||[]).some(k=>k.id===id))return;
  flush();S.who=id;settle();afterSwitch();
}
function bundleOf(id){return id===(S.who||'me')?snapshot():((S.bundles||{})[id]?normBundle(S.bundles[id]):freshBundle());}
function planStats(b){
  const t=b.tasks||{};let finished=0;
  for(let d=1;d<=30;d++){let all=true;for(let i=0;i<6;i++){if(!t[d+':'+i]){all=false;break;}}if(all)finished++;}
  const ids=Object.keys(b.cards||{}),learned=ids.filter(id=>b.cards[id]&&b.cards[id].box>=4).length;
  let streakN=0;const dt=new Date(),act=b.active||[];
  if(!act.includes(fmt(dt)))dt.setDate(dt.getDate()-1);
  while(act.includes(fmt(dt))){streakN++;dt.setDate(dt.getDate()-1);}
  return {day:b.day||1,finished,started:ids.length,learned,streak:streakN,stars:b.stars||0};
}
function dayFinished(b,d){for(let i=0;i<6;i++){if(!(b.tasks||{})[d+':'+i])return false;}return true;}
function barHtml(){
  const ppl=people();if(ppl.length<2)return '';
  const cur=who().id;
  return `<div class="ls-btns pad" style="padding-bottom:0"><span class="note" style="width:100%;margin:0">Learning as:</span>${ppl.map(p=>`<button class="btn sm ${cur===p.id?'':'ghost'}" data-a="l_who" data-id="${p.id}">${esc(p.name)}</button>`).join(' ')}</div>`;
}
function people(){
  return [{id:'me',name:'Me',lessons:S.lessons}].concat((S.kids||[]).map(k=>{if(!k.lessons||!k.lessons.done)k.lessons={done:{},best:{}};return {id:k.id,name:k.name,lessons:k.lessons};}));
}
function statFor(lessons,L){
  const done=lessons.done||{},bm=lessons.best||{};
  const steps=STEPS.filter(k=>done[L.id+':'+k]).length,b=bm[L.id]||0;
  const n=steps+(b>=PASS?1:0);
  return {pct:Math.round(n/5*100),steps,best:b,passed:b>=PASS};
}
function whoBar(){
  if(people().length<2)return `<p class="note" style="margin:0 20px 8px">Learning as: <b>Me</b>. Add children in the Family tab. Each child then gets their own 30-day plan, flashcards, streak, stars and lesson progress.</p>`;

}

      `<div class="ls-days" role="img" aria-label="${ps.finished} of 30 days finished">${Array.from({length:30},(_,i)=>`<i class="${dayFinished(pb,i+1)?'p':(i+1===ps.day?'c':'')}"></i>`).join('')}</div>`+
      `<p class="note" style="margin:8px 0 4px">Lessons:</p>`+
      `<div class="ls-sqs">${st.map((x,i)=>`<button class="ls-sq ${x.passed?'p':(x.pct>0?'h':'')}" data-a="l_famlesson" data-id="${p.id}" data-i="${i}" aria-label="Lesson ${i+1}: ${x.passed?'passed':(x.pct>0?x.pct+'% complete':'not started')}">${i+1}</button>`).join('')}</div>`+
      `<p style="margin-top:10px"><button class="btn sm" data-a="l_famtoday" data-id="${p.id}">30-day plan</button> <button class="btn sm" data-a="l_famcards" data-id="${p.id}">Flashcards</button> <button class="btn sm" data-a="l_famlearn" data-id="${p.id}">Lessons</button> <button class="btn sm ghost" data-a="l_rep" data-id="${p.id}">Weekly summary</button>${p.id!=='me'?` <button class="btn sm ghost" data-a="l_delkid" data-id="${p.id}">${UI.famArm===p.id?'Tap again to remove':'Remove profile'}</button>`:''}</p></div>`;
  });
  h+=`<div class="pad"><h3>Add a child</h3><p class="note">Up to six profiles. Tap a numbered square above to open that lesson as that person.</p><input id="kidName" class="ls-inp" type="text" maxlength="20" placeholder="Name" aria-label="Child’s name"> <button class="btn sm" data-a="l_addkid">Add</button></div>`;
  h+=`<div class="pad"><h3>All lessons side by side</h3><p class="note">✓ = passed, with the best evaluation score. A percentage = part-way through.</p><div class="ls-mxw"><table class="ls-mx"><thead><tr><th>Lesson</th>${ppl.map(p=>`<th>${esc(p.name.length>8?p.name.slice(0,7)+'…':p.name)}</th>`).join('')}</tr></thead><tbody>`+
    LESSONS.map((L,i)=>`<tr><td>${i+1}. ${esc(L.en.length>22?L.en.slice(0,21)+'…':L.en)}</td>${ppl.map(p=>{const x=statFor(p.lessons,L);return `<td class="${x.passed?'p':''}">${x.passed?'✓ '+x.best+'%':(x.pct>0?x.pct+'%':'–')}</td>`;}).join('')}</tr>`).join('')+`</tbody></table></div></div>`;
  h+=backupHtml(ppl);
  return h;
}

/* ---------- backup codes ---------- */
function bk(){if(!UI.bk)UI.bk={scope:'all',code:'',msg:'',input:''};return UI.bk;}
const PACK_RE={done:/^L\d{1,2}:(vocab|grammar|conv|read|conv2|read2)$/,best:/^L\d{1,2}$/};
function packL(l){l=l||{};const done=l.done||{},best=l.best||{};return {d:Object.keys(done).filter(k=>done[k]),b:best};}
function unpackL(x){
  const out={done:{},best:{}};
  if(x&&Array.isArray(x.d))x.d.forEach(k=>{if(typeof k==='string'&&PACK_RE.done.test(k))out.done[k]=true;});
  if(x&&x.b&&typeof x.b==='object')Object.keys(x.b).forEach(k=>{const v=Number(x.b[k]);if(PACK_RE.best.test(k)&&isFinite(v))out.best[k]=Math.max(0,Math.min(100,Math.round(v)));});
  return out;
}
function mergeL(into,from){
  if(!into.done)into.done={};if(!into.best)into.best={};
  Object.keys(from.done).forEach(k=>{into.done[k]=true;});
  Object.keys(from.best).forEach(k=>{into.best[k]=Math.max(into.best[k]||0,from.best[k]);});
}
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36);}
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(str){
  if(!/^[A-Za-z0-9_-]*$/.test(str))throw new Error('bad characters');
  const s=str.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-str.length%4)%4);
  const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;
}
async function pipeBytes(stream,bytes){const w=stream.writable.getWriter();w.write(bytes);w.close();return new Uint8Array(await new Response(stream.readable).arrayBuffer());}
async function deflateBytes(bytes){return pipeBytes(new CompressionStream('deflate'),bytes);}
async function inflateText(bytes){return new TextDecoder().decode(await pipeBytes(new DecompressionStream('deflate'),bytes));}
function packB(b){return {day:b.day,tasks:Object.keys(b.tasks||{}).filter(k=>b.tasks[k]),cards:b.cards||{},stars:b.stars||0,active:b.active||[],islam:b.islam||{done:{},best:{}},log:b.log||{}};}
function cleanBundle(raw){
  const d=(raw&&typeof raw==='object')?raw:{};const out=freshBundle();
  out.day=Math.max(1,Math.min(30,Math.round(Number(d.day)||1)));
  const tl=Array.isArray(d.tasks)?d.tasks:((d.tasks&&typeof d.tasks==='object')?Object.keys(d.tasks).filter(k=>d.tasks[k]):[]);
  tl.forEach(k=>{if(typeof k==='string'&&/^\d{1,2}:\d$/.test(k)){const p=k.split(':');if(+p[0]>=1&&+p[0]<=30&&+p[1]<=5)out.tasks[k]=true;}});
  if(d.cards&&typeof d.cards==='object'&&!Array.isArray(d.cards))Object.keys(d.cards).forEach(id=>{const c=d.cards[id];if(/^\d{1,2}[gq]\d{1,3}$/.test(id)&&c&&isFinite(c.box)&&isFinite(c.due))out.cards[id]={box:Math.max(0,Math.min(6,Math.round(c.box))),due:Number(c.due)};});
  out.stars=Math.max(0,Math.round(Number(d.stars)||0));
  out.active=(Array.isArray(d.active)?d.active:[]).filter(x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x));

    if(Array.isArray(e.e))o.e=e.e.slice(0,20).filter(x=>Array.isArray(x)&&isFinite(x[0])&&isFinite(x[1])).map(x=>[Math.max(1,Math.min(99,Math.round(x[0]))),Math.max(0,Math.min(100,Math.round(x[1])))]);

function mergeBundle(into,from){

  Object.keys(from.log||{}).forEach(k=>{const a=into.log[k]||(into.log[k]={}),c=from.log[k];
    LOGF.forEach(f=>{if(c[f])a[f]=Math.max(a[f]||0,c[f]);});
    if(c.e)a.e=(a.e||[]).concat(c.e.filter(x=>!(a.e||[]).some(y=>y[0]===x[0]&&y[1]===x[1]))).slice(-20);
    if(c.n)a.n=Array.from(new Set((a.n||[]).concat(c.n))).sort((x,y)=>x-y);});

async function makeCode(scope){
  let obj;
  if(scope==='all'){
    const me=packB(bundleOf('me'));me.glang=S.glang||'en';me.lessons=packL(S.lessons);
    me.kids=(S.kids||[]).map(k=>({id:k.id,name:k.name,lessons:packL(k.lessons),b:packB(bundleOf(k.id))}));

  }
  const json=JSON.stringify(obj);
  let kind='P',bytes=new TextEncoder().encode(json);
  if(typeof CompressionStream!=='undefined'){try{bytes=await deflateBytes(bytes);kind='Z';}catch(e){bytes=new TextEncoder().encode(json);kind='P';}}

  return 'A30.'+kind+'.'+payload+'.'+fnv(payload);
}
async function readCode(text){
  const t=String(text||'').replace(/\s+/g,'');
  if(!t)throw new Error('Paste a code first.');
  if(t.slice(0,4)!=='A30.')throw new Error('That does not look like a backup code from this app.');
  const parts=t.split('.');
  if(parts.length!==4||(parts[1]!=='Z'&&parts[1]!=='P')||!parts[2]||!parts[3])throw new Error('The code is incomplete. Copy all of it, from the first A30 to the very end.');
  const kind=parts[1],payload=parts[2],chk=parts[3];
  if(fnv(payload)!==chk)throw new Error('The code is damaged or incomplete. Copy it again, all of it.');
  let json;
  try{
    const bytes=unb64u(payload);
    if(kind==='Z'&&typeof DecompressionStream==='undefined')throw new Error('nodecomp');
    json=kind==='Z'?await inflateText(bytes):new TextDecoder().decode(bytes);
  }catch(e){throw new Error(e&&e.message==='nodecomp'?'This browser cannot read compressed codes. Try a newer browser.':'The code could not be decoded.');}
  let o;try{o=JSON.parse(json);}catch(e){throw new Error('The code could not be read.');}
  if(!o||typeof o!=='object'||o.v!==1||(o.t!=='all'&&o.t!=='p'))throw new Error('This code is from a different version of the app.');
  return o;
}

  if(a!=="reset") UI.resetArm=false;
  const _m=LS.snap();
  if(a.indexOf("l_")===0){ LS.act(a,el); LS.track(a,el,_m); render(); return; }
  switch(a){
    case "tab": UI.rep=null; UI.tab=el.dataset.t; if(UI.tab==="cards") UI.q=null; window.scrollTo(0,0); break;
    case "view": UI.view=+el.dataset.n; break;
    case "skip": S.day=+el.dataset.n; UI.view=S.day; UI.q=null; save(); break;
    case "next": S.day=Math.min(S.day+1,30); UI.view=S.day; UI.q=null; save(); window.scrollTo(0,0); break;
    case "toggle": { const k=el.dataset.k; S.tasks[k]=!S.tasks[k]; if(S.tasks[k]) markActive(); save(); break; }
    case "reveal": UI.q.shown=true; break;
    case "grade": {
      const q=UI.q, id=q.queue.shift(), ok=el.dataset.g==="1";
      const c=S.cards[id]||{box:0,due:0};
      if(ok){ c.box=Math.min(c.box+1,6); c.due=Date.now()+INTERVALS[c.box]*864e5; q.done++; }
      else { c.box=0; c.due=Date.now(); q.queue.push(id); }
      S.cards[id]=c; q.shown=false; markActive(); save(); break;
    }
    case "newq": buildQueue(); break;
    case "letter": {
      if(el.dataset.ch){ UI.letter=LETTERS.findIndex(L=>L[0]===el.dataset.ch); UI.tab="letters"; window.scrollTo(0,0); }
      else { UI.letter=+el.dataset.i; window.scrollTo(0,0); }
      break;
    }
    case "qstart": {
      const pool=ALL.filter(c=>c.day<=S.day);
      UI.quiz={qs:shuffle(pool).slice(0,10),i:0,score:0,opts:null,picked:null};
      makeOpts(); break;
    }
    case "qpick": {
      const q=UI.quiz; if(q.picked!==null) break;
      q.picked=+el.dataset.i;
      if(q.opts[q.picked]===q.qs[q.i]) q.score++;
      break;
    }
    case "qnext": {
      const q=UI.quiz; q.i++;
      if(q.i>=q.qs.length){ S.stars+=q.score; markActive(); save(); }
      else makeOpts();
      break;
    }
    case "gopen": UI.tab="grammar"; UI.gopen=+el.dataset.i; window.scrollTo(0,0); break;
    case "gtoggle": { const i=+el.dataset.i; UI.gopen=UI.gopen===i?null:i; break; }
    case "glang": S.glang=el.dataset.l; save(); break;
    case "itoggle": { const i=+el.dataset.i; UI.iopen=UI.iopen===i?null:i; UI.iq=null; break; }
    case "idone": { const i=+el.dataset.i; S.islam.done[i]=!S.islam.done[i]; if(S.islam.done[i]) markActive(); save(); break; }
    case "iqstart": UI.iq={u:+el.dataset.i,i:0,score:0,opts:null,picked:null}; makeIOpts(); break;
    case "iqpick": {
      const q=UI.iq; if(!q || q.picked!==null) break;
      q.picked=+el.dataset.i; if(q.opts[q.picked].c) q.score++;
      break;
    }
    case "iqnext": {
      const q=UI.iq; q.i++;
      if(q.i>=ISLAM[q.u].qs.length){
        const prev=S.islam.best[q.u]||0;
        if(q.score>prev){ S.stars+=q.score-prev; S.islam.best[q.u]=q.score; }
        else if(S.islam.best[q.u]==null){ S.islam.best[q.u]=q.score; }
        markActive(); save();
      } else makeIOpts();
      break;
    }
    case "reset":
      if(!UI.resetArm){ UI.resetArm=true; break; }
      S.day=1; S.tasks={}; S.cards={}; S.stars=0; S.active=[]; S.islam={done:{},best:{}}; S.lessons={done:{},best:{}}; (S.kids||[]).forEach(k=>{k.lessons={done:{},best:{}};}); S.bundles={}; S.log={}; S.who="me"; UI.les=null; UI.famArm=null; UI.iopen=null; UI.iq=null; UI.view=1; UI.q=null; UI.quiz=null; UI.resetArm=false; save(); window.scrollTo(0,0);
      break;
  }
  LS.track(a,el,_m);
  render();
});

/* ---------- OFFLINE SUPPORT ---------- */
if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- START ---------- */
(async()=>{
  await Promise.race([load(), new Promise(r=>setTimeout(r,1500))]);
  UI.view=Math.min(Math.max(S.day,1),30);
  render();
})();
</script>
</body>
</html>
