/* ---------- STATE ---------- */
const KEY = "arabic30-v1";
const INTERVALS = [0,1,2,4,8,16,32];
const S = {day:1, tasks:{}, cards:{}, stars:0, active:[], glang:"en", islam:{done:{},best:{}}, lessons:{done:{},best:{}}, kids:[], who:"me", bundles:{}, log:{}, repMode:"week", weekStart:0};
const UI = {tab:"today", view:1, q:null, letter:null, quiz:null, resetArm:false, gopen:null, iopen:null, iq:null, les:null};

const ALL = [];
DAYS.forEach((D,di)=>{
  D.words.forEach((w,i)=>ALL.push({id:(di+1)+"g"+i,day:di+1,ar:w[0],tr:w[1],en:w[2],q:false}));
  D.quran.forEach((w,i)=>ALL.push({id:(di+1)+"q"+i,day:di+1,ar:w[0],tr:w[1],en:w[2],q:true}));
});

async function load(){
  try{
    let v=null;
    if(window.storage){ const r=await window.storage.get(KEY); v=r&&r.value; }
    else { v=localStorage.getItem(KEY); }
    if(v) Object.assign(S, JSON.parse(v));
  }catch(e){}
}
async function save(){
  try{
    const v=JSON.stringify(S);
    if(window.storage) await window.storage.set(KEY, v);
    else localStorage.setItem(KEY, v);
  }catch(e){}
}

/* ---------- HELPERS ---------- */
const $app = document.getElementById("app");
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function markActive(){const t=fmt(new Date()); if(!S.active.includes(t)) S.active.push(t);}
function streak(){
  let n=0; const d=new Date();
  if(!S.active.includes(fmt(d))) d.setDate(d.getDate()-1);
  while(S.active.includes(fmt(d))){n++; d.setDate(d.getDate()-1);}
  return n;
}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function taskCount(n){let c=0; for(let i=0;i<6;i++) if(S.tasks[n+":"+i]) c++; return c;}
function dayDone(n){return taskCount(n)===6;}

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200);
}
function speak(text){
  if(!("speechSynthesis" in window)){toast("Audio is not available on this device."); return;}
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang && x.lang.toLowerCase().startsWith("ar"));
  if(!v && voices.length){toast("No Arabic voice found. Add one in your device's text-to-speech settings."); return;}
  const u=new SpeechSynthesisUtterance(text); u.lang="ar-SA"; u.rate=0.8; if(v) u.voice=v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
if("speechSynthesis" in window) speechSynthesis.getVoices();

/* ---------- VIEWS ---------- */
function wordRow(w){
  return `<div class="wr"><div class="wl"><span class="tr">${w[1]}</span><span class="en">${w[2]}</span></div><button class="ar" lang="ar" dir="rtl" data-a="speak" data-s="${w[0]}" aria-label="Hear ${w[1]}">${w[0]}</button></div>`;
}
function taskBlock(n,i,title,body){
  const k=n+":"+i, on=!!S.tasks[k];
  return `<section class="task ${on?"on":""}"><button class="chk" role="checkbox" aria-checked="${on}" aria-label="Done: ${title}" data-a="toggle" data-k="${k}">${on?"✓":""}</button><div class="tb"><h3>${title}</h3>${body}</div></section>`;
}

function viewToday(){
  const n=UI.view, D=DAYS[n-1], locked=n>S.day;
  const known=Object.keys(S.cards).length;
  let h=`<header class="top"><h1>Day ${n} of 30</h1><p class="theme">${D.theme}</p></header>`+LS.bar();
  h+=`<div class="stats"><div class="stat"><b>${streak()}</b><span>day streak</span></div><div class="stat"><b>${known}</b><span>words started</span></div><div class="stat"><b>${S.stars}</b><span>kids' stars</span></div></div>`;
  h+=`<div class="chips" role="list">`;
  for(let i=1;i<=30;i++){
    const cls=["chip"]; if(dayDone(i)) cls.push("done"); if(i===S.day) cls.push("here"); if(i>S.day) cls.push("lock"); if(i===n) cls.push("sel");
    h+=`<button class="${cls.join(" ")}" data-a="view" data-n="${i}" aria-label="Day ${i}${dayDone(i)?", finished":""}">${i}</button>`;
  }
  h+=`</div>`;
  if(locked){
    h+=`<div class="pad"><p>Day ${n} opens after you finish day ${S.day}.</p><p><button class="btn ghost" data-a="skip" data-n="${n}">Jump to day ${n}</button></p></div>`;
    return h;
  }
  if(D.tip) h+=`<p class="tip">${D.tip}</p>`;
  h+=LS.tip(n);
  GRAMMAR.forEach((g,gi)=>{ if(g.day===n) h+=`<p class="tip">Grammar lesson for adults: <button class="lnk" data-a="gopen" data-i="${gi}">${g.title.en}</button></p>`; });

  let study;
  if(D.letters){
    study=taskBlock(n,0,"Learn the letters",
      `<p class="note">Tap a letter to see its sound and shapes. Say each name out loud, then write each letter three times.</p><div class="lt">${D.letters.map(l=>`<button class="ar" lang="ar" data-a="letter" data-ch="${l}" aria-label="Open letter ${l}">${l}</button>`).join("")}</div>`);
  }else{
    const t=D.study||"Read today's new words aloud from the Arabic only. Then check the transliteration. Ten minutes of reading aloud builds more than an hour of looking.";
    study=taskBlock(n,0,n<=10?"Reading and vowels":"Read aloud",`<p class="note">${t}</p>`);
  }
  const wordsBody=D.words.length
    ? `<p class="note">Tap an Arabic word to hear it.</p>${D.words.map(wordRow).join("")}`
    : `<p class="note">Nothing new today. Spend the time on review.</p>`;
  const quranBody=`<p class="note">${D.qf}</p>${D.quran.length?D.quran.map(wordRow).join(""):""}`;

  h+=`<div class="list">`
   +study
   +taskBlock(n,1,D.words.length?`New words (${D.words.length})`:"No new words today",wordsBody)
   +taskBlock(n,2,"Review your flashcards",`<p class="note">Ten minutes. Clear everything that is due.</p><button class="btn sm" data-a="tab" data-t="cards">Open flashcards</button>`)
   +taskBlock(n,3,"Say these sentences, five times each",D.pat.map(wordRow).join(""))
   +taskBlock(n,4,"Quran",quranBody)
   +taskBlock(n,5,"With the kids",`<p class="note">${D.kids}</p><button class="btn sm ghost" data-a="tab" data-t="quiz">Open the kids' quiz</button>`)
   +`</div>`;

  if(dayDone(n) && n===S.day){
    h+= n<30
      ? `<div class="done-banner"><h2>Day ${n} finished</h2><p class="note">Good work. Tomorrow is better than today if you come back.</p><button class="btn wide" data-a="next">Start day ${n+1}</button></div>`
      : `<div class="done-banner"><h2>You finished all 30 days</h2><p class="note">Keep your flashcards going every day, and book a tutor for speaking practice.</p></div>`;
  }
  h+=`<button class="reset" data-a="reset">${UI.resetArm?"Tap again to erase all progress":"Reset all progress"}</button>`;
  return h;
}

function buildQueue(){
  const now=Date.now();
  const unlocked=ALL.filter(c=>c.day<=S.day);
  const due=unlocked.filter(c=>S.cards[c.id] && S.cards[c.id].due<=now).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).slice(0,30);
  const fresh=unlocked.filter(c=>!S.cards[c.id]).slice(0,12);
  const ids=due.concat(fresh).map(c=>c.id);
  UI.q={queue:ids,shown:false,done:0,total:ids.length};
}
function cardById(id){return ALL.find(c=>c.id===id);}

function viewCards(){
  if(!UI.q) buildQueue();
  const q=UI.q;
  let h=`<header class="top"><h1>Flashcards</h1><p class="theme">${q.done} of ${q.total} done</p></header>`+LS.bar();
  if(q.queue.length===0){
    h+= q.total===0
      ? `<div class="pad"><p>Nothing is due right now.</p><p class="note">Finish today's tasks to unlock new words, or come back later for reviews.</p></div>`
      : `<div class="pad"><h2>Round finished</h2><p class="note">You went through ${q.done} cards. Cards you knew come back in 1 to 32 days. Cards you missed come back right away next round.</p><p><button class="btn" data-a="newq">Start another round</button></p></div>`;
    return h;
  }
  const c=cardById(q.queue[0]);
  h+=`<div class="fc"><span class="tag">${c.q?"Quran word, day "+c.day:"Day "+c.day}</span><div class="face"><span class="ar xl" lang="ar" dir="rtl">${c.ar}</span></div>`;
  if(q.shown){
    h+=`<div class="ans"><p class="tr2">${c.tr}</p><p class="en2">${c.en}</p><button class="btn sm ghost" data-a="speak" data-s="${c.ar}">Listen</button></div>`;
  }
  h+=`</div><div class="pad">`;
  if(!q.shown){
    h+=`<p class="note" style="margin-bottom:10px">Say it out loud and guess the meaning first.</p><button class="btn wide" data-a="reveal">Show answer</button>`;

    h+=`<div class="row2"><button class="btn ghost" data-a="grade" data-g="0">Again</button><button class="btn" data-a="grade" data-g="1">Got it</button></div>`;
  }
  h+=`</div>`;
  return h;
}

function formsOf(ch){
  const Z="\u200D";
  if(NONJOIN.includes(ch)) return [["Alone",ch],["After a letter",Z+ch]];
  return [["Alone",ch],["Start",ch+Z],["Middle",Z+ch+Z],["End",Z+ch]];
}

function gRow(r,L){
  return `<div class="wr"><div class="wl"><span class="tr">${r[1]}</span><span class="en">${L==="fr"?r[3]:r[2]}</span></div><button class="ar" lang="ar" dir="rtl" data-a="speak" data-s="${r[0]}" aria-label="Hear ${r[1]}">${r[0]}</button></div>`;
}
function viewGrammar(){
  const L=S.glang==="fr"?"fr":"en", T=GUI[L];
  let h=`<header class="top"><h1>${T.title}</h1><p class="theme">${T.sub}</p></header>`;
  h+=`<div class="seg" role="group" aria-label="Language"><button class="${L==="en"?"on":""}" data-a="glang" data-l="en">English</button><button class="${L==="fr"?"on":""}" data-a="glang" data-l="fr">Français</button></div>`;

function makeIOpts(){
  const q=UI.iq, Q=ISLAM[q.u].qs[q.i];
  q.opts=shuffle(Q.o.map((t,k)=>({t,c:k===Q.a}))); q.picked=null;
}
function islamQuiz(i,T){
  const u=ISLAM[i], q=UI.iq;
  if(!q || q.u!==i){
    const best=S.islam.best[i];
    return `<button class="btn sm" data-a="iqstart" data-i="${i}">${T.start}</button>${best!=null?` <span class="note">${T.best}: ${best} / ${u.qs.length}</span>`:""}`;
  }
  if(q.i>=u.qs.length){
    return `<p class="score" style="font-size:40px;margin:4px 0">${q.score} / ${u.qs.length}</p><p class="note">${S.stars} ${T.stars}</p><button class="btn sm" data-a="iqstart" data-i="${i}">${T.again}</button>`;
  }
  const Q=u.qs[q.i];
  let h=`<p class="note">${q.i+1} / ${u.qs.length}</p><p style="font-weight:600;margin:4px 0 8px">${Q.q}</p><div class="opts" style="margin:8px 0">`;
  q.opts.forEach((o,k)=>{
    let cls="opt";
    if(q.picked!==null){ if(o.c) cls+=" ok"; else if(k===q.picked) cls+=" bad"; }
    h+=`<button class="${cls}" data-a="iqpick" data-i="${k}" ${q.picked!==null?"disabled":""}>${o.t}</button>`;
  });
  h+=`</div>`;
  if(q.picked!==null){
    h+=`<p class="note" style="margin-bottom:8px">${q.opts[q.picked].c?T.right:T.wrong}</p><button class="btn sm" data-a="iqnext">${q.i+1>=u.qs.length?T.see:T.next}</button>`;
  }
  return h;
}
function viewIslam(){
  const L=S.glang==="fr"?"fr":"en", T=IUI[L];

  h+=`<p class="tip">${T.note}</p>`;
  h+=`<div class="seg" role="group" aria-label="Language"><button class="${L==="en"?"on":""}" data-a="glang" data-l="en">English</button><button class="${L==="fr"?"on":""}" data-a="glang" data-l="fr">Français</button></div>`;
  h+=`<p class="note" style="padding:0 20px 10px">${T.progress(doneN,ISLAM.length)}</p>`;
  h+=`<div class="glist">`;
  ISLAM.forEach((u,i)=>{

    if(open){
      h+=`<div class="gbody">`+u.text[L].map(p=>`<p class="gp">${p}</p>`).join("");
      h+=`<h3 class="gh">${T.arabic}</h3>`+u.rows.map(r=>gRow(r,L)).join("");

      h+=`<p style="margin-top:18px"><button class="btn sm ghost" data-a="idone" data-i="${i}">${fin?T.undo:T.done}</button></p></div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;
  return h;

function makeOpts(){
  const q=UI.quiz, c=q.qs[q.i];
  const pool=shuffle(ALL.filter(x=>x.day<=S.day && x.en!==c.en));
  const seen=new Set([c.en]), opts=[c];
  for(const x of pool){ if(opts.length>=4) break; if(!seen.has(x.en)){seen.add(x.en); opts.push(x);} }
  q.opts=shuffle(opts); q.picked=null;
}
function viewQuiz(){
  let h=`<header class="top"><h1>Kids' quiz</h1><p class="theme">Pick the meaning. ${S.stars} stars so far.</p></header>`+LS.bar();
  const q=UI.quiz;
  if(!q){
    h+=`<div class="pad"><p>Ten words from the days you have unlocked. Every right answer earns a star.</p><p><button class="btn wide" data-a="qstart">Start the quiz</button></p></div>`;
    return h;
  }
  if(q.i>=q.qs.length){
    h+=`<div class="pad"><p class="score">${q.score} of ${q.qs.length}</p><p style="text-align:center">${q.score===q.qs.length?"Perfect round.":q.score>=7?"Great work.":"Keep going. Every round helps."} You earned ${q.score} stars.</p><p style="margin-top:14px"><button class="btn wide" data-a="qstart">Play again</button></p></div>`;
    return h;
  }
  const c=q.qs[q.i];
  h+=`<div class="q"><p class="note" style="margin-bottom:8px">Question ${q.i+1} of ${q.qs.length}</p><div class="qword"><span class="ar" lang="ar" dir="rtl">${c.ar}</span><button class="btn sm ghost" data-a="speak" data-s="${c.ar}">Listen</button></div><div class="opts">`;
  q.opts.forEach((o,k)=>{
    let cls="opt";
    if(q.picked!==null){ if(o===c) cls+=" ok"; else if(k===q.picked) cls+=" bad"; }
    h+=`<button class="${cls}" data-a="qpick" data-i="${k}" ${q.picked!==null?"disabled":""}>${o.en}</button>`;
  });
  h+=`</div>`;
  if(q.picked!==null){
    h+=`<p style="margin-bottom:10px"><b>${c.tr}</b> means ${c.en}.</p><button class="btn wide" data-a="qnext">${q.i+1>=q.qs.length?"See my score":"Next question"}</button>`;
  }
  h+=`</div>`;
  return h;
}

{id:'L4',ar:'الأرقام والأيام',en:'Numbers and days',kind:'words',

 grammar:{notes:[
  {h:'“The” = ال',p:'Attach ال to the front of a noun to say “the”. There is no word for “a”: a bare noun already means “a …”.',ex:[['كتاب ← الكتاب','kitaab → al-kitaab','a book → the book'],['مدرسة ← المدرسة','madrasa → al-madrasa','a school → the school']]},
  {h:'Sun letters',p:'Before letters such as ت ث د ذ ر ز س ش ص ض ط ظ ل ن, the ل of ال is not pronounced; it blends into the next letter, which is doubled. The spelling does not change.',ex:[['السبت','as-sabt','Saturday'],['الشاي','ash-shaay','the tea'],['الثلاثاء','ath-thulaathaa’','Tuesday']]},
  {h:'Moon letters',p:'Before all other letters, ال is pronounced al-.',ex:[['الكتاب','al-kitaab','the book'],['الجمعة','al-jumu‘a','Friday']]},
  {h:'Days of the week',p:'The week starts on Sunday, and every day name begins with ال, except يوم (day).',ex:[['اليوم يوم الجمعة','al-yawm yawm al-jumu‘a','Today is Friday']]}
 ],

 ]},

 grammar:{notes:[
  {h:'Adjectives come after the noun',p:'In Arabic the describing word follows the noun it describes.',ex:[['كتاب كبير','kitaab kabiir','a big book'],['قلم أحمر','qalam aHmar','a red pen']]},
  {h:'They agree in gender',p:'A feminine noun takes a feminine adjective, with ـة.',ex:[['مدينة كبيرة','madiina kabiira','a big city'],['بنت سعيدة','bint sa‘iida','a happy girl']]},
  {h:'With “the”',p:'When the noun has ال, the adjective gets ال too.',ex:[['البيت الكبير','al-bayt al-kabiir','the big house'],['القلم الأحمر','al-qalam al-aHmar','the red pen']]},
  {h:'Colors',p:'The colors here are shown in their masculine form, so use them with masculine nouns for now. Feminine color forms are different and come later.',ex:[['كتاب أزرق','kitaab azraq','a blue book']]}
 ],
 drill:[
  {q:'How do you say “a big city”?',a:'مدينة كبيرة',w:['كبيرة مدينة','مدينة كبير'],ar:1,why:'The adjective comes after the noun and agrees: feminine مدينة takes كبيرة.'},
  {q:'How do you say “the red pen”?',a:'القلم الأحمر',w:['الأحمر القلم','قلم الأحمر'],ar:1,why:'Both the noun and the adjective take ال, noun first.'},
  {q:'How do you say “a happy girl”?',a:'بنت سعيدة',w:['بنت سعيد','سعيدة بنت'],ar:1,why:'بنت is feminine, so the adjective is سعيدة.'},
  {q:'How do you say “a blue book”?',a:'كتاب أزرق',w:['أزرق كتاب','كتاب الأزرق'],ar:1,why:'Noun first, then the color; no ال on either for “a blue book”.'},
  {q:'Where does an Arabic adjective go?',a:'After the noun',w:['Before the noun','At the end of the sentence'],why:'The adjective follows the noun.'}
 ]},

/* ---------- longer conversations and readings, plus the capstone lesson ---------- */
const TT=(ar,tr,en)=>({who:'them',ar,tr,en});
const W=w=>({ar:w[0],tr:w[1],en:w[2]});
const YY=(ar,tr,en,w1,w2)=>({who:'you',ar,tr,en,wrong:[W(w1),W(w2)]});

LESSONS[2].dialogue2={scene:'You are Layla, a student from Egypt. Your friend Muna is from Syria and is also a student. You meet Karim, a student from Lebanon, at the university.',lines:[
 TT('أهلاً! اسمي كريم. ما اسمك؟','ahlan! ismii kariim. maa smuk?','Hello! My name is Karim. What is your name?'),
 YY('اسمي ليلى. تشرفنا يا كريم','ismii layla. tasharrafnaa yaa kariim','My name is Layla. Pleased to meet you, Karim.',['اسمي كريم','ismii kariim','My name is Karim.'],['مع السلامة','ma‘a s-salaama','Goodbye.']),
 TT('من أين أنتِ يا ليلى؟','min ayna anti yaa layla?','Where are you from, Layla?'),
 YY('أنا من مصر. وأنتَ؟','anaa min miSr. wa anta?','I am from Egypt. And you?',['أنا من سوريا','anaa min suuriyaa','I am from Syria.'],['نعم','na‘am','Yes.']),
 TT('أنا من لبنان. هل أنتِ طالبة؟','anaa min lubnaan. hal anti Taaliba?','I am from Lebanon. Are you a student?'),
 YY('نعم، أنا طالبة في الجامعة','na‘am, anaa Taaliba fii l-jaami‘a','Yes, I am a student at the university.',['لا، أنا معلمة','laa, anaa mu‘allima','No, I am a teacher.'],['نعم، أنا طالب','na‘am, anaa Taalib','Yes, I am a student (said by a man).']),
 TT('وأنا طالب في الجامعة أيضاً. هل صديقتك من مصر أيضاً؟','wa anaa Taalib fii l-jaami‘a aydan. hal Sadiiqatuki min miSr aydan?','I am a student at the university too. Is your friend also from Egypt?'),
 YY('لا، صديقتي من سوريا','laa, Sadiiqatii min suuriyaa','No, my friend is from Syria.',['نعم، صديقتي من مصر','na‘am, Sadiiqatii min miSr','Yes, my friend is from Egypt.'],['لا، صديقي من سوريا','laa, Sadiiqii min suuriyaa','No, my (male) friend is from Syria.']),
 TT('ما اسم صديقتك؟','maa smu Sadiiqatik?','What is your friend’s name?'),
 YY('اسمها منى','ismuhaa munaa','Her name is Muna.',['اسمه منى','ismuhu munaa','His name is Muna.'],['اسمي ليلى','ismii layla','My name is Layla.']),
 TT('هل هي طالبة أيضاً؟','hal hiya Taaliba aydan?','Is she a student too?'),
 YY('نعم، هي طالبة أيضاً','na‘am, hiya Taaliba aydan','Yes, she is a student too.',['نعم، هو طالب أيضاً','na‘am, huwa Taalib aydan','Yes, he is a student too.'],['لا أفهم','laa afham','I don’t understand.']),
 TT('إلى اللقاء يا ليلى','ilaa l-liqaa’ yaa layla','See you later, Layla.'),
 YY('مع السلامة يا كريم','ma‘a s-salaama yaa kariim','Goodbye, Karim.',['صباح الخير','SabaaHu l-khayr','Good morning.'],['لا','laa','No.'])
]};

LESSONS[3].dialogue2={scene:'You are Layla. Today is Friday. Your classes are on Sunday and Tuesday. On Saturday you stay at home. Your house number is seven.',lines:[
 TT('مرحباً يا ليلى. ما اليوم؟','marHaban yaa layla. maa l-yawm?','Hello, Layla. What day is it?'),
 YY('اليوم الجمعة','al-yawm al-jumu‘a','Today is Friday.',['اليوم الأحد','al-yawm al-aHad','Today is Sunday.'],['اليوم الخميس','al-yawm al-khamiis','Today is Thursday.']),
 TT('وغداً؟','wa ghadan?','And tomorrow?'),
 YY('غداً السبت','ghadan as-sabt','Tomorrow is Saturday.',['غداً الأحد','ghadan al-aHad','Tomorrow is Sunday.'],['غداً الجمعة','ghadan al-jumu‘a','Tomorrow is Friday.']),
 TT('متى الصف؟','mataa S-Saff?','When is the class?'),
 YY('الصف يوم الأحد ويوم الثلاثاء','aS-Saff yawm al-aHad wa yawm ath-thulaathaa’','The class is on Sunday and Tuesday.',['الصف يوم الجمعة','aS-Saff yawm al-jumu‘a','The class is on Friday.'],['الصف في المدينة','aS-Saff fii l-madiina','The class is in the city.']),
 TT('ما اليوم بعد الثلاثاء؟','maa l-yawm ba‘da th-thulaathaa’?','What day comes after Tuesday?'),
 YY('الأربعاء','al-arbi‘aa’','Wednesday.',['الاثنين','al-ithnayn','Monday.'],['الخميس','al-khamiis','Thursday.']),
 TT('وما اليوم قبل الجمعة؟','wa maa l-yawm qabla l-jumu‘a?','And what day comes before Friday?'),
 YY('الخميس','al-khamiis','Thursday.',['السبت','as-sabt','Saturday.'],['الأحد','al-aHad','Sunday.']),
 TT('هل أنتِ في الجامعة يوم السبت؟','hal anti fii l-jaami‘a yawm as-sabt?','Are you at the university on Saturday?'),
 YY('لا، يوم السبت أنا في البيت','laa, yawm as-sabt anaa fii l-bayt','No, on Saturday I am at home.',['نعم، أنا في الجامعة','na‘am, anaa fii l-jaami‘a','Yes, I am at the university.'],['لا، أنا من مصر','laa, anaa min miSr','No, I am from Egypt.']),
 TT('ما رقم بيتك؟','maa raqmu baytik?','What is your house number?'),
 YY('رقم بيتي سبعة','raqmu baytii sab‘a','My house number is seven.',['رقم بيتي ثلاثة','raqmu baytii thalaatha','My house number is three.'],['رقم بيتي عشرة','raqmu baytii ‘ashara','My house number is ten.']),
 TT('شكراً يا ليلى','shukran yaa layla','Thank you, Layla.'),
 YY('عفواً','‘afwan','You’re welcome.',['نعم','na‘am','Yes.'],['لا أفهم','laa afham','I don’t understand.'])
]};

 YY('هذا أبي','haadhaa abii','This is my father.',['هذا أخي','haadhaa akhii','This is my brother.'],['هذا جدي','haadhaa jaddii','This is my grandfather.']),
 TT('ومن هذه؟','wa man haadhihi?','And who is this? (pointing at your mother)'),
 YY('هذه أمي','haadhihi ummii','This is my mother.',['هذه أختي','haadhihi ukhtii','This is my sister.'],['هذه جدتي','haadhihi jaddatii','This is my grandmother.']),
 TT('هل أبوك معلم؟','hal abuuki mu‘allim?','Is your father a teacher?'),
 YY('نعم، أبي معلم وأمي معلمة أيضاً','na‘am, abii mu‘allim wa ummii mu‘allima aydan','Yes, my father is a teacher and my mother is a teacher too.',['لا، أبي طالب','laa, abii Taalib','No, my father is a student.'],['نعم، أمي طالبة','na‘am, ummii Taaliba','Yes, my mother is a student.']),
 TT('ومن هذا؟','wa man haadhaa?','And who is this? (pointing at your brother)'),

 TT('هل سامي طالب؟','hal saamii Taalib?','Is Sami a student?'),
 YY('نعم، هو طالب في المدرسة','na‘am, huwa Taalib fii l-madrasa','Yes, he is a student at school.',['لا، هو معلم','laa, huwa mu‘allim','No, he is a teacher.'],['نعم، هي طالبة','na‘am, hiya Taaliba','Yes, she is a student.']),
 TT('ومن هذه؟','wa man haadhihi?','And who is this? (pointing at your grandmother)'),
 YY('هذه جدتي','haadhihi jaddatii','This is my grandmother.',['هذه زوجتي','haadhihi zawjatii','This is my wife.'],['هذه أختي','haadhihi ukhtii','This is my sister.']),

 TT('عائلة جميلة!','‘aa’ila jamiila!','A beautiful family!'),

LESSONS[5].dialogue2={scene:'You are Layla, a new student in an Arabic class in the city. You are from Egypt. Your teacher is Khalid. Your classes are on Sunday and Tuesday. You have a book and a pen. You speak a little Arabic and you do not always understand.',lines:[

 TT('وأين مدرستك؟','wa ayna madrastuki?','And where is your school?'),
 YY('مدرستي في المدينة','madrastii fii l-madiina','My school is in the city.',['مدرستي في السوق','madrastii fii s-suuq','My school is at the market.'],['نعم','na‘am','Yes.']),

 TT('هل تتكلمين العربية؟','hal tatakallamiin al-‘arabiyya?','Do you speak Arabic?'),
 YY('نعم، قليلاً','na‘am, qaliilan','Yes, a little.',['نعم، كثيراً','na‘am, kathiiran','Yes, a lot.'],['عفواً','‘afwan','You’re welcome.']),
 TT('هل تفهمين؟','hal tafhamiin?','Do you understand?'),
 YY('لا أفهم، أعد من فضلك','laa afham, a‘id min faDlik','I don’t understand, please repeat.',['نعم، أفهم كثيراً','na‘am, afham kathiiran','Yes, I understand a lot.'],['مع السلامة','ma‘a s-salaama','Goodbye.']),
 TT('حسناً. كيف حالك اليوم؟','Hasanan. kayfa Haaluki al-yawm?','Okay. How are you today?'),
 YY('بخير، الحمد لله','bi-khayr, l-Hamdu lillaah','Fine, thank God.',['اسمي ليلى','ismii layla','My name is Layla.'],['مع السلامة','ma‘a s-salaama','Goodbye.']),
 TT('إلى اللقاء يوم الأحد','ilaa l-liqaa’ yawm al-aHad','See you on Sunday.'),
 YY('مع السلامة','ma‘a s-salaama','Goodbye.',['صباح الخير','SabaaHu l-khayr','Good morning.'],['من فضلك','min faDlik','Please.'])
]};

LESSONS.push({id:'L8',ar:'مراجعة',en:'Putting it together',kind:'words',
 goals:['Review the grammar from Lessons 1 to 7','Follow a longer conversation (20 lines)','Read a longer text (25 sentences)'],
 vocab:V([['أريد','uriid','I want'],['أو','aw','or'],['صغير','Saghiir','small (m.)'],['قميص','qamiiS','shirt'],['بكم','bi-kam','how much?'],['ثم','thumma','then'],
  ['حسناً','Hasanan','okay, good'],['كثيراً','kathiiran','a lot'],['قليلاً','qaliilan','a little'],['جميل','jamiil','beautiful (m.)'],['رقم','raqm','number'],['قبل','qabla','before'],
  ['أسبوع','usbuu‘','week'],['أفهم','afham','I understand'],['جديد','jadiid','new (m.)'],['يقول','yaquul','he says'],['تقول','taquul','she says'],['يحب','yuHibb','he likes'],['تحب','tuHibb','she likes']]),
 grammar:{notes:[
  {h:'No “is / am / are”',p:'In the present, Arabic puts the two parts side by side.',ex:[['ليلى طالبة','laylaa Taaliba','Layla is a student']]},
  {h:'Gender and describing words',p:'Feminine words usually end in ـة. A describing word comes after its noun and agrees with it.',ex:[['مدينة كبيرة','madiina kabiira','a big city'],['قميص أزرق','qamiiS azraq','a blue shirt']]},
  {h:'“The”, “my”, “his”, “her”',p:'ال means “the”. The endings ـي, ـه, ـها, ـك mean my, his, her, your.',ex:[['القميص الأزرق','al-qamiiS al-azraq','the blue shirt'],['عائلتها','‘aa’ilatuhaa','her family']]},
  {h:'Questions',p:'هل starts a yes/no question. أين, من, متى, كيف, كم, ما and ماذا ask for information.',ex:[['أين أخوك؟','ayna akhuuk?','Where is your brother?']]},
  {h:'Useful new patterns',p:'أريد means “I want”, بكم هذا؟ asks the price, أو means “or” and ثم means “then”.',ex:[['أريد قهوة أو شاي','uriid qahwa aw shaay','I want coffee or tea'],['بكم هذا؟','bi-kam haadhaa?','How much is this?']]}
 ],
 drill:[
  {q:'How do you say “my sister is happy”?',a:'أختي سعيدة',w:['أختي سعيد','سعيدة أختي'],ar:1,why:'أخت is feminine, so the adjective is سعيدة, and it follows the noun.'},
  {q:'How do you say “the big school”?',a:'المدرسة الكبيرة',w:['مدرسة الكبيرة','الكبيرة المدرسة'],ar:1,why:'Both words take ال, and the adjective follows and agrees.'},
  {q:'How do you ask “Where is the market?”',a:'أين السوق؟',w:['من السوق؟','متى السوق؟'],ar:1,why:'أين = where.'},
  {q:'How do you say “her book”?',a:'كتابها',w:['كتابه','كتابي'],ar:1,why:'ـها means “her”.'},
  {q:'Which word means “I want”?',a:'أريد',w:['أفهم','أحب'],ar:1,why:'أريد = I want, أفهم = I understand, أحب = I like.'},
  {q:'How do you say “Tomorrow is Sunday”?',a:'غداً الأحد',w:['اليوم الأحد','غداً السبت'],ar:1,why:'غداً = tomorrow.'},

 ]},
 dialogue:{scene:'You are Layla. You meet your friend Muna, a student from Syria, at a café near the university. Today is Thursday. You like coffee and your book. Your brother Sami is at school today, and he likes school a lot. Tomorrow you stay at home.',lines:[
  TT('السلام عليكم يا ليلى! كيف حالك؟','as-salaamu ‘alaykum yaa layla! kayfa Haaluki?','Peace be upon you, Layla! How are you?'),
  YY('وعليكم السلام يا منى. بخير، الحمد لله','wa ‘alaykumu s-salaam yaa munaa. bi-khayr, l-Hamdu lillaah','And upon you peace, Muna. Fine, thank God.',['صباح الخير يا ليلى','SabaaHu l-khayr yaa layla','Good morning, Layla.'],['مع السلامة يا منى','ma‘a s-salaama yaa munaa','Goodbye, Muna.']),
  TT('هل تريدين قهوة أو شاي؟','hal turiidiin qahwa aw shaay?','Would you like coffee or tea?'),
  YY('أريد قهوة من فضلك','uriidu qahwa min faDlik','I would like coffee, please.',['أريد شاي من فضلك','uriidu shaay min faDlik','I would like tea, please.'],['أريد قلماً من فضلك','uriidu qalaman min faDlik','I would like a pen, please.']),
  TT('وأنا أريد شاي. هل أنتِ في الجامعة اليوم؟','wa anaa uriidu shaay. hal anti fii l-jaami‘a al-yawm?','And I would like tea. Are you at the university today?'),
  YY('نعم، أنا في الجامعة اليوم','na‘am, anaa fii l-jaami‘a al-yawm','Yes, I am at the university today.',['لا، أنا في السوق اليوم','laa, anaa fii s-suuq al-yawm','No, I am at the market today.'],['نعم، أنا في المدرسة','na‘am, anaa fii l-madrasa','Yes, I am at school.']),
  TT('وأين أخوك سامي؟','wa ayna akhuuki saamii?','And where is your brother Sami?'),
  YY('هو في المدرسة اليوم','huwa fii l-madrasa al-yawm','He is at school today.',['هي في المدرسة اليوم','hiya fii l-madrasa al-yawm','She is at school today.'],['هو في السوق اليوم','huwa fii s-suuq al-yawm','He is at the market today.']),
  TT('هل يحب سامي المدرسة؟','hal yuHibb saamii l-madrasa?','Does Sami like school?'),
  YY('نعم، يحب المدرسة كثيراً','na‘am, yuHibb al-madrasa kathiiran','Yes, he likes school a lot.',['لا، لا يحب المدرسة','laa, laa yuHibb al-madrasa','No, he does not like school.'],['نعم، هي تحب المدرسة','na‘am, hiya tuHibb al-madrasa','Yes, she likes school.']),
  TT('وماذا تحبين أنتِ؟','wa maadhaa tuHibbiin anti?','And what do you like?'),
  YY('أحب القهوة والكتاب','uHibb al-qahwa wa l-kitaab','I like coffee and the book.',['أحب الشاي والباب','uHibb ash-shaay wa l-baab','I like tea and the door.'],['أنا من مصر','anaa min miSr','I am from Egypt.']),
  TT('عندي قميص جديد. هل تحبين القميص الأزرق؟','‘indii qamiiS jadiid. hal tuHibbiin al-qamiiS al-azraq?','I have a new shirt. Do you like the blue shirt?'),
  YY('نعم، القميص الأزرق جميل','na‘am, al-qamiiS al-azraq jamiil','Yes, the blue shirt is beautiful.',['لا أفهم','laa afham','I don’t understand.'],['مع السلامة','ma‘a s-salaama','Goodbye.']),
  TT('شكراً! ما اليوم؟','shukran! maa l-yawm?','Thank you! What day is it?'),
  YY('اليوم الخميس، وغداً الجمعة','al-yawm al-khamiis, wa ghadan al-jumu‘a','Today is Thursday and tomorrow is Friday.',['اليوم الأربعاء، وغداً الخميس','al-yawm al-arbi‘aa’, wa ghadan al-khamiis','Today is Wednesday and tomorrow is Thursday.'],['اليوم الجمعة، وغداً السبت','al-yawm al-jumu‘a, wa ghadan as-sabt','Today is Friday and tomorrow is Saturday.']),
  TT('هل أنتِ في الجامعة غداً؟','hal anti fii l-jaami‘a ghadan?','Are you at the university tomorrow?'),
  YY('لا، يوم الجمعة أنا في البيت','laa, yawm al-jumu‘a anaa fii l-bayt','No, on Friday I am at home.',['نعم، أنا في الجامعة غداً','na‘am, anaa fii l-jaami‘a ghadan','Yes, I am at the university tomorrow.'],['لا، غداً الأحد','laa, ghadan al-aHad','No, tomorrow is Sunday.']),

  YY('مع السلامة يا منى','ma‘a s-salaama yaa munaa','Goodbye, Muna.',['مرحباً يا منى','marHaban yaa munaa','Hello, Muna.'],['من فضلك يا منى','min faDlik yaa munaa','Please, Muna.'])
 ]},

 grammar:{notes:[
  {h:'A verb starts with a person marker',p:'In the present, a verb begins with a letter that shows who is acting: أ = I, ن = we, ي = he, ت = she (or “you” to a man). The rest of the verb, the stem, stays the same.',

  {h:'ت has two jobs',p:'The prefix ت means “she” and also “you” (to a man). The pronoun or the situation tells you which.',
   ex:[['هي تقرأ','hiya taqra’','she reads'],['أنتَ تقرأ','anta taqra’','you read']]},
  {h:'The thing you do it to',p:'The object follows the verb directly, with no word in between.',

LESSONS.push({id:'L10',ar:'الماضي',en:'The past tense',kind:'words',
 goals:['Say what happened: he wrote, she went, we read','Match the verb to a masculine or feminine subject','Say “yesterday” and “did not”'],
 vocab:V([['كتب','kataba','he wrote'],['قرأ','qara’a','he read'],['ذهب','dhahaba','he went'],['شرب','shariba','he drank'],['أكل','akala','he ate'],['فتح','fataHa','he opened'],

 grammar:{notes:[
  {h:'Past tense: the stem plus an ending',p:'The “he” form is the simplest: كتب. Add ـت for “she” or “I”, and ـنا for “we”.',
   ex:[['كتب','kataba','he wrote'],['كتبت','katabat','she wrote'],['كتبت','katabtu','I wrote'],['كتبنا','katabnaa','we wrote']]},
  {h:'Same spelling, different person',p:'Without vowel marks, “she wrote” and “I wrote” look identical. The rest of the sentence tells you who it is.',
   ex:[['ذهبت ليلى إلى السوق','dhahabat laylaa ilaa s-suuq','Layla went to the market'],['ذهبت إلى السوق','dhahabtu ilaa s-suuq','I went to the market']]},
  {h:'The verb matches its subject',p:'When the verb comes first, it matches the gender of the subject: masculine for Karim, feminine for Layla.',
   ex:[['ذهب كريم','dhahaba kariim','Karim went'],['ذهبت ليلى','dhahabat laylaa','Layla went']]},
  {h:'Yesterday',p:'Put أمس at the start to say when it happened.',ex:[['أمس قرأت الكتاب','ams qara’tu al-kitaab','Yesterday I read the book']]},
  {h:'“Did not”',p:'To say “did not”, use لم before a present-tense verb.',ex:[['لم أذهب','lam adhhab','I did not go'],['لم يكتب','lam yaktub','he did not write']]},
  {h:'Asking about the past',p:'ماذا فعلتِ؟ asks “What did you do?” (to a woman). هل ذهبتِ؟ asks “Did you go?”',ex:[['ماذا فعلتِ أمس؟','maadhaa fa‘alti ams?','What did you do yesterday?']]}
 ],

 dialogue2:{scene:'You are Layla. Yesterday you stayed away from the university. You went to the market with your mother in the morning and bought bread and apples. At home you ate bread, drank tea, read a book and wrote with the pen. Your brother Sami went to school.',lines:[

  YY('ذهبت إلى السوق مع أمي','dhahabtu ilaa s-suuq ma‘a ummii','I went to the market with my mother.',['ذهب إلى السوق مع أمي','dhahaba ilaa s-suuq ma‘a ummii','He went to the market with my mother.'],['ذهبنا إلى الجامعة','dhahabnaa ilaa l-jaami‘a','We went to the university.']),
  TT('هل ذهبتِ إلى الجامعة؟','hal dhahabti ilaa l-jaami‘a?','Did you go to the university?'),
  YY('لا، لم أذهب إلى الجامعة','laa, lam adhhab ilaa l-jaami‘a','No, I did not go to the university.',['نعم، ذهبت إلى الجامعة','na‘am, dhahabtu ilaa l-jaami‘a','Yes, I went to the university.'],['لا، لم يذهب إلى الجامعة','laa, lam yadhhab ilaa l-jaami‘a','No, he did not go to the university.']),
  TT('وماذا اشتريتِ من السوق؟','wa maadhaa ishtarayti mina s-suuq?','And what did you buy at the market?'),
  YY('اشتريت الخبز والتفاح','ishtaraytu l-khubz wa t-tuffaaH','I bought bread and apples.',['أشتري الخبز والتفاح','ashtarii l-khubz wa t-tuffaaH','I buy bread and apples.'],['اشترى الخبز والتفاح','ishtaraa l-khubz wa t-tuffaaH','He bought bread and apples.']),
  TT('هل أكلتِ الخبز؟','hal akalti l-khubz?','Did you eat the bread?'),
  YY('نعم، أكلت الخبز في البيت','na‘am, akaltu l-khubz fii l-bayt','Yes, I ate the bread at home.',['نعم، آكل الخبز في البيت','na‘am, aakul al-khubz fii l-bayt','Yes, I eat the bread at home.'],['نعم، أكلنا الخبز في المدرسة','na‘am, akalnaa l-khubz fii l-madrasa','Yes, we ate the bread at school.']),
  TT('وماذا شربتِ؟','wa maadhaa sharibti?','And what did you drink?'),
  YY('شربت الشاي','sharibtu sh-shaay','I drank tea.',['شرب الشاي','shariba sh-shaay','He drank tea.'],['أشرب الشاي','ashrab ash-shaay','I drink tea.']),
  TT('هل قرأتِ كتاباً؟','hal qara’ti kitaaban?','Did you read a book?'),
  YY('نعم، قرأت كتاباً وكتبت بالقلم','na‘am, qara’tu kitaaban wa katabtu bi-l-qalam','Yes, I read a book and wrote with the pen.',['نعم، قرأ كتاباً وكتب بالقلم','na‘am, qara’a kitaaban wa kataba bi-l-qalam','Yes, he read a book and wrote with the pen.'],['نعم، أقرأ كتاباً وأكتب بالقلم','na‘am, aqra’ kitaaban wa aktub bi-l-qalam','Yes, I read a book and write with the pen.']),
  TT('وأخوك سامي؟ ماذا فعل؟','wa akhuuki saamii? maadhaa fa‘ala?','And your brother Sami? What did he do?'),
  YY('ذهب إلى المدرسة','dhahaba ilaa l-madrasa','He went to school.',['ذهبت إلى المدرسة','dhahabat ilaa l-madrasa','She went to school.'],['يذهب إلى المدرسة','yadhhab ilaa l-madrasa','He goes to school.']),
  TT('وأمك؟ هل ذهبت معك؟','wa ummuki? hal dhahabat ma‘aki?','And your mother? Did she go with you?'),
  YY('نعم، ذهبت أمي معي','na‘am, dhahabat ummii ma‘ii','Yes, my mother went with me.',['نعم، ذهب أمي معي','na‘am, dhahaba ummii ma‘ii','Yes, my mother (he) went with me.'],['لا، لم تذهب أمي معي','laa, lam tadhhab ummii ma‘ii','No, my mother did not go with me.']),
  TT('شكراً يا ليلى','shukran yaa layla','Thank you, Layla.'),
  YY('عفواً يا كريم','‘afwan yaa kariim','You’re welcome, Karim.',['مع السلامة يا كريم','ma‘a s-salaama yaa kariim','Goodbye, Karim.'],['لا أفهم','laa afham','I don’t understand.'])
 ]},

LESSONS.push({id:'L11',ar:'حروف الجر والوقت',en:'Prepositions and time',kind:'words',
 goals:['Say where things are: in, on, under, next to, in front of','Say “with me”, “with you”, “with him”, “with her”','Tell the time and talk about parts of the day'],
 vocab:V([['في','fii','in, at'],['من','min','from'],['إلى','ilaa','to'],['على','‘alaa','on'],['مع','ma‘a','with'],['بعد','ba‘da','after'],['قبل','qabla','before'],
  ['تحت','taHta','under'],['أمام','amaama','in front of'],['بجانب','bi-jaanib','next to'],
  ['الساعة','as-saa‘a','the hour, the clock'],['كم الساعة؟','kam as-saa‘a?','what time is it?'],['الصباح','aS-SabaaH','the morning'],['الظهر','aDH-Dhuhr','noon'],['المساء','al-masaa’','the evening'],['الليل','al-layl','the night'],
  ['كل يوم','kulla yawm','every day'],['دائماً','daa’iman','always'],['أحياناً','aHyaanan','sometimes'],
  ['الواحدة','al-waaHida','one o’clock'],['الثانية','ath-thaaniya','two o’clock'],['الثالثة','ath-thaalitha','three o’clock'],['الرابعة','ar-raabi‘a','four o’clock'],['الخامسة','al-khaamisa','five o’clock'],
  ['السادسة','as-saadisa','six o’clock'],['السابعة','as-saabi‘a','seven o’clock'],['الثامنة','ath-thaamina','eight o’clock'],['التاسعة','at-taasi‘a','nine o’clock'],['العاشرة','al-‘aashira','ten o’clock'],
  ['والنصف','wa n-niSf','and a half'],['والربع','wa r-rub‘','and a quarter']]),
 grammar:{notes:[
  {h:'Little words with big jobs',p:'A preposition comes before the noun it goes with. Most are separate words.',
   ex:[['في البيت','fii l-bayt','in the house'],['من مصر','min miSr','from Egypt'],['إلى السوق','ilaa s-suuq','to the market'],['على الباب','‘alaa l-baab','on the door'],['مع كريم','ma‘a kariim','with Karim']]},
  {h:'Where things are',p:'تحت, أمام and بجانب work the same way. No word for “is” is needed.',
   ex:[['القلم على الكتاب','al-qalam ‘alaa l-kitaab','The pen is on the book'],['أنا أمام البيت','anaa amaama l-bayt','I am in front of the house'],['المدرسة بجانب السوق','al-madrasa bi-jaanib as-suuq','The school is next to the market']]},
  {h:'With me, with you, with him, with her',p:'Add an ending to مع, just as you added endings to nouns for “my”, “his” and “her”.',
   ex:[['معي','ma‘ii','with me'],['معك','ma‘aka / ma‘aki','with you (m. / f.)'],['معه','ma‘ahu','with him'],['معها','ma‘ahaa','with her']]},
  {h:'One-letter prepositions',p:'بـ (“with, by”) and لـ (“for, to”) attach to the next word. Before ال, the لـ merges with it: ل + ال becomes لل.',
   ex:[['أكتب بالقلم','aktub bi-l-qalam','I write with the pen'],['هذا الكتاب للمعلم','haadhaa l-kitaab lil-mu‘allim','This book is for the teacher']]},
  {h:'Telling the time',p:'Ask كم الساعة؟ and answer with الساعة and a feminine ordinal number (the third, the fourth …). Add والنصف for “and a half” and والربع for “and a quarter”.',
   ex:[['كم الساعة؟','kam as-saa‘a?','What time is it?'],['الساعة الثالثة','as-saa‘a th-thaalitha','It is three o’clock'],['الساعة الرابعة والنصف','as-saa‘a r-raabi‘a wa n-niSf','It is half past four'],['الساعة السادسة والربع','as-saa‘a s-saadisa wa r-rub‘','It is a quarter past six']]},
  {h:'At a time, and how often',p:'Use في before الساعة to say “at”: في الساعة التاسعة. Parts of the day also take في. دائماً means “always” and أحياناً means “sometimes”.',
   ex:[['في الساعة التاسعة','fii s-saa‘a t-taasi‘a','at nine o’clock'],['في المساء','fii l-masaa’','in the evening'],['أذهب إلى المدرسة كل يوم','adhhab ilaa l-madrasa kulla yawm','I go to school every day']]}
 ],
 drill:[
  {q:'Which word means “in”?',a:'في',w:['من','إلى'],ar:1,why:'في = in, من = from, إلى = to.'},
  {q:'How do you say “from Egypt”?',a:'من مصر',w:['إلى مصر','على مصر'],ar:1,why:'من = from.'},
  {q:'How do you say “with me”?',a:'معي',w:['معك','معه'],ar:1,why:'ـي = me.'},
  {q:'How do you say “with her”?',a:'معها',w:['معه','معي'],ar:1,why:'ـها = her.'},
  {q:'How do you say “I write with the pen”?',a:'أكتب بالقلم',w:['أكتب من القلم','أكتب إلى القلم'],ar:1,why:'بـ attaches to the next word and means “with”.'},
  {q:'What time is “الساعة الثالثة”?',a:'Three o’clock',w:['Four o’clock','Two o’clock'],why:'الثالثة = the third hour.'},
  {q:'How do you say “half past four”?',a:'الساعة الرابعة والنصف',w:['الساعة الرابعة والربع','الساعة الخامسة والنصف'],ar:1,why:'الرابعة = four, والنصف = and a half.'},
  {q:'Which word means “always”?',a:'دائماً',w:['أحياناً','كل يوم'],ar:1,why:'دائماً = always, أحياناً = sometimes.'}
 ]},
 dialogue:{scene:'You are Layla at a café. It is three o’clock. The school is next to the café, and you are going there now.',lines:[

 dialogue2:{scene:'You are Layla, making plans with your friend Muna. Tomorrow you go to the university at nine in the morning with Karim. The university is next to the market. After class you drink coffee at the café, and you meet Muna there at five o’clock. In the evening you are always at home. Yesterday you went to the market with your mother.',lines:[
  TT('مرحباً يا ليلى. ماذا تفعلين غداً؟','marHaban yaa layla. maadhaa taf‘aliina ghadan?','Hello, Layla. What are you doing tomorrow?'),

  TT('وأين الجامعة؟','wa ayna l-jaami‘a?','And where is the university?'),
  YY('الجامعة بجانب السوق','al-jaami‘a bi-jaanib as-suuq','The university is next to the market.',['الجامعة تحت السوق','al-jaami‘a taHta s-suuq','The university is under the market.'],['الجامعة من السوق','al-jaami‘a mina s-suuq','The university is from the market.']),

  YY('كريم يذهب معي','kariim yadhhab ma‘ii','Karim goes with me.',['كريم يذهب معك','kariim yadhhab ma‘aki','Karim goes with you.'],['كريم يذهب معها','kariim yadhhab ma‘ahaa','Karim goes with her.']),
  TT('وماذا تفعلين بعد الصف؟','wa maadhaa taf‘aliina ba‘da S-Saff?','And what do you do after class?'),

  TT('في أي ساعة نذهب إلى المقهى؟','fii ayyi saa‘a nadhhab ilaa l-maqhaa?','At what time do we go to the café?'),
  YY('في الساعة الخامسة','fii s-saa‘a l-khaamisa','At five o’clock.',['في الساعة التاسعة','fii s-saa‘a t-taasi‘a','At nine o’clock.'],['في الساعة الخامسة والنصف','fii s-saa‘a l-khaamisa wa n-niSf','At half past five.']),
  TT('وماذا تفعلين في المساء؟','wa maadhaa taf‘aliina fii l-masaa’?','And what do you do in the evening?'),

 grammar:{notes:[
  {h:'Asking where a place is',p:'Start with أين and name the place. The answer uses the little words from Lesson 11: في, على, بجانب, أمام, تحت.',
   ex:[['أين المدرسة؟','ayna l-madrasa?','Where is the school?'],['أين المستشفى؟','ayna l-mustashfaa?','Where is the hospital?']]},
  {h:'Near and far',p:'قريب من means “near” and بعيد عن means “far from”. Notice that each uses a different little word. The adjective agrees with the place, so feminine places take قريبة and بعيدة.',
   ex:[['المدرسة قريبة من البيت','al-madrasa qariiba mina l-bayt','The school is near the house'],['المسجد قريب من السوق','al-masjid qariib mina s-suuq','The mosque is near the market'],['المستشفى بعيد عن البيت','al-mustashfaa ba‘iid ‘ani l-bayt','The hospital is far from the house']]},
  {h:'Right and left',p:'على اليمين is “on the right” and على اليسار is “on the left”. مباشرة means “straight ahead”.',
   ex:[['المكتبة على اليمين','al-maktaba ‘alaa l-yamiin','The library is on the right'],['المحطة على اليسار','al-maHaTTa ‘alaa l-yasaar','The station is on the left']]},
  {h:'Telling someone where to go',p:'To tell a man to go, say اذهب. To tell a woman, say اذهبي. Add ثم (“then”) for the next step.',

  {h:'Is there …?',p:'Ask هل يوجد … هنا؟ for “Is there … here?”. Answer نعم، يوجد … or لا يوجد.',
   ex:[['هل يوجد مطعم هنا؟','hal yuujad maT‘am hunaa?','Is there a restaurant here?'],['نعم، يوجد مطعم','na‘am, yuujad maT‘am','Yes, there is a restaurant'],['لا يوجد مطعم','laa yuujad maT‘am','There is no restaurant']]},
  {h:'From one place to another',p:'Use من for the place you start from and إلى for the place you are going to.',

  {q:'How do you say “This is a woman”?',a:'هذه امرأة',w:['هذا امرأة','هذه رجل'],ar:1,why:'امرأة is feminine, so هذه.'},
  {q:'Which word means “doctor” (a woman)?',a:'طبيبة',w:['طبيب','طفل'],ar:1,why:'طبيبة is the feminine form of طبيب.'},
  {q:'How do you say “a tall woman”?',a:'امرأة طويلة',w:['امرأة طويل','طويلة امرأة'],ar:1,why:'The adjective follows the noun and takes the feminine ending.'}
 ]},
 dialogue:{scene:'You are Layla at the doctor’s. Your head hurts and your back hurts. The doctor is a woman.',lines:[
  TT('صباح الخير. ما اسمك؟','SabaaHu l-khayr. maa smuk?','Good morning. What is your name?'),
  YY('اسمي ليلى','ismii layla','My name is Layla.',['اسمها ليلى','ismuhaa layla','Her name is Layla.'],['أنا طبيبة','anaa Tabiiba','I am a doctor.']),
  TT('ماذا عندك؟','maadhaa ‘indaki?','What is wrong with you?'),
  YY('عندي ألم في رأسي','‘indii alam fii ra’sii','I have pain in my head.',['عندي ألم في يده','‘indii alam fii yadihi','I have pain in his hand.'],['عندي رأسي في ألم','‘indii ra’sii fii alam','I have my head in pain.']),
  TT('وهل عندك ألم في ظهرك؟','wa hal ‘indaki alam fii Dhahrik?','And do you have pain in your back?'),
  YY('نعم، عندي ألم في ظهري','na‘am, ‘indii alam fii Dhahrii','Yes, I have pain in my back.',['نعم، عندي ألم في ظهرها','na‘am, ‘indii alam fii Dhahrihaa','Yes, I have pain in her back.'],['لا، عندي ألم في قدمي','laa, ‘indii alam fii qadamii','No, I have pain in my foot.']),
  TT('شكراً. إلى اللقاء','shukran. ilaa l-liqaa’','Thank you. See you later.'),
  YY('مع السلامة','ma‘a s-salaama','Goodbye.',['صباح الخير','SabaaHu l-khayr','Good morning.'],['لا','laa','No.'])
 ]},
 dialogue2:{scene:'You are Layla, describing your family to your friend Muna. Your father is tall and strong, and he is a doctor. Your mother is short and beautiful, and her hair is black. Your brother Sami is a small boy. Your grandmother has pain in her back, and she went to a woman doctor.',lines:[
  TT('هل أبوك طويل؟','hal abuuki Tawiil?','Is your father tall?'),
  YY('نعم، أبي طويل وقوي','na‘am, abii Tawiil wa qawii','Yes, my father is tall and strong.',['لا، أبي قصير','laa, abii qaSiir','No, my father is short.'],['نعم، أبي طويلة','na‘am, abii Tawiila','Yes, my father is tall (feminine ending).']),
  TT('وماذا يعمل أبوك؟','wa maadhaa ya‘mal abuuki?','And what does your father do for work?'),
  YY('أبي طبيب','abii Tabiib','My father is a doctor.',['أبي طبيبة','abii Tabiiba','My father is a doctor (feminine ending).'],['أبي طفل','abii Tifl','My father is a child.']),
  TT('وأمك؟ هل هي طويلة؟','wa ummuki? hal hiya Tawiila?','And your mother? Is she tall?'),
  YY('لا، أمي قصيرة','laa, ummii qaSiira','No, my mother is short.',['لا، أمي قصير','laa, ummii qaSiir','No, my mother is short (masculine ending).'],['نعم، أمي طويلة','na‘am, ummii Tawiila','Yes, my mother is tall.']),
  TT('هل أمك جميلة؟','hal ummuki jamiila?','Is your mother beautiful?'),
  YY('نعم، أمي جميلة','na‘am, ummii jamiila','Yes, my mother is beautiful.',['نعم، أمي جميل','na‘am, ummii jamiil','Yes, my mother is beautiful (masculine ending).'],['نعم، أبي جميلة','na‘am, abii jamiila','Yes, my father is beautiful (feminine ending).']),
  TT('هل شعر أمك أسود؟','hal sha‘ru ummuki aswad?','Is your mother’s hair black?'),
  YY('نعم، شعرها أسود','na‘am, sha‘ruhaa aswad','Yes, her hair is black.',['نعم، شعره أسود','na‘am, sha‘ruhu aswad','Yes, his hair is black.'],['لا، شعرها أبيض','laa, sha‘ruhaa abyaD','No, her hair is white.']),
  TT('وأخوك سامي؟ هل هو كبير؟','wa akhuuki saamii? hal huwa kabiir?','And your brother Sami? Is he big?'),
  YY('لا، هو ولد صغير','laa, huwa walad Saghiir','No, he is a small boy.',['لا، هو امرأة صغيرة','laa, huwa imra’a Saghiira','No, he is a small woman.'],['نعم، هو رجل كبير','na‘am, huwa rajul kabiir','Yes, he is a big man.']),
  TT('وجدتك؟ هل هي مريضة؟','wa jaddatuki? hal hiya mariiDa?','And your grandmother? Is she sick?'),
  YY('عندها ألم في ظهرها','‘indahaa alam fii Dhahrihaa','She has pain in her back.',['عندها ألم في ظهره','‘indahaa alam fii Dhahrihi','She has pain in his back.'],['عندي ألم في ظهري','‘indii alam fii Dhahrii','I have pain in my back.']),
  TT('وهل ذهبت إلى الطبيب؟','wa hal dhahabat ilaa T-Tabiib?','And did she go to the doctor?'),
  YY('نعم، ذهبت إلى الطبيبة','na‘am, dhahabat ilaa T-Tabiiba','Yes, she went to the (female) doctor.',['نعم، ذهب إلى الطبيب','na‘am, dhahaba ilaa T-Tabiib','Yes, he went to the (male) doctor.'],['لا، أنا طبيبة','laa, anaa Tabiiba','No, I am a doctor.']),
  TT('شكراً يا ليلى','shukran yaa layla','Thank you, Layla.'),
  YY('عفواً يا منى','‘afwan yaa munaa','You’re welcome, Muna.',['مع السلامة يا منى','ma‘a s-salaama yaa munaa','Goodbye, Muna.'],['لا أفهم','laa afham','I don’t understand.'])
 ]},
 reading:{ar:'وصف الناس',en:'Describing people',
  s:[['هذا رجل طويل.','haadhaa rajul Tawiil.','This is a tall man.'],['هو طبيب قوي.','huwa Tabiib qawii.','He is a strong doctor.'],['وهذه امرأة قصيرة.','wa haadhihi imra’a qaSiira.','And this is a short woman.'],
     ['شعرها أسود ووجهها جميل.','sha‘ruhaa aswad wa wajhuhaa jamiil.','Her hair is black and her face is beautiful.'],['هي معلمة.','hiya mu‘allima.','She is a teacher.'],['وهذا ولد صغير.','wa haadhaa walad Saghiir.','And this is a small boy.'],
     ['وهذه بنت صغيرة.','wa haadhihi bint Saghiira.','And this is a small girl.'],['هم عائلة سعيدة.','hum ‘aa’ila sa‘iida.','They are a happy family.']],
  q:[['What is the tall man’s job?','Doctor',['Teacher','Student']],['What color is the woman’s hair?','Black',['White','Brown']],
     ['Who is small?','A boy and a girl',['The man and the woman','The doctor']],['How is the family?','Happy',['Sad','Tired']]]},
 reading2:{ar:'في المستشفى',en:'At the hospital (longer)',
  s:[['الطبيبة منى في المستشفى.','aT-Tabiiba munaa fii l-mustashfaa.','The doctor Muna is at the hospital.'],['هي امرأة طويلة وقوية.','hiya imra’a Tawiila wa qawiyya.','She is a tall and strong woman.'],
     ['في المستشفى ناس.','fii l-mustashfaa naas.','There are people in the hospital.'],['رجل عنده ألم في رأسه.','rajul ‘induhu alam fii ra’sihi.','A man has pain in his head.'],
     ['وامرأة عندها ألم في ظهرها.','wa imra’a ‘indahaa alam fii Dhahrihaa.','And a woman has pain in her back.'],['وولد صغير عنده ألم في يده.','wa walad Saghiir ‘induhu alam fii yadihi.','And a small boy has pain in his hand.'],
     ['الطبيبة تقول للرجل صباح الخير.','aT-Tabiiba taquul lir-rajul SabaaHa l-khayr.','The doctor says good morning to the man.'],['ثم تسأل الرجل ماذا عندك؟','thumma tas’al ar-rajul maadhaa ‘indak?','Then she asks the man, “What is wrong with you?”'],
     ['الرجل يقول عندي ألم في رأسي.','ar-rajul yaquul ‘indii alam fii ra’sii.','The man says, “I have pain in my head.”'],['الطبيبة تكتب بالقلم.','aT-Tabiiba taktub bi-l-qalam.','The doctor writes with the pen.'],
     ['ثم تقول للرجل مع السلامة.','thumma taquul lir-rajul ma‘a s-salaama.','Then she says goodbye to the man.'],['الرجل سعيد لأنه ذهب إلى الطبيبة.','ar-rajul sa‘iid li-’annahu dhahaba ilaa T-Tabiiba.','The man is happy because he went to the doctor.']],
  q:[['Where is Dr. Muna?','At the hospital',['At the market','At the school']],['Where does the man have pain?','In his head',['In his hand','In his back']],
     ['What does the doctor do with the pen?','Writes',['Reads','Draws']],['Who has pain in his hand?','A small boy',['The man','The doctor']]]}
});

 grammar:{notes:[
  {h:'Sun, moon, wind, sky',p:'The sun is feminine and the moon is masculine, although neither follows the ـة rule. The wind and the sky are feminine too. The adjective matches.',
   ex:[['الشمس حارة','ash-shams Haarra','The sun is hot'],['القمر جميل','al-qamar jamiil','The moon is beautiful'],['الريح باردة','ar-riiH baarida','The wind is cold'],['السماء جميلة','as-samaa’ jamiila','The sky is beautiful']]},
  {h:'The weather',p:'Describe the weather with الجو and an adjective. Say “there is” with هناك.',
   ex:[['الجو حار اليوم','al-jaww Haarr al-yawm','The weather is hot today'],['الجو بارد في الشتاء','al-jaww baarid fii sh-shitaa’','The weather is cold in winter'],['هناك مطر اليوم','hunaaka maTar al-yawm','There is rain today'],['هناك ثلج على الجبل','hunaaka thalj ‘alaa l-jabal','There is snow on the mountain']]},
  {h:'The seasons',p:'Use في before a season to say “in”.',
   ex:[['في الصيف الجو حار','fii S-Sayf al-jaww Haarr','In summer the weather is hot'],['في الشتاء هناك مطر وثلج','fii sh-shitaa’ hunaaka maTar wa thalj','In winter there is rain and snow'],['الربيع جميل','ar-rabii‘ jamiil','Spring is beautiful']]},
  {h:'More verbs: see, walk, swim',p:'These verbs work like the ones in Lesson 9: أ = I, ن = we, ي = he, ت = she.',
   ex:[['أمشي في الحديقة','amshii fii l-Hadiiqa','I walk in the garden'],['أسبح في البحر','asbaH fii l-baHr','I swim in the sea'],['أرى الجبل','araa l-jabal','I see the mountain'],['هو يسبح','huwa yasbaH','he swims']]},
  {h:'Animals',p:'Some animal words end in ـة, like قطة and سمكة. Others, like كلب, حصان and عصفور, do not. The adjective matches the word.',
   ex:[['قطة صغيرة','qiTTa Saghiira','a small cat'],['كلب كبير','kalb kabiir','a big dog'],['سمكة جميلة','samaka jamiila','a beautiful fish'],['عصفور في الشجرة','‘uSfuur fii sh-shajara','a bird in the tree']]},
  {h:'Colors with feminine words',p:'Colors have a special feminine form: أحمر → حمراء, أزرق → زرقاء, أخضر → خضراء, أبيض → بيضاء, أصفر → صفراء, أسود → سوداء. Use it with feminine words.',
   ex:[['السماء زرقاء','as-samaa’ zarqaa’','The sky is blue'],['الشجرة خضراء','ash-shajara khaDraa’','The tree is green'],['الزهرة حمراء','az-zahra Hamraa’','The flower is red'],['الثلج أبيض','ath-thalj abyaD','The snow is white (masculine)']]}
 ],
 drill:[
  {q:'How do you say “The sun is hot”?',a:'الشمس حارة',w:['الشمس حار','حارة الشمس'],ar:1,why:'الشمس is feminine, so the adjective is حارة.'},
  {q:'How do you say “The moon is beautiful”?',a:'القمر جميل',w:['القمر جميلة','جميل القمر'],ar:1,why:'القمر is masculine, so the adjective is جميل.'},
  {q:'How do you say “The weather is cold today”?',a:'الجو بارد اليوم',w:['الجو باردة اليوم','الجو بارد غداً'],ar:1,why:'الجو is masculine, and اليوم means “today”.'},
  {q:'How do you say “There is rain”?',a:'هناك مطر',w:['من مطر','متى مطر'],ar:1,why:'هناك = there is.'},
  {q:'How do you say “The sky is blue”?',a:'السماء زرقاء',w:['السماء أزرق','السماء أزرقة'],ar:1,why:'السماء is feminine, so the color takes its feminine form: زرقاء.'},
  {q:'How do you say “I swim in the sea”?',a:'أسبح في البحر',w:['يسبح في البحر','أسبح من البحر'],ar:1,why:'أ means “I”, and في means “in”.'},
  {q:'Which word means “winter”?',a:'الشتاء',w:['الصيف','الربيع'],ar:1,why:'الشتاء = winter, الصيف = summer, الربيع = spring.'},
  {q:'How do you say “The flower is red”?',a:'الزهرة حمراء',w:['الزهرة أحمر','الزهرة حمرة'],ar:1,why:'الزهرة is feminine, so the color is حمراء.'}
 ]},
 dialogue:{scene:'You are Layla. It is summer. The weather is hot, but you like summer, and you swim in the sea. You do not like winter because the weather is cold.',lines:[
  TT('كيف الجو اليوم؟','kayfa l-jaww al-yawm?','How is the weather today?'),
  YY('الجو حار','al-jaww Haarr','The weather is hot.',['الجو بارد','al-jaww baarid','The weather is cold.'],['الجو حارة','al-jaww Haarra','The weather is hot (feminine ending).']),
  TT('هل تحبين الصيف؟','hal tuHibbiin aS-Sayf?','Do you like summer?'),
  YY('نعم، أحب الصيف','na‘am, uHibb aS-Sayf','Yes, I like summer.',['نعم، أحب الشتاء','na‘am, uHibb ash-shitaa’','Yes, I like winter.'],['لا، لا أحب الصيف','laa, laa uHibb aS-Sayf','No, I do not like summer.']),
  TT('وماذا تفعلين في الصيف؟','wa maadhaa taf‘aliina fii S-Sayf?','And what do you do in summer?'),
  YY('أسبح في البحر','asbaH fii l-baHr','I swim in the sea.',['يسبح في البحر','yasbaH fii l-baHr','He swims in the sea.'],['أسبح في السماء','asbaH fii s-samaa’','I swim in the sky.']),
  TT('وهل تحبين الشتاء؟','wa hal tuHibbiin ash-shitaa’?','And do you like winter?'),
  YY('لا، لأن الجو بارد','laa, li-’anna l-jaww baarid','No, because the weather is cold.',['نعم، لأن الجو بارد','na‘am, li-’anna l-jaww baarid','Yes, because the weather is cold.'],['لا، لأن الجو حار','laa, li-’anna l-jaww Haarr','No, because the weather is hot.']),
  TT('شكراً','shukran','Thank you.'),
  YY('عفواً','‘afwan','You’re welcome.',['نعم','na‘am','Yes.'],['لا أفهم','laa afham','I don’t understand.'])
 ]},
 dialogue2:{scene:'You are Layla, talking to Karim about a trip tomorrow. You go to the mountain with Sami and Muna. It is spring, and the weather is warm and beautiful. There is snow on the mountain. You see a river and a big tree. There is a bird in the tree. You like the red flower. You do not swim in the river because the water is cold.',lines:[
  TT('ماذا تفعلين غداً؟','maadhaa taf‘aliina ghadan?','What are you doing tomorrow?'),
  YY('أذهب إلى الجبل','adhhab ilaa l-jabal','I go to the mountain.',['أذهب إلى البحر','adhhab ilaa l-baHr','I go to the sea.'],['أذهب من الجبل','adhhab mina l-jabal','I go from the mountain.']),
  TT('كيف الجو غداً؟','kayfa l-jaww ghadan?','How is the weather tomorrow?'),
  YY('الجو دافئ وجميل','al-jaww daafi’ wa jamiil','The weather is warm and beautiful.',['الجو بارد وهناك ثلج','al-jaww baarid wa hunaaka thalj','The weather is cold and there is snow.'],['الجو دافئة وجميلة','al-jaww daafi’a wa jamiila','The weather is warm and beautiful (feminine endings).']),
  TT('هل هو الصيف الآن؟','hal huwa aS-Sayf al-aan?','Is it summer now?'),
  YY('لا، هو الربيع','laa, huwa r-rabii‘','No, it is spring.',['نعم، هو الصيف','na‘am, huwa aS-Sayf','Yes, it is summer.'],['لا، هو الشتاء','laa, huwa ash-shitaa’','No, it is winter.']),
  TT('وهل هناك ثلج على الجبل؟','wa hal hunaaka thalj ‘alaa l-jabal?','And is there snow on the mountain?'),
  YY('نعم، هناك ثلج على الجبل','na‘am, hunaaka thalj ‘alaa l-jabal','Yes, there is snow on the mountain.',['نعم، هناك ثلج في البحر','na‘am, hunaaka thalj fii l-baHr','Yes, there is snow in the sea.'],['لا، هناك مطر على الجبل','laa, hunaaka maTar ‘alaa l-jabal','No, there is rain on the mountain.']),
  TT('ماذا ترين هناك؟','maadhaa tarayna hunaak?','What do you see there?'),
  YY('أرى نهراً وشجرة كبيرة','araa nahran wa shajara kabiira','I see a river and a big tree.',['يرى نهراً وشجرة كبيرة','yaraa nahran wa shajara kabiira','He sees a river and a big tree.'],['أرى بحراً وصحراء','araa baHran wa SaHraa’','I see a sea and a desert.']),
  TT('وهل ترين عصفوراً؟','wa hal tarayna ‘uSfuuran?','And do you see a bird?'),
  YY('نعم، أرى عصفوراً في الشجرة','na‘am, araa ‘uSfuuran fii sh-shajara','Yes, I see a bird in the tree.',['نعم، أرى عصفوراً في البحر','na‘am, araa ‘uSfuuran fii l-baHr','Yes, I see a bird in the sea.'],['لا، أرى كلباً في الشجرة','laa, araa kalban fii sh-shajara','No, I see a dog in the tree.']),
  TT('وماذا تحبين هناك؟','wa maadhaa tuHibbiin hunaak?','And what do you like there?'),
  YY('أحب الزهرة الحمراء','uHibb az-zahra l-Hamraa’','I like the red flower.',['أحب الزهرة الأحمر','uHibb az-zahra l-aHmar','I like the red flower (masculine ending).'],['أحب القمر الحمراء','uHibb al-qamar al-Hamraa’','I like the red moon (feminine ending).']),
  TT('هل تسبحين في النهر؟','hal tasbaHiina fii n-nahr?','Do you swim in the river?'),
  YY('لا، لأن الماء بارد','laa, li-’anna l-maa’ baarid','No, because the water is cold.',['نعم، أسبح في النهر','na‘am, asbaH fii n-nahr','Yes, I swim in the river.'],['لا، لأن الماء حار','laa, li-’anna l-maa’ Haarr','No, because the water is hot.']),
  TT('ومع من تذهبين؟','wa ma‘a man tadhhabiin?','And who do you go with?'),

LESSONS.push({id:'L16',ar:'عبارات مهذبة',en:'Polite phrases',kind:'words',
 goals:['Ask, thank, apologize and welcome politely','Reply correctly to thanks and apologies','Use the common phrases with God’s name in the right situation'],
 vocab:V([['من فضلك','min faDlik','please'],['لو سمحت','law samaHt','excuse me, please'],['شكراً','shukran','thank you'],['شكراً جزيلاً','shukran jaziilan','thank you very much'],['عفواً','‘afwan','you’re welcome, excuse me'],
  ['آسف','aasif','sorry (m.)'],['آسفة','aasifa','sorry (f.)'],['أعتذر','a‘tadhir','I apologize'],['لا بأس','laa ba’s','no problem, it is fine'],['تفضل','tafaDDal','please, go ahead (to a man)'],['تفضلي','tafaDDalii','please, go ahead (to a woman)'],
  ['طبعاً','Tab‘an','of course'],['مبروك','mabruuk','congratulations'],['تشرفنا','tasharrafnaa','pleased to meet you'],['أهلاً بك','ahlan bika','welcome (to you)'],['شكراً لك','shukran laka','thank you (to you)'],
  ['بسم الله','bismi llaah','in the name of God'],['الحمد لله','al-Hamdu lillaah','praise be to God, thank God'],['إن شاء الله','in shaa’a llaah','God willing'],['ما شاء الله','maa shaa’a llaah','God has willed it (admiration)'],
  ['جزاك الله خيراً','jazaaka llaahu khayran','may God reward you with good'],['بارك الله فيك','baaraka llaahu fiika','may God bless you'],['في أمان الله','fii amaani llaah','goodbye (in God’s protection)']]),
 grammar:{notes:[
  {h:'Asking politely',p:'من فضلك and لو سمحت both soften a request. لو سمحت is also how you get someone’s attention: “excuse me”.',
   ex:[['من فضلك، أين المسجد؟','min faDlik, ayna l-masjid?','Please, where is the mosque?'],['لو سمحت، كم الساعة؟','law samaHt, kam as-saa‘a?','Excuse me, what time is it?']]},
  {h:'Thanking, and the reply',p:'Say شكراً or شكراً جزيلاً. The reply is عفواً. A very common way to thank someone is جزاك الله خيراً. Without vowel marks it is spelled the same for a man and a woman.',
   ex:[['شكراً جزيلاً','shukran jaziilan','Thank you very much'],['عفواً','‘afwan','You’re welcome'],['جزاك الله خيراً','jazaaka llaahu khayran','May God reward you with good']]},
  {h:'Saying sorry',p:'A man says آسف and a woman says آسفة. The reply is لا بأس. أعتذر is a more formal “I apologize”.',
   ex:[['أنا آسف','anaa aasif','I am sorry (a man speaking)'],['أنا آسفة','anaa aasifa','I am sorry (a woman speaking)'],['لا بأس','laa ba’s','It’s fine']]},
  {h:'Welcome and “go ahead”',p:'أهلاً بك means “welcome”. To invite someone to go ahead or take something, say تفضل to a man and تفضلي to a woman.',
   ex:[['أهلاً بك','ahlan bika / biki','Welcome (to a man / to a woman)'],['تفضل','tafaDDal','Please, go ahead (to a man)'],['تفضلي','tafaDDalii','Please, go ahead (to a woman)']]},
  {h:'Phrases with God’s name',p:'Each has its moment. بسم الله is said before starting, for example before eating. الحمد لله is said after good news or after a meal, and when someone asks how you are. إن شاء الله is for future plans. ما شاء الله is said to admire something good.',
   ex:[['بسم الله','bismi llaah','In the name of God (before eating)'],['الحمد لله، أنا بخير','al-Hamdu lillaah, anaa bi-khayr','Thank God, I am fine'],['غداً أذهب إلى السوق إن شاء الله','ghadan adhhab ilaa s-suuq in shaa’a llaah','Tomorrow I will go to the market, God willing'],['ما شاء الله، البيت جميل','maa shaa’a llaah, al-bayt jamiil','Masha’Allah, the house is beautiful']]},
  {h:'Man or woman',p:'Several polite words change with the person: آسف / آسفة, تفضل / تفضلي. Choose the form that fits who is speaking, or who you are speaking to.',
   ex:[['تفضل','tafaDDal','to a man'],['تفضلي','tafaDDalii','to a woman'],['آسف','aasif','a man says'],['آسفة','aasifa','a woman says']]}
 ],
 drill:[

  {q:'A woman says “I am sorry”. Which is correct?',a:'أنا آسفة',w:['أنا آسف','أنا مبروك'],ar:1,why:'A woman uses the feminine form آسفة.'},
  {q:'Which phrase means “God willing”?',a:'إن شاء الله',w:['ما شاء الله','الحمد لله'],ar:1,why:'إن شاء الله is used for future plans.'},
  {q:'Which phrase do you say to admire something nice?',a:'ما شاء الله',w:['إن شاء الله','بسم الله'],ar:1,why:'ما شاء الله expresses admiration.'},
  {q:'What do you say before you start eating?',a:'بسم الله',w:['مبروك','في أمان الله'],ar:1,why:'بسم الله is said before beginning.'},

 ]},
 dialogue:{scene:'You are Layla in a shop. You politely ask the seller for bread, thank him, and say goodbye. There are no apples today.',lines:[

  TT('عفواً. أنا آسف، لا يوجد تفاح اليوم','‘afwan. anaa aasif, laa yuujad tuffaaH al-yawm','You’re welcome. I am sorry, there are no apples today.'),
  YY('لا بأس','laa ba’s','It’s fine.',['مبروك','mabruuk','Congratulations.'],['بسم الله','bismi llaah','In the name of God.']),
  TT('مع السلامة','ma‘a s-salaama','Goodbye.'),

 ]},
 dialogue2:{scene:'You are Layla, a guest at Muna’s house for dinner. You are a little late. You want tea, not coffee. The house is beautiful and the food is delicious. On Friday you will visit again, God willing.',lines:[
  TT('السلام عليكم يا ليلى! أهلاً بكِ','as-salaamu ‘alaykum yaa layla! ahlan biki','Peace be upon you, Layla! Welcome.'),
  YY('وعليكم السلام يا منى. شكراً جزيلاً','wa ‘alaykumu s-salaam yaa munaa. shukran jaziilan','And upon you peace, Muna. Thank you very much.',['مع السلامة يا منى','ma‘a s-salaama yaa munaa','Goodbye, Muna.'],['مبروك يا منى','mabruuk yaa munaa','Congratulations, Muna.']),
  TT('تفضلي','tafaDDalii','Please, come in.'),
  YY('أنا آسفة، أنا متأخرة','anaa aasifa, anaa muta’akhkhira','I am sorry, I am late.',['أنا آسف، أنا متأخرة','anaa aasif, anaa muta’akhkhira','I am sorry (a man speaking), I am late.'],['لا بأس، أنا متأخرة','laa ba’s, anaa muta’akhkhira','It’s fine, I am late.']),
  TT('لا بأس يا ليلى','laa ba’s yaa layla','It’s fine, Layla.'),
  YY('ما شاء الله، البيت جميل','maa shaa’a llaah, al-bayt jamiil','Masha’Allah, the house is beautiful.',['إن شاء الله، البيت جميل','in shaa’a llaah, al-bayt jamiil','God willing, the house is beautiful.'],['بسم الله، البيت جميل','bismi llaah, al-bayt jamiil','In the name of God, the house is beautiful.']),
  TT('شكراً! هل تشربين الشاي أو القهوة؟','shukran! hal tashrabiina ash-shaay aw al-qahwa?','Thank you! Do you drink tea or coffee?'),
  YY('شاي من فضلك','shaay min faDlik','Tea, please.',['شاي مبروك','shaay mabruuk','Tea, congratulations.'],['شاي مع السلامة','shaay ma‘a s-salaama','Tea, goodbye.']),
  TT('تفضلي','tafaDDalii','Here you are.'),
  YY('جزاك الله خيراً','jazaaka llaahu khayran','May God reward you with good.',['مبروك','mabruuk','Congratulations.'],['في أمان الله','fii amaani llaah','Goodbye.']),
  TT('الأكل جاهز. تفضلي','al-akl jaahiz. tafaDDalii','The food is ready. Please, go ahead.'),
  YY('بسم الله','bismi llaah','In the name of God.',['الحمد لله','al-Hamdu lillaah','Praise be to God.'],['مبروك','mabruuk','Congratulations.']),
  TT('هل الأكل لذيذ؟','hal al-akl ladhiidh?','Is the food delicious?'),
  YY('نعم، لذيذ، الحمد لله','na‘am, ladhiidh, al-Hamdu lillaah','Yes, it is delicious, thank God.',['نعم، لذيذ، إن شاء الله','na‘am, ladhiidh, in shaa’a llaah','Yes, it is delicious, God willing.'],['نعم، لذيذ، مبروك','na‘am, ladhiidh, mabruuk','Yes, it is delicious, congratulations.']),

  TT('حسناً، إن شاء الله. في أمان الله','Hasanan, in shaa’a llaah. fii amaani llaah','Okay, God willing. Goodbye.'),
  YY('شكراً لك يا منى، مع السلامة','shukran laki yaa munaa, ma‘a s-salaama','Thank you, Muna, goodbye.',['مرحباً يا منى','marHaban yaa munaa','Hello, Muna.'],['مبروك يا منى','mabruuk yaa munaa','Congratulations, Muna.'])
 ]},

 grammar:{notes:[
  {h:'لا + a present verb = do not',p:'To make a present-tense verb negative, put لا in front of it. The verb itself does not change.',
   ex:[['أذهب','adhhab','I go'],['لا أذهب','laa adhhab','I do not go'],['أحب القهوة','uHibb al-qahwa','I like coffee'],['لا أحب القهوة','laa uHibb al-qahwa','I do not like coffee'],['هو لا يقرأ','huwa laa yaqra’','he does not read']]},
  {h:'ليس = is not',p:'ليس is a special verb meaning “is not”. It changes with the person: ليس (he), ليست (she), لست (I), لسنا (we). After ليس, a masculine describing word usually ends in an alif sound: بارداً, طالباً. Feminine words look the same.',
   ex:[['الجو ليس بارداً','al-jaww laysa baaridan','The weather is not cold'],['المدرسة ليست بعيدة','al-madrasa laysat ba‘iida','The school is not far'],['أنا لست طالباً','anaa lastu Taaliban','I am not a student (a man speaking)'],['نحن لسنا في البيت','naHnu lasnaa fii l-bayt','We are not at home']]},
  {h:'ليس عندي = I do not have',p:'Put ليس before عند and its ending to say you do not have something.',
   ex:[['ليس عندي أخ','laysa ‘indii akh','I do not have a brother'],['ليس عندها قلم','laysa ‘indahaa qalam','She does not have a pen'],['ليس عنده كتاب','laysa ‘induhu kitaab','He does not have a book']]},
  {h:'لم = did not',p:'To say “did not”, put لم before a present-tense verb. You met this in Lesson 10.',
   ex:[['لم أذهب','lam adhhab','I did not go'],['لم تكتب','lam taktub','she did not write'],['لم نقرأ','lam naqra’','we did not read']]},
  {h:'لن = will not, سوف = will',p:'Put سـ (joined to the verb) or سوف before a present verb for “will”. Use لن for “will not”.',
   ex:[['سأذهب غداً','sa’adhhab ghadan','I will go tomorrow'],['سوف أذهب غداً','sawfa adhhab ghadan','I will go tomorrow'],['لن أذهب غداً','lan adhhab ghadan','I will not go tomorrow'],['هي لن تأكل','hiya lan ta’kul','she will not eat']]},
  {h:'Never, nor, without',p:'أبداً means “never” and goes with a negative verb. ولا means “and not” or “nor”. بدون means “without”.',
   ex:[['لا أذهب أبداً','laa adhhab abadan','I never go'],['لا أحب الشاي ولا القهوة','laa uHibb ash-shaay wa laa l-qahwa','I like neither tea nor coffee'],['أذهب بدون كريم','adhhab bi-duun kariim','I go without Karim']]}
 ],

 dialogue:{scene:'You are Layla. Karim invites you to the café, but you do not want coffee and you are not hungry. You are busy, so you will not go to the café tomorrow.',lines:[
  TT('هل تريدين قهوة؟','hal turiidiin qahwa?','Do you want coffee?'),
  YY('لا، لا أريد القهوة','laa, laa uriid al-qahwa','No, I do not want coffee.',['نعم، أريد القهوة','na‘am, uriid al-qahwa','Yes, I want coffee.'],['لا، ليس أريد القهوة','laa, laysa uriid al-qahwa','No, (wrong form) I want coffee.']),
  TT('هل أنتِ جائعة؟','hal anti jaa’i‘a?','Are you hungry?'),
  YY('لا، لست جائعة','laa, lastu jaa’i‘a','No, I am not hungry.',['لا، ليست جائعة','laa, laysat jaa’i‘a','No, she is not hungry.'],['لا، لسنا جائعة','laa, lasnaa jaa’i‘a','No, we are not hungry.']),
  TT('وهل تذهبين إلى المقهى غداً؟','wa hal tadhhabiina ilaa l-maqhaa ghadan?','And do you go to the café tomorrow?'),
  YY('لا، لن أذهب غداً','laa, lan adhhab ghadan','No, I will not go tomorrow.',['لا، لم أذهب غداً','laa, lam adhhab ghadan','No, I did not go tomorrow.'],['لا، لا أذهب أمس','laa, laa adhhab ams','No, I do not go yesterday.']),
  TT('لماذا؟','limaadhaa?','Why?'),
  YY('لأنني مشغولة','li-’annanii mashghuula','Because I am busy.',['لأنني مشغول','li-’annanii mashghuul','Because I am busy (masculine ending).'],['لأنها مشغولة','li-’annahaa mashghuula','Because she is busy.']),
  TT('لا بأس. إلى اللقاء','laa ba’s. ilaa l-liqaa’','It’s fine. See you later.'),
  YY('مع السلامة','ma‘a s-salaama','Goodbye.',['صباح الخير','SabaaHu l-khayr','Good morning.'],['لا','laa','No.'])
 ]},
 dialogue2:{scene:'You are Layla, talking to Karim. You are tired, so you are not at the university. You do not have a book today. Yesterday you did not go to the market. Today you drink neither tea nor coffee. Tomorrow you will not go to the university, but on Friday you will go. You never drink coffee at night.',lines:[
  TT('هل أنتِ في الجامعة؟','hal anti fii l-jaami‘a?','Are you at the university?'),
  YY('لا، لست في الجامعة','laa, lastu fii l-jaami‘a','No, I am not at the university.',['لا، ليست في الجامعة','laa, laysat fii l-jaami‘a','No, she is not at the university.'],['لا، لسنا في الجامعة','laa, lasnaa fii l-jaami‘a','No, we are not at the university.']),
  TT('لماذا؟','limaadhaa?','Why?'),
  YY('لأنني متعبة','li-’annanii mut‘iba','Because I am tired.',['لأنها متعبة','li-’annahaa mut‘iba','Because she is tired.'],['لأنني جائعة','li-’annanii jaa’i‘a','Because I am hungry.']),
  TT('هل عندك كتاب اليوم؟','hal ‘indaki kitaab al-yawm?','Do you have a book today?'),
  YY('لا، ليس عندي كتاب اليوم','laa, laysa ‘indii kitaab al-yawm','No, I do not have a book today.',['لا، لا عندي كتاب اليوم','laa, laa ‘indii kitaab al-yawm','No, (wrong form) I have a book today.'],['نعم، ليس عندي كتاب اليوم','na‘am, laysa ‘indii kitaab al-yawm','Yes, I do not have a book today.']),
  TT('وهل ذهبتِ إلى السوق أمس؟','wa hal dhahabti ilaa s-suuq ams?','And did you go to the market yesterday?'),
  YY('لا، لم أذهب إلى السوق أمس','laa, lam adhhab ilaa s-suuq ams','No, I did not go to the market yesterday.',['لا، لن أذهب إلى السوق أمس','laa, lan adhhab ilaa s-suuq ams','No, I will not go to the market yesterday.'],['لا، لا أذهب إلى السوق أمس','laa, laa adhhab ilaa s-suuq ams','No, I do not go to the market yesterday.']),
  TT('هل تشربين الشاي أو القهوة؟','hal tashrabiina ash-shaay aw al-qahwa?','Do you drink tea or coffee?'),
  YY('لا أشرب الشاي ولا القهوة اليوم','laa ashrab ash-shaay wa laa l-qahwa al-yawm','I drink neither tea nor coffee today.',['لا أشرب الشاي أو القهوة اليوم','laa ashrab ash-shaay aw al-qahwa al-yawm','I do not drink tea or coffee today (wrong joining word).'],['ليس أشرب الشاي ولا القهوة اليوم','laysa ashrab ash-shaay wa laa l-qahwa al-yawm','(wrong form) I drink neither tea nor coffee today.']),
  TT('وهل تذهبين إلى الجامعة غداً؟','wa hal tadhhabiina ilaa l-jaami‘a ghadan?','And do you go to the university tomorrow?'),
  YY('لا، لن أذهب غداً','laa, lan adhhab ghadan','No, I will not go tomorrow.',['لا، لم أذهب غداً','laa, lam adhhab ghadan','No, I did not go tomorrow.'],['لا، ليس أذهب غداً','laa, laysa adhhab ghadan','No, (wrong form) I go tomorrow.']),
  TT('ويوم الجمعة؟','wa yawm al-jumu‘a?','And on Friday?'),
  YY('يوم الجمعة سأذهب إلى الجامعة','yawm al-jumu‘a sa’adhhab ilaa l-jaami‘a','On Friday I will go to the university.',['يوم الجمعة لن أذهب إلى الجامعة','yawm al-jumu‘a lan adhhab ilaa l-jaami‘a','On Friday I will not go to the university.'],['يوم الجمعة لم أذهب إلى الجامعة','yawm al-jumu‘a lam adhhab ilaa l-jaami‘a','On Friday I did not go to the university.']),
  TT('وهل تشربين القهوة في الليل؟','wa hal tashrabiina al-qahwa fii l-layl?','And do you drink coffee at night?'),
  YY('لا، لا أشرب القهوة في الليل أبداً','laa, laa ashrab al-qahwa fii l-layl abadan','No, I never drink coffee at night.',['نعم، أشرب القهوة في الليل دائماً','na‘am, ashrab al-qahwa fii l-layl daa’iman','Yes, I always drink coffee at night.'],['لا، ليس أشرب القهوة في الليل أبداً','laa, laysa ashrab al-qahwa fii l-layl abadan','No, (wrong form) I never drink coffee at night.']),
  TT('حسناً. شكراً يا ليلى','Hasanan. shukran yaa layla','Okay. Thank you, Layla.'),
  YY('عفواً، مع السلامة','‘afwan, ma‘a s-salaama','You’re welcome, goodbye.',['لا أفهم','laa afham','I don’t understand.'],['مبروك يا كريم','mabruuk yaa kariim','Congratulations, Karim.'])
 ]},

 grammar:{notes:[
  {h:'Present, past and future',p:'Present verbs start with أ, ن, ي or ت. Past verbs take endings such as ـت and ـنا. Add سـ or سوف before a present verb for the future. When a verb comes first, it matches the gender of its subject.',
   ex:[['أذهب','adhhab','I go'],['ذهبت','dhahabtu','I went'],['سأذهب','sa’adhhab','I will go'],['هي تذهب','hiya tadhhab','she goes'],['ذهب كريم','dhahaba kariim','Karim went'],['ذهبت ليلى','dhahabat laylaa','Layla went']]},
  {h:'Saying “not”',p:'لا + a present verb means “do not”. ليس means “is not”. لم + a present verb means “did not”. لن + a present verb means “will not”.',
   ex:[['لا أذهب','laa adhhab','I do not go'],['أنا لست طالباً','anaa lastu Taaliban','I am not a student (a man speaking)'],['لم أذهب','lam adhhab','I did not go'],['لن أذهب','lan adhhab','I will not go']]},
  {h:'Joining ideas',p:'ثم = then, لكن = but, لأن = because, لذلك = so, عندما = when. Before a pronoun, لأن and لكن take an ending: لأنني, لكنها.',
   ex:[['قرأت الكتاب ثم كتبت','qara’tu l-kitaab thumma katabtu','I read the book, then I wrote'],['أحب القهوة لكن أشرب الشاي','uHibb al-qahwa laakin ashrab ash-shaay','I like coffee but I drink tea'],['أنا في البيت لأنني متعبة','anaa fii l-bayt li-’annanii mut‘iba','I am at home because I am tired'],['عندما أقرأ أشرب الشاي','‘indamaa aqra’ ashrab ash-shaay','When I read, I drink tea']]},

   ex:[['مدينة كبيرة','madiina kabiira','a big city'],['يد كبيرة','yad kabiira','a big hand'],['الشمس حارة','ash-shams Haarra','The sun is hot'],['السماء زرقاء','as-samaa’ zarqaa’','The sky is blue'],['القمر جميل','al-qamar jamiil','The moon is beautiful']]},
