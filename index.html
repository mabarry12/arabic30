/* ---------- STATE ---------- */
const KEY = "arabic30-v1";
const INTERVALS = [0,1,2,4,8,16,32];
const S = {day:1, tasks:{}, cards:{}, stars:0, active:[], glang:"en", islam:{done:{},best:{}}};
const UI = {tab:"today", view:1, q:null, letter:null, quiz:null, resetArm:false, gopen:null, iopen:null, iq:null};

const ALL = [];
DAYS.forEach((D,di)=>{
  D.words.forEach((w,i)=>ALL.push({id:(di+1)+"g"+i,day:di+1,ar:w[0],tr:w[1],en:w[2],q:false}));
  D.quran.forEach((w,i)=>ALL.push({id:(di+1)+"q"+i,day:di+1,ar:w[0],tr:w[1],en:w[2],q:true}));
});

const KEY2 = "arabic30-v2";
const P = {profiles:[], current:null};
const AVATARS = ["🦁","🐘","🐪","🌙","⭐","🌴","🦅","🐢"];
function blank(){ return {day:1,tasks:{},cards:{},stars:0,active:[],glang:"en",islam:{done:{},best:{}}}; }
function newId(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function curProfile(){ return P.profiles.find(p=>p.id===P.current) || P.profiles[0]; }
function snapshot(){
  const pr=curProfile(); if(!pr) return;
  pr.data={day:S.day,tasks:S.tasks,cards:S.cards,stars:S.stars,active:S.active,glang:S.glang,islam:S.islam};
  pr.updated=Date.now();
}
function loadInto(pr){
  const d=Object.assign(blank(), JSON.parse(JSON.stringify(pr.data||{})));
  d.islam=Object.assign({done:{},best:{}}, d.islam||{});
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S,d);
}
async function persist(){
  const v=JSON.stringify(P);
  try{
    if(window.storage) await window.storage.set(KEY2, v);
    else localStorage.setItem(KEY2, v);
  }catch(e){}
}
function save(){ snapshot(); persist(); }
async function load(){
  let raw=null, old=null;
  try{
    if(window.storage){
      try{ const r=await window.storage.get(KEY2); raw=r&&r.value; }catch(e){}
      if(!raw){ try{ const o=await window.storage.get(KEY); old=o&&o.value; }catch(e){} }
    }else{
      raw=localStorage.getItem(KEY2);
      if(!raw) old=localStorage.getItem(KEY);
    }
  }catch(e){}
  if(raw){
    try{ const d=JSON.parse(raw); if(d && Array.isArray(d.profiles) && d.profiles.length){ P.profiles=d.profiles; P.current=d.current; } }catch(e){}
  }
  if(!P.profiles.length){
    const data=blank();
    if(old){ try{ Object.assign(data, JSON.parse(old)); }catch(e){} }
    P.profiles=[{id:newId(),name:"Me",avatar:AVATARS[0],data,updated:Date.now()}];
    P.current=P.profiles[0].id;
  }
  if(!P.profiles.some(p=>p.id===P.current)) P.current=P.profiles[0].id;
  loadInto(curProfile());
}

/* ---------- HELPERS ---------- */
const $app = document.getElementById("app");
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function markActive(){const t=fmt(new Date()); if(!S.active.includes(t)) S.active.push(t);}
function streak(){
  let n=0; const d=new Date();
  if(!S.active.includes(fmt(d))) d.setDate(d.getDate()-1);
  while(S.active.includes(fmt(d))){n++; d.setDate(d.getDate()-1);}
  return n;
}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function taskCount(n){let c=0; for(let i=0;i<6;i++) if(S.tasks[n+":"+i]) c++; return c;}
function dayDone(n){return taskCount(n)===6;}

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200);
}
let VOICES=[];
function loadVoices(){ try{ if("speechSynthesis" in window) VOICES=speechSynthesis.getVoices()||[]; }catch(e){} }
if("speechSynthesis" in window){
  loadVoices();
  try{ speechSynthesis.addEventListener("voiceschanged",loadVoices); }catch(e){}
}
function speak(text){
  if(!("speechSynthesis" in window)){toast("Audio is not available on this device."); return;}
  loadVoices();
  const isAndroid=/Android/i.test(navigator.userAgent||"");
  const v=VOICES.find(x=>x.lang && x.lang.toLowerCase().replace("_","-").startsWith("ar"));
  if(!v && VOICES.length && !isAndroid){toast("No Arabic voice found. Add one in your device's text-to-speech settings."); return;}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=(v && v.lang) ? v.lang.replace("_","-") : "ar-SA";
  u.rate=0.8; u.volume=1;
  if(v && v.localService) u.voice=v;
  u.onerror=e=>{
    const c=e && e.error;
    if(c==="canceled" || c==="interrupted") return;
    toast(c==="language-unavailable" || c==="synthesis-unavailable"
      ? "The Arabic voice is not available. Install Arabic voice data in your text-to-speech settings."
      : "Audio error: "+(c||"unknown"));
  };
  const go=()=>{ try{ speechSynthesis.speak(u); }catch(e){ toast("Audio error: "+e.message); } };
  if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go,100); } else go();
}

/* ---------- VIEWS ---------- */
function wordRow(w){
  return `<div class="wr"><div class="wl"><span class="tr">${w[1]}</span><span class="en">${w[2]}</span></div><button class="ar" lang="ar" dir="rtl" data-a="speak" data-s="${w[0]}" aria-label="Hear ${w[1]}">${w[0]}</button></div>`;
}
function taskBlock(n,i,title,body){
  const k=n+":"+i, on=!!S.tasks[k];
  return `<section class="task ${on?"on":""}"><button class="chk" role="checkbox" aria-checked="${on}" aria-label="Done: ${title}" data-a="toggle" data-k="${k}">${on?"✓":""}</button><div class="tb"><h3>${title}</h3>${body}</div></section>`;
}

function viewToday(){
  const n=UI.view, D=DAYS[n-1], locked=n>S.day;
  const known=Object.keys(S.cards).length;
  let h=`<header class="top"><h1>Day ${n} of 30</h1><p class="theme">${D.theme}</p></header>`;
  h+=`<div class="stats"><div class="stat"><b>${streak()}</b><span>day streak</span></div><div class="stat"><b>${known}</b><span>words started</span></div><div class="stat"><b>${S.stars}</b><span>kids' stars</span></div></div>`;
  h+=`<div class="chips" role="list">`;
  for(let i=1;i<=30;i++){
    const cls=["chip"]; if(dayDone(i)) cls.push("done"); if(i===S.day) cls.push("here"); if(i>S.day) cls.push("lock"); if(i===n) cls.push("sel");
    h+=`<button class="${cls.join(" ")}" data-a="view" data-n="${i}" aria-label="Day ${i}${dayDone(i)?", finished":""}">${i}</button>`;
  }
  h+=`</div>`;
  if(locked){
    h+=`<div class="pad"><p>Day ${n} opens after you finish day ${S.day}.</p><p><button class="btn ghost" data-a="skip" data-n="${n}">Jump to day ${n}</button></p></div>`;
    return h;
  }
  if(D.tip) h+=`<p class="tip">${D.tip}</p>`;
  GRAMMAR.forEach((g,gi)=>{ if(g.day===n) h+=`<p class="tip">Grammar lesson for adults: <button class="lnk" data-a="gopen" data-i="${gi}">${g.title.en}</button></p>`; });

  let study;
  if(D.letters){
    study=taskBlock(n,0,"Learn the letters",
      `<p class="note">Tap a letter to see its sound and shapes. Say each name out loud, then write each letter three times.</p><div class="lt">${D.letters.map(l=>`<button class="ar" lang="ar" data-a="letter" data-ch="${l}" aria-label="Open letter ${l}">${l}</button>`).join("")}</div>`);
  }else{
    const t=D.study||"Read today's new words aloud from the Arabic only. Then check the transliteration. Ten minutes of reading aloud builds more than an hour of looking.";
    study=taskBlock(n,0,n<=10?"Reading and vowels":"Read aloud",`<p class="note">${t}</p>`);
  }
  const wordsBody=D.words.length
    ? `<p class="note">Tap an Arabic word to hear it.</p>${D.words.map(wordRow).join("")}`
    : `<p class="note">Nothing new today. Spend the time on review.</p>`;
  const quranBody=`<p class="note">${D.qf}</p>${D.quran.length?D.quran.map(wordRow).join(""):""}`;

  h+=`<div class="list">`
   +study
   +taskBlock(n,1,D.words.length?`New words (${D.words.length})`:"No new words today",wordsBody)
   +taskBlock(n,2,"Review your flashcards",`<p class="note">Ten minutes. Clear everything that is due.</p><button class="btn sm" data-a="tab" data-t="cards">Open flashcards</button>`)
   +taskBlock(n,3,"Say these sentences, five times each",D.pat.map(wordRow).join(""))
   +taskBlock(n,4,"Quran",quranBody)
   +taskBlock(n,5,"With the kids",`<p class="note">${D.kids}</p><button class="btn sm ghost" data-a="tab" data-t="quiz">Open the kids' quiz</button>`)
   +`</div>`;

  if(dayDone(n) && n===S.day){
    h+= n<30
      ? `<div class="done-banner"><h2>Day ${n} finished</h2><p class="note">Good work. Tomorrow is better than today if you come back.</p><button class="btn wide" data-a="next">Start day ${n+1}</button></div>`
      : `<div class="done-banner"><h2>You finished all 30 days</h2><p class="note">Keep your flashcards going every day, and book a tutor for speaking practice.</p></div>`;
  }
  h+=`<button class="reset" data-a="reset">${UI.resetArm?"Tap again to erase this profile's progress":"Reset this profile's progress"}</button>`;
  return h;
}

function buildQueue(){
  const now=Date.now();
  const unlocked=ALL.filter(c=>c.day<=S.day);
  const due=unlocked.filter(c=>S.cards[c.id] && S.cards[c.id].due<=now).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).slice(0,30);
  const fresh=unlocked.filter(c=>!S.cards[c.id]).slice(0,12);
  const ids=due.concat(fresh).map(c=>c.id);
  UI.q={queue:ids,shown:false,done:0,total:ids.length};
}
function cardById(id){return ALL.find(c=>c.id===id);}

function viewCards(){
  if(!UI.q) buildQueue();
  const q=UI.q;
  let h=`<header class="top"><h1>Flashcards</h1><p class="theme">${q.done} of ${q.total} done</p></header>`;
  if(q.queue.length===0){
    h+= q.total===0
      ? `<div class="pad"><p>Nothing is due right now.</p><p class="note">Finish today's tasks to unlock new words, or come back later for reviews.</p></div>`
      : `<div class="pad"><h2>Round finished</h2><p class="note">You went through ${q.done} cards. Cards you knew come back in 1 to 32 days. Cards you missed come back right away next round.</p><p><button class="btn" data-a="newq">Start another round</button></p></div>`;
    return h;
  }
  const c=cardById(q.queue[0]);
  h+=`<div class="fc"><span class="tag">${c.q?"Quran word, day "+c.day:"Day "+c.day}</span><div class="face"><span class="ar xl" lang="ar" dir="rtl">${c.ar}</span></div>`;
  if(q.shown){
    h+=`<div class="ans"><p class="tr2">${c.tr}</p><p class="en2">${c.en}</p><button class="btn sm ghost" data-a="speak" data-s="${c.ar}">Listen</button></div>`;
  }
  h+=`</div><div class="pad">`;
  if(!q.shown){
    h+=`<p class="note" style="margin-bottom:10px">Say it out loud and guess the meaning first.</p><button class="btn wide" data-a="reveal">Show answer</button>`;
  }else{
    h+=`<div class="row2"><button class="btn ghost" data-a="grade" data-g="0">Again</button><button class="btn" data-a="grade" data-g="1">Got it</button></div>`;
  }
  h+=`</div>`;
  return h;
}

function formsOf(ch){
  const Z="\u200D";
  if(NONJOIN.includes(ch)) return [["Alone",ch],["After a letter",Z+ch]];
  return [["Alone",ch],["Start",ch+Z],["Middle",Z+ch+Z],["End",Z+ch]];
}
function viewLetters(){

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function captureInputs(){
  const g=id=>{ const e=document.getElementById(id); return (e && typeof e.value==="string") ? e.value : null; };
  const a=g("pname"); if(a!==null) UI.newName=a;
  const b=g("pcode"); if(b!==null && UI.pbox==="import") UI.pcode=b;
  const c=g("prname"); if(c!==null) UI.prname=c;
}
function pscore(pr){
  const d=Object.assign(blank(), pr.data||{});
  let n=d.stars||0;
  n+=Object.values(d.tasks||{}).filter(Boolean).length;
  Object.values(d.cards||{}).forEach(c=>{ n+=1+((c&&c.box)||0); });
  const isl=d.islam||{};
  n+=Object.values(isl.done||{}).filter(Boolean).length;
  n+=Object.keys(isl.best||{}).length;
  return n;
}
function profStats(pr){
  const d=Object.assign(blank(), pr.data||{}); d.islam=Object.assign({done:{},best:{}}, d.islam||{});
  const now=Date.now(), cards=d.cards||{}, act=d.active||[];
  const started=Object.keys(cards).length;
  const known=Object.values(cards).filter(c=>c.box>=4).length;
  const due=ALL.filter(c=>c.day<=d.day && cards[c.id] && cards[c.id].due<=now).length;
  let daysDone=0;
  for(let n=1;n<=30;n++){ let c=0; for(let i=0;i<6;i++) if((d.tasks||{})[n+":"+i]) c++; if(c===6) daysDone++; }
  const units=ISLAM.filter((u,i)=>d.islam.done[i]).length;
  let st=0; const dt=new Date(); if(!act.includes(fmt(dt))) dt.setDate(dt.getDate()-1);
  while(act.includes(fmt(dt))){ st++; dt.setDate(dt.getDate()-1); }
  const week=[]; const letters=["S","M","T","W","T","F","S"];
  for(let k=6;k>=0;k--){ const x=new Date(); x.setDate(x.getDate()-k); week.push({on:act.includes(fmt(x)), l:letters[x.getDay()]}); }
  return {day:d.day,streak:st,daysDone,started,known,due,stars:d.stars||0,units,week};
}

function cleanProfile(ip){
  if(!ip || typeof ip.id!=="string" || !ip.data || typeof ip.data!=="object") return null;
  const d=Object.assign(blank(), ip.data); d.islam=Object.assign({done:{},best:{}}, d.islam||{});
  return {id:ip.id.slice(0,40), name:String(ip.name||"Learner").slice(0,20), avatar:AVATARS.includes(ip.avatar)?ip.avatar:AVATARS[0], data:d, updated:Number(ip.updated)||Date.now()};
}
function mergeProfiles(list){
  let added=0, updated=0;
  list.forEach(raw=>{
    const ip=cleanProfile(raw); if(!ip) return;
    const ex=P.profiles.find(x=>x.id===ip.id);
    if(!ex){ P.profiles.push(ip); added++; }
    else if(pscore(ip)>pscore(ex)){ ex.name=ip.name; ex.avatar=ip.avatar; ex.data=ip.data; ex.updated=ip.updated; updated++; }
  });
  return [added,updated];
}

function makeOpts(){
  const q=UI.quiz, c=q.qs[q.i];
  const pool=shuffle(ALL.filter(x=>x.day<=S.day && x.en!==c.en));
  const seen=new Set([c.en]), opts=[c];
  for(const x of pool){ if(opts.length>=4) break; if(!seen.has(x.en)){seen.add(x.en); opts.push(x);} }
  q.opts=shuffle(opts); q.picked=null;
}

    h+=`<div class="pad"><p class="score">${q.score} of ${q.qs.length}</p><p style="text-align:center">${q.score===q.qs.length?"Perfect round.":q.score>=7?"Great work.":"Keep going. Every round helps."} You earned ${q.score} stars.</p><p style="margin-top:14px"><button class="btn wide" data-a="qstart">Play again</button></p></div>`;
    return h;
  }
  const c=q.qs[q.i];
  h+=`<div class="q"><p class="note" style="margin-bottom:8px">Question ${q.i+1} of ${q.qs.length}</p><div class="qword"><span class="ar" lang="ar" dir="rtl">${c.ar}</span><button class="btn sm ghost" data-a="speak" data-s="${c.ar}">Listen</button></div><div class="opts">`;
  q.opts.forEach((o,k)=>{
    let cls="opt";
    if(q.picked!==null){ if(o===c) cls+=" ok"; else if(k===q.picked) cls+=" bad"; }
    h+=`<button class="${cls}" data-a="qpick" data-i="${k}" ${q.picked!==null?"disabled":""}>${o.en}</button>`;
  });
  h+=`</div>`;
  if(q.picked!==null){
    h+=`<p style="margin-bottom:10px"><b>${c.tr}</b> means ${c.en}.</p><button class="btn wide" data-a="qnext">${q.i+1>=q.qs.length?"See my score":"Next question"}</button>`;

  h+=`</div>`;

/* ---------- ACTIONS ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a;
  captureInputs();
  if(a==="speak"){ speak(el.dataset.s); return; }
  if(a!=="reset") UI.resetArm=false;
  if(a!=="pdel") UI.delArm=null;
  switch(a){
    case "tab": UI.tab=el.dataset.t; if(UI.tab==="cards") UI.q=null; window.scrollTo(0,0); break;
    case "view": UI.view=+el.dataset.n; break;
    case "skip": S.day=+el.dataset.n; UI.view=S.day; UI.q=null; save(); break;
    case "next": S.day=Math.min(S.day+1,30); UI.view=S.day; UI.q=null; save(); window.scrollTo(0,0); break;
    case "toggle": { const k=el.dataset.k; S.tasks[k]=!S.tasks[k]; if(S.tasks[k]) markActive(); save(); break; }
    case "reveal": UI.q.shown=true; break;
    case "grade": {
      const q=UI.q, id=q.queue.shift(), ok=el.dataset.g==="1";
      const c=S.cards[id]||{box:0,due:0};
      if(ok){ c.box=Math.min(c.box+1,6); c.due=Date.now()+INTERVALS[c.box]*864e5; q.done++; }
      else { c.box=0; c.due=Date.now(); q.queue.push(id); }
      S.cards[id]=c; q.shown=false; markActive(); save(); break;
    }
    case "newq": buildQueue(); break;
    case "letter": {
      if(el.dataset.ch){ UI.letter=LETTERS.findIndex(L=>L[0]===el.dataset.ch); UI.tab="letters"; window.scrollTo(0,0); }
      else { UI.letter=+el.dataset.i; window.scrollTo(0,0); }
      speak(LNAME[LETTERS[UI.letter][0]]);
      break;
    }
    case "qstart": {
      const pool=ALL.filter(c=>c.day<=S.day);
      UI.quiz={qs:shuffle(pool).slice(0,10),i:0,score:0,opts:null,picked:null};
      makeOpts(); break;
    }
    case "qpick": {
      const q=UI.quiz; if(q.picked!==null) break;
      q.picked=+el.dataset.i;
      if(q.opts[q.picked]===q.qs[q.i]) q.score++;
      break;
    }
    case "qnext": {
      const q=UI.quiz; q.i++;
      if(q.i>=q.qs.length){ S.stars+=q.score; markActive(); save(); }
      else makeOpts();
      break;
    }
    case "gopen": UI.tab="grammar"; UI.gopen=+el.dataset.i; window.scrollTo(0,0); break;
    case "gtoggle": { const i=+el.dataset.i; UI.gopen=UI.gopen===i?null:i; break; }
    case "glang": S.glang=el.dataset.l; save(); break;
    case "itoggle": { const i=+el.dataset.i; UI.iopen=UI.iopen===i?null:i; UI.iq=null; break; }
    case "idone": { const i=+el.dataset.i; S.islam.done[i]=!S.islam.done[i]; if(S.islam.done[i]) markActive(); save(); break; }
    case "iqstart": UI.iq={u:+el.dataset.i,i:0,score:0,opts:null,picked:null}; makeIOpts(); break;
    case "iqpick": {
      const q=UI.iq; if(!q || q.picked!==null) break;
      q.picked=+el.dataset.i; if(q.opts[q.picked].c) q.score++;
      break;
    }
    case "iqnext": {
      const q=UI.iq; q.i++;
      if(q.i>=ISLAM[q.u].qs.length){
        const prev=S.islam.best[q.u]||0;
        if(q.score>prev){ S.stars+=q.score-prev; S.islam.best[q.u]=q.score; }
        else if(S.islam.best[q.u]==null){ S.islam.best[q.u]=q.score; }
        markActive(); save();
      } else makeIOpts();
      break;
    }
    case "family": UI.tab="family"; UI.pbox=null; UI.renameId=null; window.scrollTo(0,0); break;
    case "pswitch": switchTo(el.dataset.id); break;
    case "pav": UI.newAv=el.dataset.v; break;
    case "padd": addProfile(); break;
    case "prename": UI.renameId=el.dataset.id; UI.prname=""; break;
    case "psave": renameProfile(el.dataset.id); break;
    case "pcancel": UI.renameId=null; UI.pbox=null; break;
    case "pdel": deleteProfile(el.dataset.id); break;
    case "pexport": UI.pbox="export"; break;
    case "pimport": UI.pbox="import"; UI.pcode=""; break;
    case "pcopy": copyCode(); break;
    case "pdoimport": doImport(); break;
    case "reset":
      if(!UI.resetArm){ UI.resetArm=true; break; }
      S.day=1; S.tasks={}; S.cards={}; S.stars=0; S.active=[]; S.islam={done:{},best:{}}; UI.iopen=null; UI.iq=null; UI.view=1; UI.q=null; UI.quiz=null; UI.resetArm=false; save(); window.scrollTo(0,0);
      break;
  }
  render();
});

/* ---------- OFFLINE SUPPORT ---------- */
if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- START ---------- */
(async()=>{
  await Promise.race([load(), new Promise(r=>setTimeout(r,1500))]);
  UI.view=Math.min(Math.max(S.day,1),30);
  render();
})();
</script>
</body>
</html>
